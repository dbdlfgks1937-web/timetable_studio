// 셀 값 문자열(예: "4", "3×2반", "3*2", "6")에서 학점과 분반 수 파싱
function parseMatrixCellInput(rawVal, defaultCredits) {
  const s = String(rawVal ?? "").trim();
  if (!s || s === "0") return { count: 0, credits: defaultCredits, totalHours: 0 };
  const mMulti = s.match(/^(\d+)\s*[×xX*]\s*(\d+)/);
  if (mMulti) {
    const cr = Number(mMulti[1]) || defaultCredits;
    const cnt = Number(mMulti[2]) || 1;
    return { count: cnt, credits: cr, totalHours: cr * cnt };
  }
  const num = Number(s.replace(/[^\d.]/g, ""));
  if (!num || num <= 0) return { count: 0, credits: defaultCredits, totalHours: 0 };
  if (defaultCredits > 0 && num >= defaultCredits * 2 && num % defaultCredits === 0) {
    const cnt = Math.round(num / defaultCredits);
    return { count: cnt, credits: defaultCredits, totalHours: num };
  }
  return { count: 1, credits: num, totalHours: num };
}

function parseAssignedTeacher(assignStr, secNum, fallbackDept, maxQuota = 6) {
  if (!assignStr || !assignStr.trim()) {
    const teacherNum = ((secNum - 1) % Math.max(1, maxQuota)) + 1;
    return `${fallbackDept}교사${teacherNum}`;
  }
  const parts = assignStr.split(",").map(s => s.trim()).filter(Boolean);
  for (const p of parts) {
    const mRange = p.match(/^([^(]+)\((\d+)\s*[~-]\s*(\d+)반?\)/);
    if (mRange) {
      const tName = mRange[1].trim();
      const s = Number(mRange[2]), e = Number(mRange[3]);
      if (secNum >= s && secNum <= e) return tName;
    }
    const mList = p.match(/^([^(]+)\(([\d,\s·/]+)반?\)/);
    if (mList) {
      const tName = mList[1].trim();
      const nums = mList[2].split(/[,·/\s]+/).map(Number).filter(Boolean);
      if (nums.includes(secNum)) return tName;
    }
    const mSingle = p.match(/^([^(]+)\((\d+)반?\)/);
    if (mSingle) {
      if (secNum === Number(mSingle[2])) return mSingle[1].trim();
    }
  }
  const cleanNames = parts.map(p => p.replace(/\(.*\)/, "").trim()).filter(Boolean);
  if (cleanNames.length > 0) {
    return cleanNames[(secNum - 1) % cleanNames.length];
  }
  return `${fallbackDept}교사${secNum}`;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function downloadCSV(filename, headers, rows) {
  const escCell = v => {
    let s = String(v ?? "");
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replaceAll('"', '""') + '"';
  };
  const body = "\ufeff" + [headers, ...rows].map(r => r.map(escCell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([body], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function createRealisticStudentPool(gradeNum, totalCount = 213, classCount = 7) {
  const prefix = gradeNum === 2 ? "1" : "2";
  return Array.from({ length: totalCount }, (_, idx) => {
    const cls = (idx % classCount) + 1;
    const num = Math.floor(idx / classCount) + 1;
    const sid = `${prefix}0${cls}${String(num).padStart(2, "0")}`;
    const name = LAST_NAMES[idx % LAST_NAMES.length] + FIRST_NAMES[(idx * 3 + cls) % FIRST_NAMES.length];
    return {
      studentId: sid,
      name,
      gender: idx % 2 === 0 ? "남" : "여",
      picks: []
    };
  });
}

// 선택과목 분반들을 이동수업 타임(A~E타임)에 배정 (수동 편집 customColCounts가 있으면 1순위 반영)
function buildDefaultBandsForCurriculum(currList) {
  const map = {};
  [2, 3].forEach(g => {
    [1, 2].forEach(s => {
      const electives = currList.filter(c => c.grade === g && c.sem === s && c.type === "선택" && !c.closed && c.sections > 0);
      const groups = Array.from(new Set(electives.map(e => e.group)));
      let bandLetterIdx = 0;
      groups.forEach(grp => {
        const items = electives.filter(e => e.group === grp);
        const kPick = Math.max(1, items[0]?.pickCount || Number((grp.match(/택(\d+)/) || [])[1]) || 1);
        const bandNames = Array.from({ length: kPick }, (_, i) => `${String.fromCharCode(65 + bandLetterIdx + i)}타임`);
        bandLetterIdx += kPick;

        const bandsObj = Object.fromEntries(bandNames.map(b => [b, []]));

        items.forEach((subj, sIdx) => {
          if (subj.customColCounts && Object.keys(subj.customColCounts).length > 0) {
            let secSeq = 1;
            Object.entries(subj.customColCounts).forEach(([colNumStr, cnt]) => {
              const colNum = Number(colNumStr);
              const countNum = Number(cnt) || 0;
              if (countNum > 0 && colNum >= 1) {
                const bandIdx = (colNum - 1) % kPick;
                const targetBand = bandNames[bandIdx];
                for (let k = 0; k < countNum; k++) {
                  bandsObj[targetBand].push({
                    uid: `${subj.id}-sec${secSeq}`,
                    subjId: subj.id,
                    secNum: secSeq,
                    bandIdx: bandIdx + 1,
                    name: subj.name,
                    dept: subj.dept,
                    credits: subj.credits,
                    estStudents: Math.round(subj.enroll / Math.max(1, subj.sections))
                  });
                  secSeq++;
                }
              }
            });
          } else {
            const offset = Math.max(0, (Number(subj.startCol) || (sIdx + 1)) - 1);
            for (let sec = 1; sec <= subj.sections; sec++) {
              const bandIdx = (offset + sec - 1) % kPick;
              const targetBand = bandNames[bandIdx];
              bandsObj[targetBand].push({
                uid: `${subj.id}-sec${sec}`,
                subjId: subj.id,
                secNum: sec,
                bandIdx: bandIdx + 1,
                name: subj.name,
                dept: subj.dept,
                credits: subj.credits,
                estStudents: Math.round(subj.enroll / subj.sections)
              });
            }
          }
        });
        map[`${g}_${s}_${grp}`] = bandsObj;
      });
    });
  });
  return map;
}

  useEffect(() => {

        separatePairsInput, randomRosters, rosterLocked, quota, lecturerHours, avgTargetHours, curriculum, bandPlan: rebuilt, teachers, councilSheet
      }));

  // [신규 3번] 타 학교 공유/집-학교 연동용 전체 작업 백업(.json) 다운로드 및 불러오기, 타학교 초기화
  const exportFullProjectJSON = () => {

  // [신규] 2단계 시간강사 등록 시 5단계 교사 명단 및 4단계 협의회 시트에 시간강사 자동 연동

      const h2 = Number(lObj?.sem2 || 0);
      const lecName = (lObj?.name || `${cat}강사`).trim();
      const existingIdx = updatedTeachers.findIndex(t => t.role === "시간강사" && (t.dept === cat || t.name === lecName));

      if (h1 > 0 || h2 > 0) {
        if (existingIdx === -1) {
          updatedTeachers.push({
            id: `lec-${cat}-${Date.now()}`,
            name: lecName,
            dept: cat,
            role: "시간강사",
            maxPerDay: 4,

          });

  // 1단계: 편제표 업로드
  const handleCurriculumFileUpload = async (file) => {
    if (!file) return;
    const ext = file.name.split(".").pop()?.toLowerCase();
    if (["xlsx", "xls", "csv"].includes(ext)) {
      try {
        const buf = await file.arrayBuffer();
        const wb = window.XLSX.read(new Uint8Array(buf), { type: "array" });
        const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
        const parsed = [];
        rows.slice(1).forEach((r, idx) => {
          const grade = Number(String(r[0]).replace(/\D/g, ""));
          const sem = Number(String(r[1]).replace(/\D/g, "")) || 1;
          const type = String(r[2] || "").includes("선택") ? "선택" : "지정";
          const group = String(r[3] || (type === "지정" ? "학교지정" : `${sem}학기 [택3]`)).trim();
          const name = String(r[4] || "").trim();
          const credits = Number(r[5]) || 3;
          let dept = String(r[6] || "").trim();
          if (name.includes("통합사회")) dept = "통합사회";
          else if (name.includes("통합과학") || name.includes("과학탐구실험")) dept = "통합과학";
          else if (!QUOTA_CATEGORIES.includes(dept)) dept = "기타";

          if (grade >= 1 && grade <= 3 && name) {
            parsed.push({
              id: `up-${grade}-${sem}-${idx}`,
              grade, sem, type, group, name, credits, dept,
              pickCount: Number((group.match(/택(\d+)/) || [])[1]) || 1,
              enroll: grade === 1 ? 210 : 60,
              sections: type === "지정" ? (classCounts[grade] || 7) : 2,
              startCol: 1,
              splitMode: "none",
              teacherAssign: ""
            });
          }
        });
        if (parsed.length > 0) {
          setCurriculum(parsed);
          setToast(`편제표 파일에서 총 ${parsed.length}개 과목 편제를 성공적으로 불러왔습니다!`);
        } else {
          alert("유효한 편제표 행을 찾지 못했습니다.");
        }
      } catch (e) {
        alert("편제표 엑셀 분석 오류: " + e.message);
      }
      return;
    }

    if (ext === "pdf") {
      let keyToUse = aiApiKey.trim();
      if (!keyToUse) {
        const keyInput = prompt("PDF 편제표 AI 자동 분석을 위해 Gemini API 키를 입력해 주세요:");
        if (!keyInput) return;
        keyToUse = keyInput.trim();
        setAiApiKey(keyToUse);
      }
      setAiBusy(true);
      try {
        const bytes = new Uint8Array(await file.arrayBuffer());
        let binary = "";
        for (let i = 0; i < bytes.length; i += 32768) binary += String.fromCharCode(...bytes.subarray(i, i + 32768));
        const base64 = btoa(binary);
        const promptText = `첨부된 고등학교 교육과정 편제표 PDF를 분석하여 학년별·학기별 과목 목록을 JSON 배열로 반환하세요.
각 원소 형식: {"grade":1~3 정수, "sem":1~2 정수, "type":"지정" 또는 "선택", "group":"학교지정" 또는 "1학기 [택3]" 등, "name":"과목명", "credits":학점(1~4 정수), "dept":"국어/수학/영어/도덕/역사/지리/일반사회/통합사회/물리/화학/생물/지구과학/통합과학/체육/음악/미술/정보/중국어/일본어/교육학/보건/기타 중 택1"}`;
        const res = await fetch(`${API_BASE}/models/gemini-2.5-flash:generateContent`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": keyToUse },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: promptText }, { inlineData: { mimeType: "application/pdf", data: base64 } }] }],
            generationConfig: { temperature: 0.1, responseMimeType: "application/json" }
          })
        });
        const data = await res.json();
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
        const arr = JSON.parse(rawText);
        if (Array.isArray(arr) && arr.length > 0) {
          const mapped = arr.map((x, idx) => {
            let d = QUOTA_CATEGORIES.includes(x.dept) ? x.dept : "기타";
            if (String(x.name).includes("통합사회")) d = "통합사회";
            if (String(x.name).includes("통합과학") || String(x.name).includes("과학탐구실험")) d = "통합과학";
            return {
              id: `ai-${x.grade}-${x.sem}-${idx}`,
              grade: Number(x.grade) || 1,
              sem: Number(x.sem) || 1,
              type: x.type === "선택" ? "선택" : "지정",
              group: x.group || (x.type === "선택" ? `${x.sem}학기 [택3]` : "학교지정"),
              pickCount: Number((String(x.group || "").match(/택(\d+)/) || [])[1]) || 3,
              name: x.name || `과목${idx}`,
              credits: Number(x.credits) || 3,
              dept: d,
              enroll: x.type === "선택" ? 60 : 210,
              sections: x.type === "선택" ? 2 : (classCounts[x.grade] || 7),
              startCol: 1,
              splitMode: "none",
              teacherAssign: ""
            };
          });
          setCurriculum(mapped);
          setToast(`AI가 PDF 편제표에서 총 ${mapped.length}개 과목과 학점을 자동 추출했습니다!`);
        }
      } catch (e) {
        alert("PDF AI 분석 실패: " + e.message);
      } finally {
        setAiBusy(false);
      }
    }
  };

  // 2단계: 정원표 양식 다운로드 및 업로드
  const downloadQuotaTemplate = () => {
    downloadCSV(
      `${schoolName}_교과군별_정원및시간강사_양식.csv`,

      QUOTA_CATEGORIES.map(cat => [cat, quota[cat] || 0, lecturerHours[cat]?.sem1 || 0, lecturerHours[cat]?.sem2 || 0, lecturerHours[cat]?.name || `${cat}강사`])
    );

  const handleQuotaUpload = async (file) => {

      const wb = window.XLSX.read(new Uint8Array(buf), { type: "array" });

    }

  // 3단계: 리로스쿨 수강신청 파일 업로드
  const handleRiroUpload = async (gradeNum, file) => {
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = window.XLSX.read(new Uint8Array(buf), { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
      if (rows.length < 4) throw Error("리로스쿨 수강신청 통계 양식(최소 4행 이상)이 아닙니다.");

      const headerGroupRow = rows[0];
      const subjNameRow = rows[1];
      const totalRow = rows[2];

      let curGroup = "";
      const colMeta = [];
      for (let c = 7; c < subjNameRow.length; c++) {
        const gRaw = String(headerGroupRow[c] || "").trim();
        if (gRaw && !gRaw.startsWith("Unnamed")) curGroup = gRaw.replace(/\.\d+$/, "");
        const sName = String(subjNameRow[c] || "").trim();
        if (!sName || sName === "nan") continue;
        const semMatch = curGroup.startsWith("2학기") ? 2 : 1;
        const pickMatch = curGroup.match(/택(\d+)/);
        const pickCount = pickMatch ? Number(pickMatch[1]) : 1;
        colMeta.push({ colIndex: c, group: curGroup, sem: semMatch, pickCount, name: sName, total: Number(totalRow[c]) || 0 });
      }

      const stuList = [];
      for (let r = 3; r < rows.length; r++) {
        const row = rows[r];
        const sid = String(row[1] || "").trim().replace(/\.0$/, "");
        const sname = String(row[2] || "").trim();
        if (!sname || sname === "합계" || sname === "이름") continue;
        const picks = [];
        colMeta.forEach(m => {
          const cellVal = String(row[m.colIndex] ?? "").trim();
          if (cellVal === "1" || cellVal === "1.0" || Number(cellVal) === 1) {
            picks.push({ sem: m.sem, group: m.group, name: m.name });
          }
        });
        stuList.push({ studentId: sid, name: sname, gender: String(row[3] || "").trim(), picks });
      }

      setRiroStudents(prev => ({ ...prev, [gradeNum]: stuList }));

      const nextCurr = curriculum.map(item => {
        if (item.grade !== gradeNum || item.type !== "선택") return item;
        const matched = colMeta.find(m => m.sem === item.sem && m.name.replace(/\s+/g, "") === item.name.replace(/\s+/g, ""));
        if (!matched) return item;
        const enroll = matched.total;
        const recSec = enroll === 0 ? 0 : Math.max(1, Math.round(enroll / 28));
        return { ...item, enroll, sections: recSec, closed: enroll === 0, customColCounts: undefined };
      });
      setCurriculum(nextCurr);
      setToast(`${gradeNum}학년 리로스쿨 파일에서 실제 학생 ${stuList.length}명의 성명과 선택과목을 완벽히 불러왔습니다!`);
    } catch (e) {
      alert("파일 분석 오류: " + e.message);
    }
  };

  // 학폭·생활지도 분리 학생 조건을 반영한 무작위(랜덤) 분반 학생 배정 (잠금 보호 포함)
  const generateRandomSectionRosters = (gradeNum, semNum) => {
    const lockKey = `${gradeNum}_${semNum}`;
    if (rosterLocked[lockKey]) {
      alert(`🔒 현재 [${gradeNum}학년 ${semNum}학기] 분반 명단이 [고정(잠금)] 상태입니다!\n실수로 명단이 뒤바뀌는 것을 방지하고 있습니다. 다시 추첨하려면 우측의 [🔒 명단 고정 해제] 버튼을 먼저 눌러주세요.`);
      return;
    }
    const electives = curriculum.filter(c => c.grade === gradeNum && c.sem === semNum && c.type === "선택" && !c.closed && c.sections > 0);
    const uploadedPool = riroStudents[gradeNum] || [];
    const fallbackPool = createRealisticStudentPool(gradeNum, gradeNum === 2 ? 213 : 183, classCounts[gradeNum] || 7);

    const avoidPairs = separatePairsInput
      .split(",")
      .map(pairStr => pairStr.trim().split(/[-~·/\s]+/).map(s => s.trim()).filter(Boolean))
      .filter(arr => arr.length >= 2);

    const matchStudentToken = (st, token) => st.name === token || st.studentId === token || `${st.studentId}${st.name}` === token;

    const nextRosters = { ...randomRosters };
    const nextLogs = [];

    electives.forEach(subj => {
      let applicants = uploadedPool.filter(st => st.picks.some(p => p.sem === semNum && p.name.replace(/\s+/g, "") === subj.name.replace(/\s+/g, "")));
      if (applicants.length === 0 && subj.enroll > 0) {
        applicants = fallbackPool.slice(0, subj.enroll);
      }

      const secCount = Math.max(1, subj.sections);
      let bestBuckets = [];

      for (let attempt = 0; attempt < 50; attempt++) {
        const shuffled = shuffleArray(applicants);
        const buckets = Array.from({ length: secCount }, (_, i) => ({ secNum: i + 1, students: [] }));
        shuffled.forEach((st, idx) => {
          buckets[idx % secCount].students.push(st);
        });

        if (secCount === 1) {
          bestBuckets = buckets;
          avoidPairs.forEach(([t1, t2]) => {
            const has1 = applicants.find(st => matchStudentToken(st, t1));
            const has2 = applicants.find(st => matchStudentToken(st, t2));
            if (has1 && has2 && attempt === 0) {
              nextLogs.push({
                type: "warning",
                subjName: subj.name,
                msg: `[${subj.name}] 과목은 1개 분반만 개설되어 분리 대상(${has1.name} ↔ ${has2.name})이 함께 편성됨 (분반 추가 또는 과목변경 상담 필요)`
              });
            }
          });
          break;
        }

        let violated = false;
        for (const [t1, t2] of avoidPairs) {
          for (const b of buckets) {
            const has1 = b.students.some(st => matchStudentToken(st, t1));
            const has2 = b.students.some(st => matchStudentToken(st, t2));
            if (has1 && has2) {
              violated = true;
              break;
            }
          }
          if (violated) break;
        }

        bestBuckets = buckets;
        if (!violated) {
          avoidPairs.forEach(([t1, t2]) => {
            const b1 = buckets.find(b => b.students.some(st => matchStudentToken(st, t1)));
            const b2 = buckets.find(b => b.students.some(st => matchStudentToken(st, t2)));
            if (b1 && b2 && b1.secNum !== b2.secNum) {
              const s1Obj = b1.students.find(st => matchStudentToken(st, t1));
              const s2Obj = b2.students.find(st => matchStudentToken(st, t2));
              nextLogs.push({
                type: "success",
                subjName: subj.name,
                msg: `[${subj.name}] 분리 배정 완료: ${s1Obj.name}(${b1.secNum}분반) ↔ ${s2Obj.name}(${b2.secNum}분반)`
              });
            }
          });
          break;
        }
      }

      bestBuckets.forEach(b => b.students.sort((a, b2) => String(a.studentId).localeCompare(String(b2.studentId))));
      nextRosters[subj.id] = bestBuckets;
    });

    setRandomRosters(nextRosters);
    setSeparationLogs(nextLogs);
    if (electives[0]) setPreviewRosterSubj(electives[0].id);
    setToast(`${gradeNum}학년 ${semNum}학기 분반별 학생 실명 무작위 배정(학폭·생활지도 분리 반영)이 완료되었습니다!`);
  };

  const exportRandomRostersXLSX = (gradeNum, semNum) => {
    const electives = curriculum.filter(c => c.grade === gradeNum && c.sem === semNum && c.type === "선택" && !c.closed && c.sections > 0);
    const allRows = [["학년", "학기", "선택그룹", "과목명", "분반", "연번", "학번", "성명", "성별"]];
    electives.forEach(subj => {
      const buckets = randomRosters[subj.id] || [];
      buckets.forEach(b => {
        b.students.forEach((st, idx) => {
          allRows.push([`${gradeNum}학년`, `${semNum}학기`, subj.group, subj.name, `${b.secNum}분반`, idx + 1, st.studentId, st.name, st.gender]);
        });
      });
    });
    if (allRows.length === 1) {
      alert("먼저 [🎲 학생 분리 반영 · 분반별 실명 무작위(랜덤) 배정 실행] 버튼을 눌러 명단을 생성해 주세요.");
      return;
    }
    const wb = window.XLSX.utils.book_new();
    const ws = window.XLSX.utils.aoa_to_sheet(allRows);
    window.XLSX.utils.book_append_sheet(wb, ws, `${gradeNum}학년_${semNum}학기_분반명단`);
    window.XLSX.writeFile(wb, `${schoolName}_${gradeNum}학년_${semNum}학기_선택과목_무작위분반명단.xlsx`);
  };

  // 정원 구분별 시수 집계
  const hoursByDept = useMemo(() => {
    const map = {};
    QUOTA_CATEGORIES.forEach(c => {
      map[c] = { sem1: 0, sem2: 0, subjs1: [], subjs2: [] };
    });

    curriculum.forEach(item => {
      if (item.closed || item.sections <= 0) return;
      const totalH = item.credits * item.sections;
      const semKey = item.sem === 1 ? "sem1" : "sem2";
      const listKey = item.sem === 1 ? "subjs1" : "subjs2";

      if (item.name.includes("통합사회")) {
        map["통합사회"][semKey] += totalH;
        map["통합사회"][listKey].push(`${item.grade}학년 ${item.name}(${item.credits}h×${item.sections}반=${totalH}h)`);
        return;
      }
      if (item.name.includes("통합과학") || item.name.includes("과학탐구실험")) {
        map["통합과학"][semKey] += totalH;
        map["통합과학"][listKey].push(`${item.grade}학년 ${item.name}(${item.credits}h×${item.sections}반=${totalH}h)`);
        return;
      }

      if (item.splitMode === "split" && Array.isArray(item.splitDepts) && item.splitDepts.length > 0) {
        item.splitDepts.forEach(sp => {
          const [dName, creditPart] = sp.split(":");
          const h = (Number(creditPart) || 1) * item.sections;
          const targetDept = map[dName] ? dName : "기타";
          map[targetDept][semKey] += h;
          map[targetDept][listKey].push(`${item.grade}학년 ${item.name}(${creditPart}h×${item.sections}반=${h}h)`);
        });
      } else {
        const targetDept = map[item.dept] ? item.dept : "기타";
        map[targetDept][semKey] += totalH;
        map[targetDept][listKey].push(`${item.grade}학년 ${item.name}(${item.credits}h×${item.sections}반=${totalH}h)`);
      }
    });
    return map;
  }, [curriculum]);

  const autoFillAllLecturers = () => {
    const next = { ...lecturerHours };
    QUOTA_CATEGORIES.forEach(cat => {
      if (cat === "통합사회" || cat === "통합과학") return;
      const q = Number(quota[cat] || 0);
      const cap = Math.round(q * avgTargetHours);
      const need1 = Math.max(0, (hoursByDept[cat]?.sem1 || 0) - cap);
      const need2 = Math.max(0, (hoursByDept[cat]?.sem2 || 0) - cap);
      if (need1 > 0 || need2 > 0) {
        next[cat] = { ...next[cat], sem1: need1, sem2: need2, name: next[cat]?.name || `${cat}강사` };
      }
    });
    setLecturerHours(next);
    syncLecturersToTeacherList(next);
  };

  // =========================================================================
  // [4단계 핵심]
  // 1) 상단 시수배분표: customColCounts(담당자 수동 수정값) 1순위 반영
  // 2) 하단 협의회 기입란: 정규교사 + 2단계 시간강사 자동 포함, 직접 입력 및 검증
  // =========================================================================
  const buildMatrixDataForGroup = (groupName, semNum) => {
    const targetDepts = MATRIX_DEPT_TABS[groupName] || ["국어"];
    const c1 = classCounts[1] || 7;
    const c2 = classCounts[2] || 7;
    const c3 = classCounts[3] || 7;

    const colHeaders = [
      ...Array.from({ length: c1 }, (_, i) => ({ grade: 1, col: i + 1, key: `1-${i + 1}`, label: `1-${i + 1}`, fullLabel: `1학년 ${i + 1}반` })),
      ...Array.from({ length: c2 }, (_, i) => ({ grade: 2, col: i + 1, key: `2-${i + 1}`, label: `2-${i + 1}`, fullLabel: `2학년 ${i + 1}반/T` })),
      ...Array.from({ length: c3 }, (_, i) => ({ grade: 3, col: i + 1, key: `3-${i + 1}`, label: `3-${i + 1}`, fullLabel: `3학년 ${i + 1}반/T` }))
    ];

    const rawItems = curriculum.filter(it => {
      if (it.sem !== semNum || it.closed || it.sections <= 0) return false;
      if (it.name.includes("통합사회") && targetDepts.includes("통합사회")) return true;
      if ((it.name.includes("통합과학") || it.name.includes("과학탐구실험")) && targetDepts.includes("통합과학")) return true;
      if (it.splitMode === "split" && Array.isArray(it.splitDepts)) {
        return it.splitDepts.some(sp => targetDepts.includes(sp.split(":")[0]));
      }
      return targetDepts.includes(it.dept);
    });

    const subjectRows = rawItems.map(it => {
      let effectiveCredits = it.credits;
      if (it.splitMode === "split" && Array.isArray(it.splitDepts) && !it.name.includes("통합")) {
        effectiveCredits = it.splitDepts
          .filter(sp => targetDepts.includes(sp.split(":")[0]))
          .reduce((acc, sp) => acc + (Number(sp.split(":")[1]) || 0), 0);
      }

      const kPick = it.type === "선택"
        ? Math.max(1, it.pickCount || Number((String(it.group).match(/택(\d+)/) || [])[1]) || 1)
        : (classCounts[it.grade] || 7);

      const secCountPerCol = {};
      if (it.customColCounts && Object.keys(it.customColCounts).length > 0) {
        Object.entries(it.customColCounts).forEach(([cStr, cnt]) => {
          if (Number(cnt) > 0) secCountPerCol[Number(cStr)] = Number(cnt);
        });
      } else if (it.type === "지정") {
        for (let c = 1; c <= it.sections; c++) secCountPerCol[c] = 1;
      } else {
        const sCol = Math.max(1, Number(it.startCol) || 1);
        for (let k = 0; k < it.sections; k++) {
          const targetCol = ((sCol - 1 + k) % kPick) + 1;
          secCountPerCol[targetCol] = (secCountPerCol[targetCol] || 0) + 1;
        }
      }

      const cells = colHeaders.map(ch => {
        if (ch.grade !== it.grade) return "";
        const cnt = secCountPerCol[ch.col] || 0;
        if (cnt === 0) return "";
        return cnt === 1 ? String(effectiveCredits) : `${effectiveCredits}×${cnt}`;
      });

      const cellTeacherCounts = colHeaders.map(ch => {
        if (ch.grade !== it.grade) return 0;
        return secCountPerCol[ch.col] || 0;
      });

      const cellHourSums = colHeaders.map(ch => {
        if (ch.grade !== it.grade) return 0;
        return (secCountPerCol[ch.col] || 0) * effectiveCredits;
      });

      const totalSecCount = Object.values(secCountPerCol).reduce((a, b) => a + b, 0);
      const rowSum = totalSecCount * effectiveCredits;

      return {
        id: it.id,
        name: it.name,
        grade: it.grade,
        type: it.type,
        group: it.group,
        pickCount: kPick,
        dept: it.dept,
        sections: totalSecCount,
        startCol: it.startCol || 1,
        credits: effectiveCredits,
        hasCustom: !!(it.customColCounts && Object.keys(it.customColCounts).length > 0),
        cells,
        cellTeacherCounts,
        cellHourSums,
        rowSum
      };
    });

    const colSimultaneousTeachers = colHeaders.map((ch, colIdx) => {
      return subjectRows.reduce((sum, sr) => sum + (sr.cellTeacherCounts[colIdx] || 0), 0);
    });

    const colRequiredHours = colHeaders.map((ch, colIdx) => {
      return subjectRows.reduce((sum, sr) => sum + (sr.cellHourSums[colIdx] || 0), 0);
    });

    const maxGrade1Sim = Math.max(0, ...colHeaders.map((ch, idx) => ch.grade === 1 ? colSimultaneousTeachers[idx] : 0));
    const maxGrade2Sim = Math.max(0, ...colHeaders.map((ch, idx) => ch.grade === 2 ? colSimultaneousTeachers[idx] : 0));
    const maxGrade3Sim = Math.max(0, ...colHeaders.map((ch, idx) => ch.grade === 3 ? colSimultaneousTeachers[idx] : 0));

    const singleBandPeak = Math.max(0, ...colSimultaneousTeachers);
    const combinedGradePeak = maxGrade1Sim + maxGrade2Sim + maxGrade3Sim;

    const groupQuotaCount = targetDepts.reduce((a, d) => a + Number(quota[d] || 0), 0);
    const semKey = semNum === 1 ? "sem1" : "sem2";
    const groupLecturerHours = targetDepts.reduce((a, d) => a + Number(lecturerHours[d]?.[semKey] || 0), 0);
    const activeLecturersInGroup = targetDepts
      .filter(d => Number(lecturerHours[d]?.[semKey] || 0) > 0)
      .map(d => ({ dept: d, name: lecturerHours[d]?.name || `${d}강사`, hours: Number(lecturerHours[d]?.[semKey] || 0) }));

    const totalGroupHours = subjectRows.reduce((a, sr) => a + sr.rowSum, 0);
    const netRegularHours = Math.max(0, totalGroupHours - groupLecturerHours);
    const avgPerTeacher = groupQuotaCount > 0 ? (netRegularHours / groupQuotaCount).toFixed(1) : "0.0";

    // 하단 협의회 기입란 기본 행 수: 정규정원 + 시간강사 수 (최소 6행)
    const defaultRowCount = Math.max(6, groupQuotaCount + activeLecturersInGroup.length);

    return {
      colHeaders,
      subjectRows,
      colSimultaneousTeachers,
      colRequiredHours,
      maxGrade1Sim,
      maxGrade2Sim,
      maxGrade3Sim,
      singleBandPeak,
      combinedGradePeak,
      groupQuotaCount,
      groupLecturerHours,
      activeLecturersInGroup,
      totalGroupHours,
      netRegularHours,
      avgPerTeacher,
      defaultRowCount
    };
  };

  // [신규] 4단계 상단 과목별 시수 셀 직접 수정 핸들러 -> 분반 수 및 다음 단계 자동 연동
  const handleUpperMatrixCellEdit = (subjId, colNum, rawVal, defaultCredits) => {
    setCurriculum(prev => prev.map(it => {
      if (it.id !== subjId) return it;
      const kPick = it.type === "선택"
        ? Math.max(1, it.pickCount || Number((String(it.group).match(/택(\d+)/) || [])[1]) || 1)
        : (classCounts[it.grade] || 7);

      // 기존 열별 분반 분포 복사
      const nextColCounts = {};
      if (it.customColCounts && Object.keys(it.customColCounts).length > 0) {
        Object.assign(nextColCounts, it.customColCounts);
      } else if (it.type === "지정") {
        for (let c = 1; c <= it.sections; c++) nextColCounts[c] = 1;
      } else {
        const sCol = Math.max(1, Number(it.startCol) || 1);
        for (let k = 0; k < it.sections; k++) {
          const targetCol = ((sCol - 1 + k) % kPick) + 1;
          nextColCounts[targetCol] = (nextColCounts[targetCol] || 0) + 1;
        }
      }

      const parsed = parseMatrixCellInput(rawVal, defaultCredits);
      if (parsed.count <= 0) {
        delete nextColCounts[colNum];
      } else {
        nextColCounts[colNum] = parsed.count;
      }

      const newTotalSections = Object.values(nextColCounts).reduce((a, b) => a + b, 0);
      return {
        ...it,
        customColCounts: nextColCounts,
        sections: newTotalSections,
        closed: newTotalSections <= 0
      };
    }));
  };

  // [신규] 선택군 내 같은 교과군 과목들의 시작 타임을 자동으로 엇갈리게 배치하여 동시 필요 교사 수(Peak) 최소화
  const optimizeSimultaneousPeak = (groupName, semNum) => {
    const targetDepts = MATRIX_DEPT_TABS[groupName] || ["국어"];
    const nextCurr = curriculum.map(it => ({ ...it }));

    [2, 3].forEach(g => {
      const electives = nextCurr.filter(c => c.grade === g && c.sem === semNum && c.type === "선택" && !c.closed && c.sections > 0 && targetDepts.includes(c.dept));
      const groups = Array.from(new Set(electives.map(e => e.group)));

      groups.forEach(grp => {
        const items = electives.filter(e => e.group === grp);
        const kPick = Math.max(1, items[0]?.pickCount || Number((grp.match(/택(\d+)/) || [])[1]) || 1);
        const colLoad = Array.from({ length: kPick }, () => 0);

        // 분반 수가 많은 과목부터 가장 덜 붐비는 타임에 순차 배치
        items.sort((a, b) => b.sections - a.sections).forEach(subj => {
          const customCounts = {};
          for (let s = 0; s < subj.sections; s++) {
            let minColIdx = 0;
            for (let ci = 1; ci < kPick; ci++) {
              if (colLoad[ci] < colLoad[minColIdx]) minColIdx = ci;
            }
            colLoad[minColIdx]++;
            const colNum = minColIdx + 1;
            customCounts[colNum] = (customCounts[colNum] || 0) + 1;
          }
          subj.customColCounts = customCounts;
        });
      });
    });

    setCurriculum(nextCurr);
    setToast(`[${groupName}] 선택과목들의 이동수업 타임을 가장 고르게 분산하여 동시 필요 교사 수를 최소화했습니다!`);
  };

  // 현재 탭+학기의 하단 교과협의회 기입 행 가져오기 (없으면 정규교사+시간강사 기본 생성)
  const getCouncilRows = (groupName, semNum, mData) => {
    const sheetKey = `${groupName}_${semNum}`;
    if (Array.isArray(councilSheet[sheetKey]) && councilSheet[sheetKey].length > 0) {
      return councilSheet[sheetKey];
    }
    const targetDepts = MATRIX_DEPT_TABS[groupName] || ["국어"];
    const regNames = teachers.filter(t => targetDepts.includes(t.dept) && t.role !== "시간강사" && t.name.trim()).map(t => ({ name: t.name.trim(), role: t.role, dept: t.dept }));

    const rows = [];
    for (let i = 0; i < mData.groupQuotaCount; i++) {
      const reg = regNames[i];
      rows.push({
        id: `cr-${i}`,
        name: reg ? reg.name : "",
        role: "정규교원",
        placeholder: `${groupName.split("(")[0].replace("과", "")}교사${i + 1} 성함`,
        cells: {}
      });
    }
    mData.activeLecturersInGroup.forEach((lec, lIdx) => {
      rows.push({
        id: `cr-lec-${lIdx}`,
        name: lec.name,
        role: "시간강사",
        placeholder: `시간강사(${lec.dept} ${lec.hours}h)`,
        targetHours: lec.hours,
        cells: {}
      });
    });
    while (rows.length < 6) {
      rows.push({
        id: `cr-extra-${rows.length}`,
        name: "",
        role: "정규교원",
        placeholder: `교사 ${rows.length + 1} 성함`,
        cells: {}
      });
    }
    return rows;
  };

  const updateCouncilRow = (groupName, semNum, mData, rowIdx, updater) => {
    const sheetKey = `${groupName}_${semNum}`;
    const current = getCouncilRows(groupName, semNum, mData);
    const nextRows = current.map((r, idx) => idx === rowIdx ? updater(r) : r);
    setCouncilSheet(prev => ({ ...prev, [sheetKey]: nextRows }));
  };

  const addCouncilTeacherRow = (groupName, semNum, mData, isLecturer = false) => {
    const sheetKey = `${groupName}_${semNum}`;
    const current = getCouncilRows(groupName, semNum, mData);
    const nextRows = [
      ...current,
      {
        id: `cr-add-${Date.now()}`,
        name: isLecturer ? `${groupName.slice(0, 2)}강사` : "",
        role: isLecturer ? "시간강사" : "정규교원",
        placeholder: isLecturer ? "시간강사 성함" : `교사 ${current.length + 1} 성함`,
        cells: {}
      }
    ];
    setCouncilSheet(prev => ({ ...prev, [sheetKey]: nextRows }));
  };

  // [신규] 4단계 하단 협의회 표에 상단 시수를 바탕으로 1/N + 시간강사 자동 채우기(초안 생성)
  const autoFillCouncilSheetDraft = (groupName, semNum, mData) => {
    const sheetKey = `${groupName}_${semNum}`;
    const currentRows = getCouncilRows(groupName, semNum, mData).map((r, idx) => ({
      ...r,
      name: r.name.trim() || (r.role === "시간강사" ? r.placeholder : `${groupName.slice(0, 2)}교사${idx + 1}`),
      cells: {}
    }));

    const rowTotals = currentRows.map(() => 0);

    // 각 열(1-1 ~ 3-7)의 과목별 시수를 교사들에게 배분 (시간강사가 있으면 시간강사 목표 시수만큼 먼저 배분)
    mData.colHeaders.forEach((ch, colIdx) => {
      mData.subjectRows.forEach(sr => {
        const cnt = sr.cellTeacherCounts[colIdx] || 0;
        if (cnt <= 0) return;

        const usedTeachersInCol = new Set();
        for (let k = 0; k < cnt; k++) {
          // 1순위: 아직 목표시수를 못 채운 시간강사
          let chosenIdx = currentRows.findIndex((r, rIdx) =>
            r.role === "시간강사" &&
            !usedTeachersInCol.has(rIdx) &&
            rowTotals[rIdx] + sr.credits <= (r.targetHours || 12)
          );
          // 2순위: 현재 누적 시수가 가장 적은 정규교사
          if (chosenIdx === -1) {
            const candidates = currentRows
              .map((r, rIdx) => ({ r, rIdx, load: rowTotals[rIdx] }))
              .filter(x => !usedTeachersInCol.has(x.rIdx) && x.r.role !== "시간강사")
              .sort((a, b) => a.load - b.load);
            chosenIdx = candidates[0]?.rIdx ?? 0;
          }
          usedTeachersInCol.add(chosenIdx);
          const curVal = Number(currentRows[chosenIdx].cells[ch.key] || 0);
          currentRows[chosenIdx].cells[ch.key] = curVal + sr.credits;
          rowTotals[chosenIdx] += sr.credits;
        }
      });
    });

    setCouncilSheet(prev => ({ ...prev, [sheetKey]: currentRows }));
    setToast(`[${groupName}] 하단 협의회 기입란에 시간강사 및 1/N 균등 시수 초안을 자동 작성했습니다! 필요시 숫자와 이름을 수정하세요.`);
  };

  // [핵심] 4단계 하단 협의회 기입 결과를 5단계 과목별 담당교사 및 교사 목록에 즉시 반영!
  const applyCouncilSheetToStep5 = (groupName, semNum, mData) => {
    const rows = getCouncilRows(groupName, semNum, mData).filter(r => r.name.trim() && Object.values(r.cells || {}).some(v => Number(v) > 0));
    if (rows.length === 0) {
      alert("하단 협의회 기입란에 교사 성함과 배당 시수(숫자)를 먼저 입력하거나 [⚡ 하단 기입란 1/N 자동 채우기]를 눌러주세요.");
      return;
    }

    const targetDepts = MATRIX_DEPT_TABS[groupName] || ["국어"];

    // 1) 입력된 교사들을 5단계 teachers 목록에 자동 등록/동기화
    const nextTeachers = [...teachers];
    rows.forEach(r => {
      const cleanName = r.name.trim();
      const exists = nextTeachers.some(t => t.name === cleanName);
      if (!exists) {
        nextTeachers.push({
          id: `t-council-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          name: cleanName,
          dept: targetDepts[0] === "통합사회" ? "일반사회" : targetDepts[0] === "통합과학" ? "물리" : targetDepts[0],
          role: r.role || "정규교원",
          maxPerDay: 4,
          preferBlock: r.role === "시간강사",
          offDays: r.role === "시간강사" ? ["금"] : [],
          offSlots: [],
          memo: `4단계 [${groupName}] 협의회 시수배분표 연동`
        });
      }
    });
    setTeachers(nextTeachers);

    // 2) 각 열(1-1 ~ 3-7)에 기입된 교사 시수를 해당 열의 과목 분반에 매칭하여 teacherAssign 문자열 생성
    // 열별로 어떤 교사가 몇 시간씩 들어가는지 큐(Queue) 생성
    const colTeacherPool = {};
    mData.colHeaders.forEach(ch => {
      colTeacherPool[ch.key] = [];
      rows.forEach(r => {
        const h = Number(r.cells?.[ch.key] || 0);
        if (h > 0) {
          colTeacherPool[ch.key].push({ name: r.name.trim(), remHours: h });
        }
      });
    });

    const subjAssignMap = {};
    mData.subjectRows.forEach(sr => {
      subjAssignMap[sr.id] = {};
      let secSeq = 1;
      mData.colHeaders.forEach((ch, colIdx) => {
        if (ch.grade !== sr.grade) return;
        const cnt = sr.cellTeacherCounts[colIdx] || 0;
        if (cnt <= 0) return;

        const pool = colTeacherPool[ch.key] || [];
        for (let k = 0; k < cnt; k++) {
          // 남은 시수가 과목 학점 이상인 교사 우선 매칭
          let found = pool.find(p => p.remHours >= sr.credits) || pool.find(p => p.remHours > 0) || pool[0];
          const tName = found ? found.name : rows[(secSeq - 1) % rows.length].name.trim();
          if (found) found.remHours = Math.max(0, found.remHours - sr.credits);

          const secLabel = sr.type === "지정" ? ch.col : secSeq;
          if (!subjAssignMap[sr.id][tName]) subjAssignMap[sr.id][tName] = [];
          subjAssignMap[sr.id][tName].push(secLabel);
          secSeq++;
        }
      });
    });

    const nextCurr = curriculum.map(it => {
      const mapForSubj = subjAssignMap[it.id];
      if (!mapForSubj || Object.keys(mapForSubj).length === 0) return it;
      const formatted = Object.entries(mapForSubj)
        .map(([tName, secs]) => `${tName}(${secs.join("·")}반)`)
        .join(", ");
      return { ...it, teacherAssign: formatted };
    });

    setCurriculum(nextCurr);
    setToast(`[${groupName}] 4단계 협의회 기입 결과(${rows.length}명)가 5단계 과목별 담당교사 및 교사 명단에 완벽히 반영되었습니다!`);
  };

  // 엑셀(.xlsx) 시수배분표 다운로드 (하단 기입 내용까지 포함)

  // [5단계] 정원 + 시간강사 기반 전 과목 담당교사 원클릭 자동 배정
  const autoAssignTeachersByQuota = () => {
    const deptPools = {};
    QUOTA_CATEGORIES.forEach(cat => {
      const regTeachers = teachers.filter(t => t.dept === cat && t.role !== "시간강사" && t.name.trim()).map(t => t.name.trim());
      const qCount = Math.max(regTeachers.length, Number(quota[cat] || 0), 1);
      const pool = [...regTeachers];
      while (pool.length < qCount) {
        pool.push(`${cat}교사${pool.length + 1}`);
      }
      deptPools[cat] = pool;
    });

    const socPool = ["도덕", "역사", "지리", "일반사회"].flatMap(d => deptPools[d] || []);
    const sciPool = ["물리", "화학", "생물", "지구과학"].flatMap(d => deptPools[d] || []);
    if (socPool.length > 0) deptPools["통합사회"] = socPool;
    if (sciPool.length > 0) deptPools["통합과학"] = sciPool;

    const loadMap = { 1: {}, 2: {} };
    const getLoad = (sem, tName) => loadMap[sem][tName] || 0;
    const addLoad = (sem, tName, h) => { loadMap[sem][tName] = (loadMap[sem][tName] || 0) + h; };

    const nextCurr = curriculum.map(it => ({ ...it }));

    [1, 2].forEach(semNum => {
      const semKey = semNum === 1 ? "sem1" : "sem2";
      // 시간강사 잔여 시수 추적
      const remLecHours = {};
      QUOTA_CATEGORIES.forEach(cat => {
        const h = Number(lecturerHours[cat]?.[semKey] || 0);
        if (h > 0) {
          remLecHours[cat] = { name: lecturerHours[cat]?.name || `${cat}강사`, rem: h };
        }
      });

      // 1) 선택과목: 같은 선택군(타임) 안에서 동일 교사가 중복되지 않도록 배정
      [2, 3].forEach(g => {
        const electives = nextCurr.filter(c => c.grade === g && c.sem === semNum && c.type === "선택" && !c.closed && c.sections > 0);
        const groups = Array.from(new Set(electives.map(e => e.group)));

        groups.forEach(grp => {
          const grpItems = electives.filter(e => e.group === grp);
          const kPick = Math.max(1, grpItems[0]?.pickCount || Number((grp.match(/택(\d+)/) || [])[1]) || 1);
          const bandBusyTeachers = Array.from({ length: kPick }, () => new Set());

          const subjSecAssign = {};
          grpItems.forEach(it => { subjSecAssign[it.id] = {}; });

          grpItems.forEach((subj, sIdx) => {
            const pool = deptPools[subj.dept] || [`${subj.dept}교사1`];
            const lecInfo = remLecHours[subj.dept];

            // customColCounts가 있으면 그 타임 배치를 따르고, 없으면 startCol 기준
            const secBandList = [];
            if (subj.customColCounts && Object.keys(subj.customColCounts).length > 0) {
              Object.entries(subj.customColCounts).forEach(([colStr, cnt]) => {
                const bIdx = (Number(colStr) - 1) % kPick;
                for (let k = 0; k < Number(cnt); k++) secBandList.push(bIdx);
              });
            } else {
              const offset = Math.max(0, (Number(subj.startCol) || (sIdx + 1)) - 1);
              for (let sec = 1; sec <= subj.sections; sec++) {
                secBandList.push((offset + sec - 1) % kPick);
              }
            }

            secBandList.forEach((bandIdx, idx) => {
              const sec = idx + 1;
              const busySet = bandBusyTeachers[bandIdx];

              let chosen = null;
              if (lecInfo && lecInfo.rem >= subj.credits && !busySet.has(lecInfo.name)) {
                chosen = lecInfo.name;
                lecInfo.rem -= subj.credits;
              } else {
                const available = pool.filter(t => !busySet.has(t)).sort((a, b) => getLoad(semNum, a) - getLoad(semNum, b));
                chosen = available[0] || pool.slice().sort((a, b) => getLoad(semNum, a) - getLoad(semNum, b))[0];
              }

              busySet.add(chosen);
              subjSecAssign[subj.id][sec] = chosen;
              addLoad(semNum, chosen, subj.credits);
            });
          });

          grpItems.forEach(subj => {
            const byTeacher = {};
            Object.entries(subjSecAssign[subj.id]).forEach(([secNum, tName]) => {
              if (!byTeacher[tName]) byTeacher[tName] = [];
              byTeacher[tName].push(Number(secNum));
            });
            subj.teacherAssign = Object.entries(byTeacher)
              .map(([tName, secs]) => `${tName}(${secs.join("·")}반)`)
              .join(", ");
          });
        });
      });

      // 2) 학교지정(공통) 과목: 시간강사 잔여 시수 우선 배정 후 정규교사 1/N 배정
      [1, 2, 3].forEach(g => {
        const fixedItems = nextCurr.filter(c => c.grade === g && c.sem === semNum && c.type === "지정" && !c.closed && c.sections > 0);
        fixedItems.forEach(subj => {
          const pool = deptPools[subj.dept] || [`${subj.dept}교사1`];
          const lecInfo = remLecHours[subj.dept];
          const byTeacher = {};
          for (let sec = 1; sec <= subj.sections; sec++) {
            let chosen = null;
            if (lecInfo && lecInfo.rem >= subj.credits) {
              chosen = lecInfo.name;
              lecInfo.rem -= subj.credits;
            } else {
              const sortedPool = pool.slice().sort((a, b) => getLoad(semNum, a) - getLoad(semNum, b));
              chosen = sortedPool[0];
            }
            if (!byTeacher[chosen]) byTeacher[chosen] = [];
            byTeacher[chosen].push(sec);
            addLoad(semNum, chosen, subj.credits);
          }
          subj.teacherAssign = Object.entries(byTeacher)
            .map(([tName, secs]) => `${tName}(${secs.join("·")}반)`)
            .join(", ");
        });
      });
    });

    setCurriculum(nextCurr);
    syncLecturersToTeacherList(lecturerHours);
    setToast("정원 및 2단계 시간강사 시수를 모두 반영하여 전 학년 담당교사를 동시타임 중복 없이 자동 배정했습니다!");
  };

  // 5단계: 교사 제약조건 양식 다운로드/업로드
  const downloadTeacherTemplateCSV = () => {
    const sampleRows = teachers.length > 0
      ? teachers.map(t => [t.name, t.dept, t.role, t.maxPerDay || 4, t.preferBlock ? "Y" : "N", (t.offDays || []).join("/"), (t.offSlots || []).join("/"), t.memo || ""])
      : [["홍길동(예시)", "국어", "정규교원", 4, "N", "금", "수-1", "수1교시 및 금요일 배제 예시"]];
    downloadCSV(
      `${schoolName}_교사배정_및_제약조건_양식.csv`,
      ["교사성명","담당교과(33개구분)","직위구분(정규교원/기간제/시간강사)","1일최대시수","블록타임선호(Y/N)","전일배제요일(월~금)","배제교시(예:수-1/금-5)","비고메모"],
      sampleRows
    );
  };

  const handleTeacherCSVUpload = async (file) => {
    if (!file) return;
    const text = await file.text();
    const lines = text.replace(/^\ufeff/, "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length < 2) return;
    const parsed = lines.slice(1).map((line, idx) => {
      const cols = line.split(",").map(c => c.replace(/^"|"$/g, "").trim());
      return {
        id: "t-up-" + idx + "-" + Date.now(),
        name: cols[0] || `교사${idx + 1}`,
        dept: cols[1] || "국어",
        role: cols[2] || "정규교원",
        maxPerDay: Number(cols[3]) || 4,
        preferBlock: String(cols[4] || "").toUpperCase() === "Y",
        offDays: (cols[5] || "").split(/[\/,;\s]+/).map(s => s.trim()).filter(Boolean),
        offSlots: (cols[6] || "").split(/[\/,;\s]+/).map(s => s.trim()).filter(Boolean),
        memo: cols[7] || ""
      };
    });
    setTeachers(parsed);
    if (parsed[0]) setSelectedTeacherId(parsed[0].id);
    setToast(`총 ${parsed.length}명의 교사 명단 및 시간표 제약조건을 업로드했습니다!`);
  };

  // =========================================================================
  // [6단계 핵심 개선]
  // 시간표가 꼬였을 때를 대비한 "단일 패스 엔진 + N회 시뮬레이션 최적 탐색(Best-of-N) + 자동 충돌 해소(Auto-Repair)"
  // =========================================================================
  const runSingleTimetableAttempt = (semNum) => {
    const classGrid = {};
    const teacherGrid = {};
    const teacherFatigue = {};
    const logs = [];
    const teacherRuleMap = {};
    teachers.forEach(t => {
      teacherRuleMap[t.name] = t;
      teacherFatigue[t.name] = { p1: 0, p4: 0, p7: 0, total: 0 };
    });

    const ensureFatigue = tName => {
      if (!teacherFatigue[tName]) teacherFatigue[tName] = { p1: 0, p4: 0, p7: 0, total: 0 };
    };

    const fixedChangcheMap = {};
    if (jayulMode === "fixed" && jayulSlot) fixedChangcheMap[jayulSlot] = "창체(자율)";
    if (jinroMode === "fixed" && jinroSlot) {
      fixedChangcheMap[jinroSlot] = fixedChangcheMap[jinroSlot] ? `${fixedChangcheMap[jinroSlot]}/진로` : "창체(진로)";
    }
    if (dongariMode === "fixed" && dongariSlot) {
      fixedChangcheMap[dongariSlot] = fixedChangcheMap[dongariSlot] ? `${fixedChangcheMap[dongariSlot]}/동아리` : "창체(동아리)";
    }

    for (let g = 1; g <= 3; g++) {
      const cCnt = classCounts[g] || 7;
      for (let c = 1; c <= cCnt; c++) {
        const cKey = `${g}-${c}`;
        classGrid[cKey] = {};
        DAYS.forEach(d => {
          const maxP = dayPeriods[d] || 6;
          for (let p = 1; p <= maxP; p++) {
            const slot = `${d}-${p}`;
            if (fixedChangcheMap[slot]) {
              classGrid[cKey][slot] = { subject: fixedChangcheMap[slot], teacher: "담임/담당", dept: "창체", fixed: true };
            } else {
              classGrid[cKey][slot] = null;
            }
          }
        });
      }
    }

    const canTeacherTake = (tName, slot, dName, ignoreSoftConstraint = false) => {
      if (!tName || tName === "담임/담당") return { ok: true };
      if (teacherGrid[tName]?.[slot]) {
        return { ok: false, reason: `${tName} 교사가 동시간대(${slot})에 [${teacherGrid[tName][slot].classKey} ${teacherGrid[tName][slot].subject}] 수업 중` };
      }
      const rule = teacherRuleMap[tName];
      if (rule && !ignoreSoftConstraint) {
        if ((rule.offDays || []).includes(dName)) {
          return { ok: false, reason: `${tName}(${rule.role})의 [${dName}요일 전일 배제] 요청` };
        }
        if ((rule.offSlots || []).includes(slot)) {
          return { ok: false, reason: `${tName}(${rule.role})의 [${slot}교시 배제] 요청` };
        }
        const dayCnt = Object.keys(teacherGrid[tName] || {}).filter(k => k.startsWith(dName + "-")).length;
        if (dayCnt >= (rule.maxPerDay || 4)) {
          return { ok: false, reason: `${tName} 교사의 1일 최대시수(${rule.maxPerDay || 4}h) 초과 방지` };
        }
      }
      return { ok: true };
    };

    const calcSlotScore = (tName, dName, pNum) => {
      ensureFatigue(tName);
      const fat = teacherFatigue[tName];
      let score = Math.random() * 1.8;
      if (pNum === 1) score += fat.p1 * 6;
      if (pNum === 4) score += fat.p4 * 5;
      if (pNum === 7) score += fat.p7 * 6;
      const dayLoad = Object.keys(teacherGrid[tName] || {}).filter(k => k.startsWith(dName + "-")).length;
      score += dayLoad * 3;
      return score;
    };

    const assignClassSlot = (cKey, slot, cellObj, recordTeacher = true) => {
      classGrid[cKey][slot] = cellObj;
      const pNum = Number(slot.split("-")[1]);
      if (recordTeacher && cellObj.teacher && cellObj.teacher !== "담임/담당") {
        cellObj.teacher.split(",").map(s => s.trim()).filter(Boolean).forEach(tName => {
          const cleanT = tName.replace(/\(.*\)/, "").trim();
          if (!teacherGrid[cleanT]) teacherGrid[cleanT] = {};
          teacherGrid[cleanT][slot] = { classKey: `${cKey}반`, subject: cellObj.subject };
          ensureFatigue(cleanT);
          teacherFatigue[cleanT].total++;
          if (pNum === 1) teacherFatigue[cleanT].p1++;
          if (pNum === 4) teacherFatigue[cleanT].p4++;
          if (pNum === 7) teacherFatigue[cleanT].p7++;
        });
      }
    };

    let hardConflictCount = 0;
    let softWarningCount = 0;

    // 1. 선택군(A~E 타임) 우선 배치 (분반 수가 많고 시간강사가 포함된 타임부터 우선 배치!)
    const activeBandPlan = buildDefaultBandsForCurriculum(curriculum);
    [3, 2].forEach(g => {
      const cCnt = classCounts[g] || 7;
      const groupKeys = shuffleArray(Object.keys(activeBandPlan).filter(k => k.startsWith(`${g}_${semNum}_`)));

      groupKeys.forEach(gk => {
        const grpName = gk.split("_").slice(2).join("_");
        const bandsObj = activeBandPlan[gk] || {};
        const bandEntries = shuffleArray(Object.entries(bandsObj));

        bandEntries.forEach(([bandName, secList]) => {
          if (!secList.length) return;
          const credits = secList[0]?.credits || 3;
          const bandLabel = `${bandName}(${grpName})`;

          const usedInThisBand = new Set();
          const secTeacherAssignments = secList.map(sec => {
            const subjObj = curriculum.find(x => x.id === sec.subjId);
            const maxQ = Number(quota[sec.dept] || 6);
            let tName = parseAssignedTeacher(subjObj?.teacherAssign || "", sec.secNum, sec.dept, maxQ);
            if (usedInThisBand.has(tName)) {
              for (let altIdx = 1; altIdx <= maxQ; altIdx++) {
                const candidateT = `${sec.dept}교사${altIdx}`;
                if (!usedInThisBand.has(candidateT)) {
                  logs.push({
                    level: "타임내 교사중복 자동분산",
                    target: `${g}학년 ${bandName} ${sec.name}(${sec.secNum}반)`,
                    slot: bandName,
                    reason: `동일 타임(${bandName}) 내 ${tName} 교사 중복 배정을 방지하기 위해 [${candidateT}] 교사로 자동 분산 배정함`
                  });
                  tName = candidateT;
                  break;
                }
              }
            }
            usedInThisBand.add(tName);
            return { ...sec, teacher: tName };
          });

          const bandTeachers = Array.from(new Set(secTeacherAssignments.map(x => x.teacher)));

          let remaining = credits;
          const allCandidateSlots = [];
          shuffleArray(DAYS).forEach(d => {
            const maxP = dayPeriods[d] || 6;
            for (let p = 1; p <= maxP; p++) allCandidateSlots.push({ d, p, slot: `${d}-${p}` });
          });

          const recordBandSlot = (slot) => {
            const pNum = Number(slot.split("-")[1]);
            for (let c = 1; c <= cCnt; c++) {
              assignClassSlot(`${g}-${c}`, slot, {
                subject: bandLabel,
                teacher: `${bandName} 이동수업(${secList.length}개 분반)`,
                dept: "이동수업",
                isBand: true
              }, false);
            }
            secTeacherAssignments.forEach(sItem => {
              const cleanT = sItem.teacher;
              if (!teacherGrid[cleanT]) teacherGrid[cleanT] = {};
              teacherGrid[cleanT][slot] = { classKey: `${g}학년 ${bandName}`, subject: `${sItem.name}(${sItem.secNum}반)` };
              ensureFatigue(cleanT);
              teacherFatigue[cleanT].total++;
              if (pNum === 1) teacherFatigue[cleanT].p1++;
              if (pNum === 4) teacherFatigue[cleanT].p4++;
              if (pNum === 7) teacherFatigue[cleanT].p7++;
            });
          };

          for (const cand of allCandidateSlots) {
            if (remaining <= 0) break;
            const { d, slot } = cand;
            const alreadyOnDay = Object.keys(classGrid[`${g}-1`]).some(k => k.startsWith(d + "-") && classGrid[`${g}-1`][k]?.subject === bandLabel);
            if (alreadyOnDay) continue;
            const allFree = Array.from({ length: cCnt }, (_, i) => classGrid[`${g}-${i + 1}`][slot] === null).every(Boolean);
            if (!allFree) continue;
            if (bandTeachers.some(t => !canTeacherTake(t, slot, d, false).ok)) continue;

            recordBandSlot(slot);
            remaining--;
          }

          if (remaining > 0) {
            for (const cand of allCandidateSlots) {
              if (remaining <= 0) break;
              const { d, slot } = cand;
              const allFree = Array.from({ length: cCnt }, (_, i) => classGrid[`${g}-${i + 1}`][slot] === null).every(Boolean);
              if (!allFree) continue;
              if (bandTeachers.some(t => teacherGrid[t]?.[slot])) continue;

              const softReason = bandTeachers.map(t => canTeacherTake(t, slot, d, false)).find(r => !r.ok)?.reason;
              if (softReason) {
                softWarningCount++;
                logs.push({
                  level: "조정됨",
                  target: `${g}학년 ${bandLabel}`,
                  slot,
                  reason: `${softReason} 조건이 있었으나, ${g}학년 전 학급 동시 이동수업 슬롯 확보를 위해 [${slot}]에 우선 배정함`
                });
              }
              recordBandSlot(slot);
              remaining--;
            }
          }
        });
      });
    });

    // 2. 1·2·3학년 학교지정 과목 배치 (시간강사 및 블록타임 희망 교사 최우선 배치!)
    [1, 2, 3].forEach(g => {
      const cCnt = classCounts[g] || 7;
      const fixedSubjs = [...curriculum.filter(it => it.grade === g && it.sem === semNum && it.type === "지정" && !it.closed)];
      if (jayulMode === "random") {
        fixedSubjs.push({ id: `fl-jayul-${g}`, grade: g, sem: semNum, type: "지정", name: "창체(자율)", credits: 1, dept: "창체", teacherAssign: "담임/담당" });
      }
      if (jinroMode === "random") {
        fixedSubjs.push({ id: `fl-jinro-${g}`, grade: g, sem: semNum, type: "지정", name: "창체(진로)", credits: 1, dept: "창체", teacherAssign: "담임/담당" });
      }
      if (dongariMode === "random") {
        fixedSubjs.push({ id: `fl-dong-${g}`, grade: g, sem: semNum, type: "지정", name: "창체(동아리)", credits: 1, dept: "창체", teacherAssign: "담임/담당" });
      }

      const classOrder = shuffleArray(Array.from({ length: cCnt }, (_, i) => i + 1));
      classOrder.forEach(c => {
        const cKey = `${g}-${c}`;
        // 시간강사 또는 배제조건이 많은 교사의 과목을 먼저 배치하여 막힘(Deadlock) 방지
        const orderedSubjs = shuffleArray(fixedSubjs).sort((a, b) => {
          const tA = parseAssignedTeacher(a.teacherAssign, c, a.dept, Number(quota[a.dept] || 6));
          const tB = parseAssignedTeacher(b.teacherAssign, c, b.dept, Number(quota[b.dept] || 6));
          const rA = teacherRuleMap[tA];
          const rB = teacherRuleMap[tB];
          const prioA = (rA?.role === "시간강사" ? 100 : 0) + ((rA?.offDays?.length || 0) * 20) + (rA?.preferBlock ? 10 : 0);
          const prioB = (rB?.role === "시간강사" ? 100 : 0) + ((rB?.offDays?.length || 0) * 20) + (rB?.preferBlock ? 10 : 0);
          return prioB - prioA;
        });

        orderedSubjs.forEach(subj => {
          const maxQ = Number(quota[subj.dept] || 6);
          const tName = subj.dept === "창체" ? "담임/담당" : parseAssignedTeacher(subj.teacherAssign, c, subj.dept, maxQ);
          const tRule = teacherRuleMap[tName];
          let rem = subj.credits;

          if (tRule?.preferBlock && rem >= 2) {
            for (const d of shuffleArray(DAYS)) {
              if (rem < 2) break;
              const maxP = dayPeriods[d] || 6;
              for (let p = 1; p < maxP; p++) {
                const s1 = `${d}-${p}`, s2 = `${d}-${p + 1}`;
                if (classGrid[cKey][s1] === null && classGrid[cKey][s2] === null) {
                  if (canTeacherTake(tName, s1, d, false).ok && canTeacherTake(tName, s2, d, false).ok) {
                    assignClassSlot(cKey, s1, { subject: subj.name, teacher: tName, dept: subj.dept, isBlock: true });
                    assignClassSlot(cKey, s2, { subject: subj.name, teacher: tName, dept: subj.dept, isBlock: true });
                    rem -= 2;
                    break;
                  }
                }
              }
            }
          }

          const getSortedAvailableSlots = (ignoreSameDay, ignoreSoft) => {
            const list = [];
            DAYS.forEach(d => {
              const maxP = dayPeriods[d] || 6;
              if (!ignoreSameDay) {
                const hasSame = Array.from({ length: maxP }, (_, i) => classGrid[cKey][`${d}-${i + 1}`]?.subject === subj.name).some(Boolean);
                if (hasSame) return;
              }
              for (let p = 1; p <= maxP; p++) {
                const slot = `${d}-${p}`;
                if (classGrid[cKey][slot] !== null) continue;
                const check = canTeacherTake(tName, slot, d, ignoreSoft);
                if (check.ok) {
                  list.push({ d, p, slot, score: calcSlotScore(tName, d, p) });
                }
              }
            });
            return list.sort((a, b) => a.score - b.score);
          };

          while (rem > 0) {
            const candidates = getSortedAvailableSlots(false, false);
            if (!candidates.length) break;
            assignClassSlot(cKey, candidates[0].slot, { subject: subj.name, teacher: tName, dept: subj.dept });
            rem--;
          }
          while (rem > 0) {
            const candidates = getSortedAvailableSlots(true, false);
            if (!candidates.length) break;
            assignClassSlot(cKey, candidates[0].slot, { subject: subj.name, teacher: tName, dept: subj.dept });
            rem--;
          }
          while (rem > 0) {
            const candidates = getSortedAvailableSlots(true, true);
            if (!candidates.length) break;
            const chosen = candidates[0];
            const strictCheck = canTeacherTake(tName, chosen.slot, chosen.d, false);
            softWarningCount++;
            assignClassSlot(cKey, chosen.slot, { subject: subj.name, teacher: tName, dept: subj.dept, warning: strictCheck.reason });
            logs.push({
              level: "요구사항 미반영(내부조율)",
              target: `${cKey}반 ${subj.name} (${tName})`,
              slot: chosen.slot,
              reason: `${strictCheck.reason} 요청이 있으나, ${cKey}반 가용 교시 및 타 학년 수업 충돌 방지를 위해 [${chosen.slot}]에 배치됨`
            });
            rem--;
          }
          // [자동 충돌 해소(Kempe Swap Repair)] 빈 칸은 있는데 해당 교사가 다른 반 수업 중일 때,
          // 같은 반의 이미 배정된 다른 과목 칸과 맞바꿔서 충돌 없이 들어갈 수 있는지 탐색!
          if (rem > 0) {
            const emptySlots = [];
            DAYS.forEach(d => {
              const maxP = dayPeriods[d] || 6;
              for (let p = 1; p <= maxP; p++) {
                const sl = `${d}-${p}`;
                if (classGrid[cKey][sl] === null) emptySlots.push(sl);
              }
            });

            for (const emptySl of emptySlots) {
              if (rem <= 0) break;
              let swapped = false;
              for (const d of DAYS) {
                if (swapped) break;
                const maxP = dayPeriods[d] || 6;
                for (let p = 1; p <= maxP; p++) {
                  const occupiedSl = `${d}-${p}`;
                  const occCell = classGrid[cKey][occupiedSl];
                  if (!occCell || occCell.fixed || occCell.isBand || occCell.isBlock) continue;
                  const otherT = occCell.teacher.replace(/\(.*\)/, "").trim();
                  // tName이 occupiedSl에 비어 있고, otherT가 emptySl에 비어 있으면 두 수업을 스왑하여 충돌 완벽 해결!
                  if (!teacherGrid[tName]?.[occupiedSl] && (!otherT || otherT === "담임/담당" || !teacherGrid[otherT]?.[emptySl])) {
                    classGrid[cKey][emptySl] = occCell;
                    if (otherT && otherT !== "담임/담당" && teacherGrid[otherT]) {
                      delete teacherGrid[otherT][occupiedSl];
                      teacherGrid[otherT][emptySl] = { classKey: `${cKey}반`, subject: occCell.subject };
                    }
                    assignClassSlot(cKey, occupiedSl, { subject: subj.name, teacher: tName, dept: subj.dept });
                    rem--;
                    swapped = true;
                    break;
                  }
                }
              }
            }
          }

          if (rem > 0) {
            for (const d of DAYS) {
              const maxP = dayPeriods[d] || 6;
              for (let p = 1; p <= maxP; p++) {
                if (rem <= 0) break;
                const slot = `${d}-${p}`;
                if (classGrid[cKey][slot] === null) {
                  const conflictInfo = teacherGrid[tName]?.[slot];
                  hardConflictCount++;
                  assignClassSlot(cKey, slot, { subject: subj.name, teacher: `${tName}(조율필요)`, dept: subj.dept, conflict: true });
                  logs.push({
                    level: "교사 동시간 중복(클릭 맞교체 필요)",
                    target: `${cKey}반 ${subj.name} (${tName})`,
                    slot,
                    reason: `${tName} 교사가 [${slot}]에 ${conflictInfo?.classKey || "타"} 수업과 겹침 → 시간표 칸을 클릭하면 초록색으로 표시되는 안전 교시와 맞교체하세요.`
                  });
                  rem--;
                }
              }
            }
          }
        });
      });
    });

    return { sem: semNum, classGrid, teacherGrid, teacherFatigue, logs, hardConflictCount, softWarningCount, generatedAt: new Date().toLocaleTimeString("ko-KR") };
  };

  // [신규] N회(기본 1회 또는 30회 최적 탐색) 시뮬레이션 후 가장 충돌이 적은 최상의 시간표 채택
  const generateFullTimetable = (semNum, isReroll = false, maxAttempts = 1) => {
    let bestResult = null;
    for (let i = 0; i < maxAttempts; i++) {
      const candidate = runSingleTimetableAttempt(semNum);
      if (!bestResult) {
        bestResult = candidate;
      } else {
        const candScore = candidate.hardConflictCount * 1000 + candidate.softWarningCount * 10;
        const bestScore = bestResult.hardConflictCount * 1000 + bestResult.softWarningCount * 10;
        if (candScore < bestScore) {
          bestResult = candidate;
        }
      }
      if (bestResult.hardConflictCount === 0 && bestResult.softWarningCount === 0) break;
    }

    setMasterSchedule(bestResult);
    setSwapSource(null);
    if (!isReroll) {
      setViewMode("class");
      setViewTarget("1-1");
    }
    if (maxAttempts > 1) {
      setToast(`${maxAttempts}회 AI 시뮬레이션 탐색 완료! (충돌 ${bestResult.hardConflictCount}건 / 내부조율 ${bestResult.softWarningCount}건인 최적 시간표 채택)`);
    } else {
      setToast(`${semNum}학기 주간 시간표 ${isReroll ? "랜덤 재생성(Re-roll)" : "자동 생성"} 완료!`);
    }
  };

  // [신규] 수동 맞교체 시 두 교사가 모두 충돌하지 않는 "안전 교체 가능 교시(초록불)" 판별 함수
  const isSlotSafeForSwap = (targetSlot) => {
    if (!masterSchedule || viewMode !== "class" || !swapSource || swapSource === targetSlot) return false;
    const cellA = masterSchedule.classGrid[viewTarget]?.[swapSource];
    const cellB = masterSchedule.classGrid[viewTarget]?.[targetSlot];
    if (!cellA || cellA.isBand || cellA.fixed) return false;
    if (cellB?.isBand || cellB?.fixed) return false;

    const tA = cellA.teacher?.replace(/\(.*\)/, "").trim();
    const tB = cellB?.teacher?.replace(/\(.*\)/, "").trim();

    // tA가 targetSlot에 다른 반 수업이 없어야 하고, tB가 swapSource에 다른 반 수업이 없어야 안전!
    const tABusyAtTarget = tA && tA !== "담임/담당" && masterSchedule.teacherGrid[tA]?.[targetSlot] && masterSchedule.teacherGrid[tA]?.[targetSlot].classKey !== `${viewTarget}반`;
    const tBBusyAtSource = tB && tB !== "담임/담당" && masterSchedule.teacherGrid[tB]?.[swapSource] && masterSchedule.teacherGrid[tB]?.[swapSource].classKey !== `${viewTarget}반`;

    return !tABusyAtTarget && !tBBusyAtSource;
  };

  // 학급 시간표 셀 수동 맞교체 시 교사 시간표(teacherGrid)까지 즉시 동기화
  const handleCellSwap = (slot) => {
    if (!masterSchedule || viewMode !== "class") return;
    if (!swapSource) {
      setSwapSource(slot);
      return;
    }
    if (swapSource === slot) {
      setSwapSource(null);
      return;
    }
    const cellA = masterSchedule.classGrid[viewTarget][swapSource];
    const cellB = masterSchedule.classGrid[viewTarget][slot];
    if (cellA?.isBand || cellB?.isBand) {
      alert("학년 전체가 동시에 이동하는 선택과목(타임) 블록은 개별 반에서 단독으로 옮길 수 없습니다.");
      setSwapSource(null);
      return;
    }

    const cleanTA = cellA?.teacher?.replace(/\(.*\)/, "").trim();
    const cleanTB = cellB?.teacher?.replace(/\(.*\)/, "").trim();

    const nextClassGrid = { ...masterSchedule.classGrid, [viewTarget]: { ...masterSchedule.classGrid[viewTarget] } };
    nextClassGrid[viewTarget][swapSource] = cellB ? { ...cellB, teacher: cleanTB || cellB.teacher, conflict: false } : null;
    nextClassGrid[viewTarget][slot] = cellA ? { ...cellA, teacher: cleanTA || cellA.teacher, conflict: false } : null;

    const nextTeacherGrid = { ...masterSchedule.teacherGrid };
    if (cleanTA && cleanTA !== "담임/담당" && nextTeacherGrid[cleanTA]) {

return (

                                            onChange={e => setQuota({ ...quota, [cat]: Math.max(0, Number(e.target.value) || 0) })}
                                          />

                                          <span className="text-slate-400">/</span>

                                            {cell.warning && !isSafeTarget && <span className="no-wrap-badge rounded bg-amber-200 px-1.5 py-0.5 text-[9px] font-bold text-amber-900">요구사항조율</span>}
                                          </div>
                                        ) : (
                                          <div>
                                            <span className="text-slate-300">공강</span>
                                            {isSafeTarget && <span className="block mt-0.5 rounded bg-emerald-600 px-1.5 py-0.5 text-[9px] font-bold text-white">🟢 이동가능</span>}
                                          </div>
                                        )}
                                      </td>
                                    );
                                  } else {
                                    const tCell = masterSchedule.teacherGrid[viewTarget]?.[slot];
                                    return (
                                      <td key={slot} className="border border-line p-2.5 text-center">
                                        {tCell ? (
                                          <div className="space-y-0.5">
                                            <p className="font-bold text-brand">{tCell.classKey}</p>
                                            <p className="text-xs font-semibold text-ink">{tCell.subject}</p>
                                          </div>
                                        ) : <span className="text-slate-300">-</span>}
                                      </td>
                                    );
                                  }
                                })}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <aside className="flex flex-col gap-4">
                      <section className={`${PANEL} p-4 space-y-3`}>
                        <div className="flex items-center justify-between border-b border-line pb-2">
                          <span className="text-xs font-extrabold text-brand whitespace-nowrap">⚖️ 교사/강사별 주당 시수 및 1·4·7교시 균등 배분 현황</span>
                          <span className="text-[11px] text-slate-400 whitespace-nowrap">생성 {masterSchedule.generatedAt}</span>
                        </div>
                        <div className="max-h-60 overflow-y-auto">
                          <table className="w-full border-collapse text-[11px]">
                            <thead className="sticky top-0 bg-paper">
                              <tr className="border-b border-line text-slate-600">
                                <th className="p-1.5 text-left whitespace-nowrap">교사명 (클릭시 시간표)</th>
                                <th className="p-1.5 text-center whitespace-nowrap">총시수</th>
                                <th className="p-1.5 text-center whitespace-nowrap">1교시</th>
                                <th className="p-1.5 text-center whitespace-nowrap">4교시</th>
                                <th className="p-1.5 text-center whitespace-nowrap">7교시</th>
                                <th className="p-1.5 text-center whitespace-nowrap">피로합계</th>
                              </tr>
                            </thead>
                            <tbody>
                              {Object.entries(masterSchedule.teacherFatigue || {})
                                .filter(([, f]) => f.total > 0)
                                .sort(([a], [b]) => a.localeCompare(b))
                                .map(([tName, f]) => (
                                  <tr key={tName} className="border-b border-line hover:bg-paper/50 cursor-pointer" onClick={() => { setViewMode("teacher"); setViewTarget(tName); }}>
                                    <td className="p-1.5 font-bold text-ink whitespace-nowrap">{tName}</td>
                                    <td className="p-1.5 text-center font-bold text-slate-700 whitespace-nowrap">{f.total}h</td>
                                    <td className="p-1.5 text-center whitespace-nowrap">{f.p1}회</td>
                                    <td className="p-1.5 text-center whitespace-nowrap">{f.p4}회</td>
                                    <td className="p-1.5 text-center whitespace-nowrap">{f.p7}회</td>
                                    <td className="p-1.5 text-center font-bold text-brand whitespace-nowrap">{f.p1 + f.p4 + f.p7}회</td>
                                  </tr>
                                ))}
                            </tbody>
                          </table>
                        </div>
                      </section>

                      <section className={`${PANEL} p-4 flex-1 space-y-3`}>
                        <h3 className="text-xs font-extrabold text-amber-900">🔍 자동 조율 및 요구사항 반영 리포트 ({masterSchedule.logs.length}건)</h3>
                        {masterSchedule.logs.length > 0 ? (
                          <div className="max-h-64 overflow-y-auto space-y-2 pr-1">
                            {masterSchedule.logs.map((lg, idx) => (
                              <div key={idx} className="rounded-xl border border-amber-300 bg-amber-50/60 p-3 text-xs space-y-1">
                                <div className="flex items-center justify-between gap-2">
                                  <span className="font-bold text-ink">{lg.target}</span>
                                  <span className="no-wrap-badge rounded bg-white px-2 py-0.5 text-[10px] font-bold text-brand border border-line">{lg.slot}</span>
                                </div>
                                <p className="leading-5 text-slate-700">{lg.reason}</p>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <div className="rounded-xl border border-emerald-200 bg-emerald-50 p-6 text-center text-xs font-bold text-emerald-800">
                            🎉 모든 선생님(및 시간강사)의 공강·배제교시·블록타임 및 이동수업 동시 타임이 100% 충돌 없이 완벽하게 반영되었습니다!
                          </div>
                        )}
                      </section>
                    </aside>
                  </div>
                ) : (
                  <div className="p-12 text-center text-sm text-slate-500">
                    상단의 <strong>[🔥 AI 최적 시간표 탐색 (30회 시뮬레이션)]</strong> 또는 <strong>[⚡ 1학기/2학기 생성]</strong> 버튼을 눌러주세요.
                  </div>
                )}
              </section>
            </div>
          )}
        </main>
      </div>

      <footer className="mt-10 border-t border-line bg-white px-6 py-4 text-xs text-slate-500">
        <div className="mx-auto flex max-w-[1600px] flex-wrap items-center justify-between gap-2">
          <div>
            <strong className="text-ink">© {new Date().getFullYear()} {schoolName}. All rights reserved.</strong>
            <span className="ml-2 text-[11px] text-slate-400">본 프로그램의 알고리즘, 화면 설계 및 소스코드의 무단 복제·변형·재배포를 금합니다.</span>
          </div>
          <span>고교학점제 교육과정·정원·시간표 편성 스튜디오</span>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TimetableStudioApp />);
</script>
</body>
</html>
