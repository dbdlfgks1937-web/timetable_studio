// 셀 값 문자열(예: "4", "3×2반", "3*2", "6")에서 학점과 분반 수 파싱
function parseMatrixCellInput(rawVal, defaultCredits) {
  const s = String(rawVal ?? "").trim();
  if (!s || s === "0") return { count: 0, credits: defaultCredits, totalHours: 0 };
  const mMulti = s.match(/^(\d+)\s*[×xX*]\s*(\d+)/);
  if (mMulti) {
    const cr = Number(mMulti[1]) || defaultCredits;
    const cnt = Number(mMulti[2]) || 1;
    return { count: cnt, credits: cr, totalHours: cr * cnt };
  }
  const num = Number(s.replace(/[^\d.]/g, ""));
  if (!num || num <= 0) return { count: 0, credits: defaultCredits, totalHours: 0 };
  if (defaultCredits > 0 && num >= defaultCredits * 2 && num % defaultCredits === 0) {
    const cnt = Math.round(num / defaultCredits);
    return { count: cnt, credits: defaultCredits, totalHours: num };
  }
  return { count: 1, credits: num, totalHours: num };
}

function parseAssignedTeacher(assignStr, secNum, fallbackDept, maxQuota = 6) {
  if (!assignStr || !assignStr.trim()) {
    const teacherNum = ((secNum - 1) % Math.max(1, maxQuota)) + 1;
    return `${fallbackDept}교사${teacherNum}`;
  }
  const parts = assignStr.split(",").map(s => s.trim()).filter(Boolean);
  for (const p of parts) {
    const mRange = p.match(/^([^(]+)\((\d+)\s*[~-]\s*(\d+)반?\)/);
    if (mRange) {
      const tName = mRange[1].trim();
      const s = Number(mRange[2]), e = Number(mRange[3]);
      if (secNum >= s && secNum <= e) return tName;
    }
    const mList = p.match(/^([^(]+)\(([\d,\s·/]+)반?\)/);
    if (mList) {
      const tName = mList[1].trim();
      const nums = mList[2].split(/[,·/\s]+/).map(Number).filter(Boolean);
      if (nums.includes(secNum)) return tName;
    }
    const mSingle = p.match(/^([^(]+)\((\d+)반?\)/);
    if (mSingle) {
      if (secNum === Number(mSingle[2])) return mSingle[1].trim();
    }
  }
  const cleanNames = parts.map(p => p.replace(/\(.*\)/, "").trim()).filter(Boolean);
  if (cleanNames.length > 0) {
    return cleanNames[(secNum - 1) % cleanNames.length];
  }
  return `${fallbackDept}교사${secNum}`;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function downloadCSV(filename, headers, rows) {
  const escCell = v => {
    let s = String(v ?? "");
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replaceAll('"', '""') + '"';
  };
  const body = "\ufeff" + [headers, ...rows].map(r => r.map(escCell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([body], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function createRealisticStudentPool(gradeNum, totalCount = 213, classCount = 7) {
  const prefix = gradeNum === 2 ? "1" : "2";
  return Array.from({ length: totalCount }, (_, idx) => {
    const cls = (idx % classCount) + 1;
    const num = Math.floor(idx / classCount) + 1;
    const sid = `${prefix}0${cls}${String(num).padStart(2, "0")}`;
    const name = LAST_NAMES[idx % LAST_NAMES.length] + FIRST_NAMES[(idx * 3 + cls) % FIRST_NAMES.length];
    return {
      studentId: sid,
      name,
      gender: idx % 2 === 0 ? "남" : "여",
      picks: []
    };
  });
}

// 선택과목 분반들을 이동수업 타임(A~G타임)에 배정 (주간 시간표의 32교시 총량과 정확히 일치하도록 [택K] = K개 타임 보장)
function buildDefaultBandsForCurriculum(currList, quotaMap = DEFAULT_QUOTA, lecMap = DEFAULT_LECTURER, clsCounts = { 1: 7, 2: 7, 3: 7 }) {
  const map = {};
  [2, 3].forEach(g => {
    const maxGradeCols = clsCounts[g] || 7;
    [1, 2].forEach(s => {
      const electives = currList.filter(c => c.grade === g && c.sem === s && c.type === "선택" && !c.closed && c.sections > 0);
      const groups = Array.from(new Set(electives.map(e => e.group)));
      let bandLetterIdx = 0;

      groups.forEach(grp => {
        const items = electives.filter(e => e.group === grp);
        const rawKPick = Math.max(1, items[0]?.pickCount || Number((grp.match(/택(\d+)/) || [])[1]) || 1);

        let neededCols = rawKPick;
        items.forEach(subj => {
          if (rawKPick > 1 && subj.customColCounts && Object.keys(subj.customColCounts).length > 0) {
            const maxCustomCol = Math.max(1, ...Object.keys(subj.customColCounts).map(Number));
            if (maxCustomCol > neededCols) neededCols = maxCustomCol;
          }
        });
        neededCols = Math.max(1, Math.min(maxGradeCols, neededCols));

        const bandNames = Array.from({ length: neededCols }, (_, i) => `${String.fromCharCode(65 + bandLetterIdx + i)}타임`);
        bandLetterIdx += neededCols;

        const bandsObj = Object.fromEntries(bandNames.map(b => [b, []]));

        items.forEach((subj, sIdx) => {
          if (subj.customColCounts && Object.keys(subj.customColCounts).length > 0) {
            let secSeq = 1;
            Object.entries(subj.customColCounts).forEach(([colNumStr, cnt]) => {
              const colNum = Number(colNumStr);
              const countNum = Number(cnt) || 0;
              if (countNum > 0 && colNum >= 1) {
                const bandIdx = Math.min(neededCols - 1, Math.max(0, colNum - 1));
                const targetBand = bandNames[bandIdx] || bandNames[0];
                if (bandsObj[targetBand]) {
                  for (let k = 0; k < countNum; k++) {
                    bandsObj[targetBand].push({
                      uid: `${subj.id}-sec${secSeq}`,
                      subjId: subj.id,
                      secNum: secSeq,
                      bandIdx: bandIdx + 1,
                      name: subj.name,
                      dept: subj.dept,
                      credits: subj.credits,
                      estStudents: Math.round(subj.enroll / Math.max(1, subj.sections))
                    });
                    secSeq++;
                  }
                }
              }
            });
          } else {
            const spanCols = neededCols;
            const offset = Math.max(0, (Number(subj.startCol) || (rawKPick === 1 ? 1 : sIdx + 1)) - 1);

            for (let sec = 1; sec <= subj.sections; sec++) {
              const bandIdx = (offset + sec - 1) % spanCols;
              const targetBand = bandNames[bandIdx] || bandNames[0];
              if (bandsObj[targetBand]) {
                bandsObj[targetBand].push({
                  uid: `${subj.id}-sec${sec}`,
                  subjId: subj.id,
                  secNum: sec,
                  bandIdx: bandIdx + 1,
                  name: subj.name,
                  dept: subj.dept,
                  credits: subj.credits,
                  estStudents: Math.round(subj.enroll / Math.max(1, subj.sections))
                });
              }
            }
          }
        });
        map[`${g}_${s}_${grp}`] = bandsObj;
      });
    });
  });
  return map;
}

  // [신규 2번] 학년_학기별 분반 명단 고정(잠금) 상태 (예: { "2_1": true })
  const [rosterLocked, setRosterLocked] = useState({});

  // [신규] 학생 미배정 제로(0) 보장 최적 밴드 조합 분석 리포트 상태 및 로딩 표시 상태
  const [bandOptReport, setBandOptReport] = useState(null);

  // [신규] 학년별 1개 타임(한 교과 묶음)당 최대 동시 개설 분반 수 설정 (7학급 기준 기본 8개반: 7~8개반 이내로 묶이도록 제어)
  const [maxSectionsPerBand, setMaxSectionsPerBand] = useState({ 1: 7, 2: 8, 3: 8 });
  // [신규] 분반 개설을 위한 학급당 최소 인원(폐강/소인수 기준) 및 최대 인원(과밀 학급 상한선) 설정
  const [minStudentsPerSec, setMinStudentsPerSec] = useState(13);
  const [maxStudentsPerSec, setMaxStudentsPerSec] = useState(33);

  // [신규] 최소·최대 인원 기준 및 권장 분반 합계(학급수×택K)를 동시에 고려한 최적 분반 수 자동 산출 함수
  const autoAdjustSectionsByMinMax = (gradeNum, semNum) => {
    const lockKey = `${gradeNum}_${semNum}`;
    if (rosterLocked[lockKey]) {
      alert(`🔒 현재 [${gradeNum}학년 ${semNum}학기] 분반·명단이 고정(잠금) 상태입니다. 잠금을 먼저 해제해 주세요.`);
      return;
    }
    const cCnt = classCounts[gradeNum] || 7;
    const targetGroups = Array.from(new Set(curriculum.filter(c => c.grade === gradeNum && c.sem === semNum && c.type === "선택").map(c => c.group)));
    let nextCurr = curriculum.map(it => ({ ...it }));

    targetGroups.forEach(grp => {
      const grpItems = nextCurr.filter(c => c.grade === gradeNum && c.sem === semNum && c.type === "선택" && c.group === grp);
      const kPick = Math.max(1, grpItems[0]?.pickCount || Number((grp.match(/택(\d+)/) || [])[1]) || 1);
      const targetTotalSecs = cCnt * kPick;

      // 1차: 최대 인원(maxStudentsPerSec)을 넘지 않는 최소 필요 분반 수 부여 (단, 0명이거나 최소인원 미달이면서 강제개설이 아니면 1반 또는 폐강 검토)
      grpItems.forEach(it => {
        if (it.enroll <= 0) {
          it.sections = 0;
          it.closed = true;
        } else {
          const minNeeded = Math.max(1, Math.ceil(it.enroll / Math.max(15, maxStudentsPerSec)));
          it.sections = minNeeded;
          it.closed = false;
          it.customColCounts = undefined;
        }
      });

      // 2차: 그룹 전체 권장 분반 수(예: 7학급×택3 = 21개반)와 맞추기 위해 반당 평균 인원이 가장 높은(과밀한) 과목부터 분반 +1 또는 반당 평균이 가장 낮고 최소인원 이상 유지 가능한 과목에서 -1 조정
      let curSum = grpItems.reduce((a, b) => a + (b.closed ? 0 : b.sections), 0);
      let guard = 0;
      while (curSum < targetTotalSecs && guard < 30) {
        guard++;
        const cand = grpItems
          .filter(it => !it.closed && it.enroll > 0 && Math.floor(it.enroll / (it.sections + 1)) >= minStudentsPerSec)
          .sort((a, b) => (b.enroll / b.sections) - (a.enroll / a.sections))[0]
          || grpItems.filter(it => !it.closed && it.enroll > 0).sort((a, b) => (b.enroll / b.sections) - (a.enroll / a.sections))[0];
        if (!cand) break;
        cand.sections += 1;
        curSum += 1;
      }
      while (curSum > targetTotalSecs && guard < 60) {
        guard++;
        // 분반을 1개 줄여도 최대 인원(maxStudentsPerSec)을 초과하지 않는 가장 여유로운 과목 탐색
        const cand = grpItems
          .filter(it => !it.closed && it.sections > 1 && Math.ceil(it.enroll / (it.sections - 1)) <= maxStudentsPerSec)
          .sort((a, b) => (a.enroll / a.sections) - (b.enroll / b.sections))[0];
        if (!cand) break; // 최대 인원 상한선을 지키기 위해 더 이상 줄일 수 없으면 중단!
        cand.sections -= 1;
        curSum -= 1;
      }
    });

    setCurriculum(nextCurr);
    setToast(`⚖️ [${gradeNum}학년 ${semNum}학기] 최소(${minStudentsPerSec}명)~최대(${maxStudentsPerSec}명) 기준에 맞춰 과목별 최적 분반 수를 자동 산출했습니다!`);
    if (bandOptReport && bandOptReport.grade === gradeNum && bandOptReport.sem === semNum) {
      runZeroUnassignedBandOptimizer(gradeNum, semNum, nextCurr, riroStudents);
    }
  };

  // [신규 3번] 타 학교 공유/집-학교 연동용 전체 작업 백업(.json) 다운로드 및 불러오기, 타학교 초기화

  // 1단계: 편제표 업로드
  const handleCurriculumFileUpload = async (file) => {
    if (!file) return;
    const ext = file.name.split(".").pop()?.toLowerCase();
    if (["xlsx", "xls", "csv"].includes(ext)) {
      try {
        const buf = await file.arrayBuffer();
        const wb = window.XLSX.read(new Uint8Array(buf), { type: "array" });
        const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
        const parsed = [];
        rows.slice(1).forEach((r, idx) => {
          const grade = Number(String(r[0]).replace(/\D/g, ""));
          const sem = Number(String(r[1]).replace(/\D/g, "")) || 1;
          const type = String(r[2] || "").includes("선택") ? "선택" : "지정";
          const group = String(r[3] || (type === "지정" ? "학교지정" : `${sem}학기 [택3]`)).trim();
          const name = String(r[4] || "").trim();
          const credits = Number(r[5]) || 3;
          let dept = String(r[6] || "").trim();
          if (name.includes("통합사회")) dept = "통합사회";
          else if (name.includes("통합과학") || name.includes("과학탐구실험")) dept = "통합과학";
          else if (!QUOTA_CATEGORIES.includes(dept)) dept = "기타";

          if (grade >= 1 && grade <= 3 && name) {
            parsed.push({
              id: `up-${grade}-${sem}-${idx}`,
              grade, sem, type, group, name, credits, dept,
              pickCount: Number((group.match(/택(\d+)/) || [])[1]) || 1,
              enroll: grade === 1 ? 210 : 60,
              sections: type === "지정" ? (classCounts[grade] || 7) : 2,
              startCol: 1,
              splitMode: "none",
              teacherAssign: ""
            });
          }
        });
        if (parsed.length > 0) {
          setCurriculum(parsed);
          setToast(`편제표 파일에서 총 ${parsed.length}개 과목 편제를 성공적으로 불러왔습니다!`);
        } else {
          alert("유효한 편제표 행을 찾지 못했습니다.");
        }
      } catch (e) {
        alert("편제표 엑셀 분석 오류: " + e.message);
      }
      return;
    }

    if (ext === "pdf") {
      let keyToUse = aiApiKey.trim();
      if (!keyToUse) {
        const keyInput = prompt("PDF 편제표 AI 자동 분석을 위해 Gemini API 키를 입력해 주세요:");
        if (!keyInput) return;
        keyToUse = keyInput.trim();
        setAiApiKey(keyToUse);
      }
      setAiBusy(true);
      try {
        const bytes = new Uint8Array(await file.arrayBuffer());
        let binary = "";
        for (let i = 0; i < bytes.length; i += 32768) binary += String.fromCharCode(...bytes.subarray(i, i + 32768));
        const base64 = btoa(binary);
        const promptText = `첨부된 고등학교 교육과정 편제표 PDF를 분석하여 학년별·학기별 과목 목록을 JSON 배열로 반환하세요.
각 원소 형식: {"grade":1~3 정수, "sem":1~2 정수, "type":"지정" 또는 "선택", "group":"학교지정" 또는 "1학기 [택3]" 등, "name":"과목명", "credits":학점(1~4 정수), "dept":"국어/수학/영어/도덕/역사/지리/일반사회/통합사회/물리/화학/생물/지구과학/통합과학/체육/음악/미술/정보/중국어/일본어/교육학/보건/기타 중 택1"}`;
        const res = await fetch(`${API_BASE}/models/gemini-2.5-flash:generateContent`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": keyToUse },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: promptText }, { inlineData: { mimeType: "application/pdf", data: base64 } }] }],
            generationConfig: { temperature: 0.1, responseMimeType: "application/json" }
          })
        });
        const data = await res.json();
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
        const arr = JSON.parse(rawText);
        if (Array.isArray(arr) && arr.length > 0) {
          const mapped = arr.map((x, idx) => {
            let d = QUOTA_CATEGORIES.includes(x.dept) ? x.dept : "기타";
            if (String(x.name).includes("통합사회")) d = "통합사회";
            if (String(x.name).includes("통합과학") || String(x.name).includes("과학탐구실험")) d = "통합과학";
            return {
              id: `ai-${x.grade}-${x.sem}-${idx}`,
              grade: Number(x.grade) || 1,
              sem: Number(x.sem) || 1,
              type: x.type === "선택" ? "선택" : "지정",
              group: x.group || (x.type === "선택" ? `${x.sem}학기 [택3]` : "학교지정"),
              pickCount: Number((String(x.group || "").match(/택(\d+)/) || [])[1]) || 3,
              name: x.name || `과목${idx}`,
              credits: Number(x.credits) || 3,
              dept: d,
              enroll: x.type === "선택" ? 60 : 210,
              sections: x.type === "선택" ? 2 : (classCounts[x.grade] || 7),
              startCol: 1,
              splitMode: "none",
              teacherAssign: ""
            };
          });
          setCurriculum(mapped);
          setToast(`AI가 PDF 편제표에서 총 ${mapped.length}개 과목과 학점을 자동 추출했습니다!`);
        }
      } catch (e) {
        alert("PDF AI 분석 실패: " + e.message);
      } finally {
        setAiBusy(false);
      }
    }
  };

  // 2단계: 정원표 양식 다운로드 및 업로드
  const downloadQuotaTemplate = () => {

  // 3단계: 리로스쿨 수강신청 파일 업로드
  const handleRiroUpload = async (gradeNum, file) => {
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = window.XLSX.read(new Uint8Array(buf), { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
      if (rows.length < 4) throw Error("리로스쿨 수강신청 통계 양식(최소 4행 이상)이 아닙니다.");

      const headerGroupRow = rows[0];
      const subjNameRow = rows[1];
      const totalRow = rows[2];

      let curGroup = "";
      const colMeta = [];
      for (let c = 7; c < subjNameRow.length; c++) {
        const gRaw = String(headerGroupRow[c] || "").trim();
        if (gRaw && !gRaw.startsWith("Unnamed")) curGroup = gRaw.replace(/\.\d+$/, "");
        const sName = String(subjNameRow[c] || "").trim();
        if (!sName || sName === "nan") continue;
        const semMatch = curGroup.startsWith("2학기") ? 2 : 1;
        const pickMatch = curGroup.match(/택(\d+)/);
        const pickCount = pickMatch ? Number(pickMatch[1]) : 1;
        colMeta.push({ colIndex: c, group: curGroup, sem: semMatch, pickCount, name: sName, total: Number(totalRow[c]) || 0 });
      }

      const stuList = [];
      for (let r = 3; r < rows.length; r++) {
        const row = rows[r];
        const sid = String(row[1] || "").trim().replace(/\.0$/, "");
        const sname = String(row[2] || "").trim();
        if (!sname || sname === "합계" || sname === "이름") continue;
        const picks = [];
        colMeta.forEach(m => {
          const cellVal = String(row[m.colIndex] ?? "").trim();
          if (cellVal === "1" || cellVal === "1.0" || Number(cellVal) === 1) {
            picks.push({ sem: m.sem, group: m.group, name: m.name });
          }
        });
        stuList.push({ studentId: sid, name: sname, gender: String(row[3] || "").trim(), picks });
      }

      setRiroStudents(prev => ({ ...prev, [gradeNum]: stuList }));

      const nextCurr = curriculum.map(item => {
        if (item.grade !== gradeNum || item.type !== "선택") return item;
        const matched = colMeta.find(m => m.sem === item.sem && m.name.replace(/\s+/g, "") === item.name.replace(/\s+/g, ""));
        if (!matched) return item;
        const enroll = matched.total;
        // ★ 이미 설정된 분반 수(item.sections)가 있으면 유지하고, 0반이거나 폐강일 때만 권장 분반 수로 초기화
        const keepSec = enroll === 0 ? 0 : (item.sections > 0 ? item.sections : Math.max(1, Math.round(enroll / 28)));
        return { ...item, enroll, sections: keepSec, closed: enroll === 0, customColCounts: undefined };
      });
      setCurriculum(nextCurr);
      setToast(`${gradeNum}학년 리로스쿨 파일에서 실제 학생 ${stuList.length}명의 성명과 선택과목을 불러왔습니다! 이제 [🔍 학생 미배정 제로 최적 밴드 탐색]을 눌러보세요.`);
    } catch (e) {
      alert("파일 분석 오류: " + e.message);
    }
  };

  // 학폭·생활지도 분리 학생 조건을 반영한 무작위(랜덤) 분반 학생 배정 (잠금 보호 포함)
  const generateRandomSectionRosters = (gradeNum, semNum) => {
    const lockKey = `${gradeNum}_${semNum}`;
    if (rosterLocked[lockKey]) {
      alert(`🔒 현재 [${gradeNum}학년 ${semNum}학기] 분반 명단이 [고정(잠금)] 상태입니다!\n실수로 명단이 뒤바뀌는 것을 방지하고 있습니다. 다시 추첨하려면 우측의 [🔒 명단 고정 해제] 버튼을 먼저 눌러주세요.`);
      return;
    }
    const electives = curriculum.filter(c => c.grade === gradeNum && c.sem === semNum && c.type === "선택" && !c.closed && c.sections > 0);
    const uploadedPool = riroStudents[gradeNum] || [];
    const fallbackPool = createRealisticStudentPool(gradeNum, gradeNum === 2 ? 213 : 183, classCounts[gradeNum] || 7);

    const avoidPairs = separatePairsInput
      .split(",")
      .map(pairStr => pairStr.trim().split(/[-~·/\s]+/).map(s => s.trim()).filter(Boolean))
      .filter(arr => arr.length >= 2);

    const matchStudentToken = (st, token) => st.name === token || st.studentId === token || `${st.studentId}${st.name}` === token;

    const nextRosters = { ...randomRosters };
    const nextLogs = [];

    electives.forEach(subj => {
      let applicants = uploadedPool.filter(st => st.picks.some(p => p.sem === semNum && p.name.replace(/\s+/g, "") === subj.name.replace(/\s+/g, "")));
      if (applicants.length === 0 && subj.enroll > 0) {
        applicants = fallbackPool.slice(0, subj.enroll);
      }

      const secCount = Math.max(1, subj.sections);
      let bestBuckets = [];

      for (let attempt = 0; attempt < 50; attempt++) {
        const shuffled = shuffleArray(applicants);
        const buckets = Array.from({ length: secCount }, (_, i) => ({ secNum: i + 1, students: [] }));
        shuffled.forEach((st, idx) => {
          buckets[idx % secCount].students.push(st);
        });

        if (secCount === 1) {
          bestBuckets = buckets;
          avoidPairs.forEach(([t1, t2]) => {
            const has1 = applicants.find(st => matchStudentToken(st, t1));
            const has2 = applicants.find(st => matchStudentToken(st, t2));
            if (has1 && has2 && attempt === 0) {
              nextLogs.push({
                type: "warning",
                subjName: subj.name,
                msg: `[${subj.name}] 과목은 1개 분반만 개설되어 분리 대상(${has1.name} ↔ ${has2.name})이 함께 편성됨 (분반 추가 또는 과목변경 상담 필요)`
              });
            }
          });
          break;
        }

        let violated = false;
        for (const [t1, t2] of avoidPairs) {
          for (const b of buckets) {
            const has1 = b.students.some(st => matchStudentToken(st, t1));
            const has2 = b.students.some(st => matchStudentToken(st, t2));
            if (has1 && has2) {
              violated = true;
              break;
            }
          }
          if (violated) break;
        }

        bestBuckets = buckets;
        if (!violated) {
          avoidPairs.forEach(([t1, t2]) => {
            const b1 = buckets.find(b => b.students.some(st => matchStudentToken(st, t1)));
            const b2 = buckets.find(b => b.students.some(st => matchStudentToken(st, t2)));
            if (b1 && b2 && b1.secNum !== b2.secNum) {
              const s1Obj = b1.students.find(st => matchStudentToken(st, t1));
              const s2Obj = b2.students.find(st => matchStudentToken(st, t2));
              nextLogs.push({
                type: "success",
                subjName: subj.name,
                msg: `[${subj.name}] 분리 배정 완료: ${s1Obj.name}(${b1.secNum}분반) ↔ ${s2Obj.name}(${b2.secNum}분반)`
              });
            }
          });
          break;
        }
      }

      bestBuckets.forEach(b => b.students.sort((a, b2) => String(a.studentId).localeCompare(String(b2.studentId))));
      nextRosters[subj.id] = bestBuckets;
    });

    setRandomRosters(nextRosters);
    setSeparationLogs(nextLogs);
    if (electives[0]) setPreviewRosterSubj(electives[0].id);
    setToast(`${gradeNum}학년 ${semNum}학기 분반별 학생 실명 무작위 배정(학폭·생활지도 분리 반영)이 완료되었습니다!`);
  };

const exportRandomRostersXLSX = (gradeNum, semNum) => {
    const electives = curriculum.filter(c => c.grade === gradeNum && c.sem === semNum && c.type === "선택" && !c.closed && c.sections > 0);

    window.XLSX.writeFile(wb, `${schoolName}_${gradeNum}학년_${semNum}학기_선택과목_무작위분반명단.xlsx`);
