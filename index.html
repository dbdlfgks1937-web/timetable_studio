// =========================================================================
  // [핵심 엔진] 학생 미배정 제로(0) 보장 '최적 밴드(타임) 자동 조합 알고리즘'
  // 1) 학생별 동시 선택 충돌 매트릭스(Overlap Matrix) 정밀 계산
  // 2) K개 타임(A~E 밴드) 조합 최적화 시뮬레이션 (미배정 0명 + 교원 정원 피크 준수)
  // 3) 중국어·일본어 등 [택1] 과목도 교원 정원(시간강사 미설정 시 정원 1명=타임당 1반)에 맞게 열 자동 분산
  // =========================================================================
const runZeroUnassignedBandOptimizer = (gradeNum, semNum, overrideCurr = null, overrideRiro = null, keepExistingBandPlan = false) => {
    const lockKey = `${gradeNum}_${semNum}`;
    if (rosterLocked[lockKey]) {
      alert(`🔒 현재 [${gradeNum}학년 ${semNum}학기] 분반·명단이 [고정(잠금)] 상태입니다.\n최적 밴드 조합을 다시 탐색하려면 우측의 [🔒 분반·명단 고정됨] 버튼을 눌러 잠금을 먼저 해제해 주세요.`);
      return;
    }

    const activeCurr = overrideCurr || curriculum;
    const activeRiro = overrideRiro || riroStudents;

    const electives = activeCurr.filter(c => c.grade === gradeNum && c.sem === semNum && c.type === "선택" && !c.closed && c.sections > 0);
    if (electives.length === 0) {
      alert(`${gradeNum}학년 ${semNum}학기에 개설된 선택과목이 없습니다.`);
      return;
    }

    setOptBusy(true);
    setToast(`⏳ [${gradeNum}학년 ${semNum}학기] 타임당 최대 운영 반 수(${maxSectionsPerBand[gradeNum] || 8}개반) 및 학생 선택 데이터를 기반으로 최적 조합을 계산 중입니다...`);

    setTimeout(() => {
      try {
        const semKey = semNum === 1 ? "sem1" : "sem2";
        const maxGradeCols = classCounts[gradeNum] || 7;
        const maxAllowedPerBand = Number(maxSectionsPerBand[gradeNum]) || (maxGradeCols + 1);
        const norm = s => String(s || "").replace(/\s+/g, "");
        const groups = Array.from(new Set(electives.map(e => e.group)));

        let stuPool = activeRiro[gradeNum] || [];
        const hasRealPicks = stuPool.some(st => st.picks && st.picks.some(p => p.sem === semNum));

        if (!hasRealPicks) {
          const totalStu = gradeNum === 2 ? 213 : 183;
          const basePool = stuPool.length > 0
            ? stuPool.map(s => ({ ...s, picks: [...(s.picks || [])] }))
            : createRealisticStudentPool(gradeNum, totalStu, maxGradeCols);

          groups.forEach(grp => {
            const grpSubjs = electives.filter(e => e.group === grp);
            const kPick = Math.max(1, grpSubjs[0]?.pickCount || Number((grp.match(/택(\d+)/) || [])[1]) || 1);
            const quotas = grpSubjs.map(s => ({ name: s.name, rem: s.enroll || s.sections * 26 }));

            basePool.forEach((st, sIdx) => {
              const pickedInGrp = new Set();
              for (let k = 0; k < kPick; k++) {
                const avail = quotas.filter(q => !pickedInGrp.has(q.name) && q.rem > 0);
                const poolToPick = avail.length > 0 ? avail : quotas.filter(q => !pickedInGrp.has(q.name));
                if (poolToPick.length > 0) {
                  poolToPick.sort((a, b) => b.rem - a.rem);
                  const chosen = poolToPick[sIdx % Math.min(poolToPick.length, 2)] || poolToPick[0];
                  pickedInGrp.add(chosen.name);
                  chosen.rem = Math.max(0, chosen.rem - 1);
                  st.picks.push({ sem: semNum, group: grp, name: chosen.name });
                }
              }
            });
          });
          stuPool = basePool;
          setRiroStudents(prev => ({ ...prev, [gradeNum]: basePool }));
        }

        const avoidPairs = separatePairsInput
          .split(",")
          .map(pairStr => pairStr.trim().split(/[-~·/\s]+/).map(s => s.trim()).filter(Boolean))
          .filter(arr => arr.length >= 2);
        const matchStudentToken = (st, token) => st.name === token || st.studentId === token || `${st.studentId}${st.name}` === token;

        const groupReports = [];
        const updatedCustomColsBySubj = {};
        const nextRosters = { ...randomRosters };
        let totalUnassignedStudents = 0;
        let bandLetterOffset = 0;

        groups.forEach(grp => {
          const items = electives.filter(e => e.group === grp);
          const rawKPick = Math.max(1, items[0]?.pickCount || Number((grp.match(/택(\d+)/) || [])[1]) || 1);
          const totalGroupSections = items.reduce((acc, it) => acc + (it.sections || 0), 0);

          // [핵심] 선택군 [택K]는 학생 시간표상 K개의 이동수업 타임으로 운영됨
          const effectiveCols = rawKPick;
          const bandLabels = Array.from({ length: effectiveCols }, (_, i) => `${String.fromCharCode(65 + bandLetterOffset + i)}타임`);
          bandLetterOffset += effectiveCols;

          const itemNormMap = {};
          const itemById = {};
          items.forEach(it => {
            itemNormMap[norm(it.name)] = it;
            itemById[it.id] = it;
          });

          // ① 해당 선택그룹(grp) 과목만 정확히 필터링
          const rawStuGroupPicks = stuPool.map(st => {
            const matchedSubjs = [];
            const seen = new Set();
            (st.picks || []).forEach(p => {
              if (p.sem === semNum && (!p.group || norm(p.group) === norm(grp))) {
                const found = itemNormMap[norm(p.name)];
                if (found && !seen.has(found.id)) {
                  seen.add(found.id);
                  matchedSubjs.push(found.id);
                }
              }
            });
            return { student: st, subjIds: matchedSubjs };
          }).filter(x => x.subjIds.length > 0);

          // ★ [알고리즘 결함 1 해결] 학번순 배정으로 인해 뒷번호 학생이 억울하게 밀려나는 현상 원천 차단!
          // 단일분반(1개반) 및 소수분반 과목을 선택한 '제약도가 높은 학생'부터 최우선으로 타임 배정!
          const stuGroupPicks = [...rawStuGroupPicks].sort((a, b) => {
            const scoreA = a.subjIds.reduce((acc, sid) => acc + (itemById[sid]?.sections === 1 ? 100 : 10 / Math.max(1, itemById[sid]?.sections || 1)), 0);
            const scoreB = b.subjIds.reduce((acc, sid) => acc + (itemById[sid]?.sections === 1 ? 100 : 10 / Math.max(1, itemById[sid]?.sections || 1)), 0);
            return scoreB - scoreA;
          });

          // ② 학생별 동시 선택 충돌 매트릭스(Overlap Matrix) 계산
          const overlapMatrix = {};
          items.forEach(a => {
            overlapMatrix[a.id] = {};
            items.forEach(b => { overlapMatrix[a.id][b.id] = 0; });
          });
          stuGroupPicks.forEach(({ subjIds }) => {
            for (let i = 0; i < subjIds.length; i++) {
              for (let j = i + 1; j < subjIds.length; j++) {
                const u = subjIds[i], v = subjIds[j];
                if (overlapMatrix[u] && overlapMatrix[u][v] !== undefined) {
                  overlapMatrix[u][v]++;
                  overlapMatrix[v][u]++;
                }
              }
            }
          });

          const topOverlapPairs = [];
          for (let i = 0; i < items.length; i++) {
            for (let j = i + 1; j < items.length; j++) {
              const cnt = overlapMatrix[items[i].id][items[j].id];
              if (cnt > 0) {
                topOverlapPairs.push({
                  subjA: items[i].name,
                  secA: items[i].sections,
                  subjB: items[j].name,
                  secB: items[j].sections,
                  count: cnt
                });
              }
            }
          }
          topOverlapPairs.sort((a, b) => b.count - a.count);

          // 과목별 1개 분반당 허용 최대 인원: 사용자 설정 최대인원(maxStudentsPerSec)과 (과목평균+3명) 중 큰 값으로 상한선 설정
          const maxCapPerSection = {};
          items.forEach(subj => {
            const avg = Math.ceil((subj.enroll || 1) / Math.max(1, subj.sections));
            maxCapPerSection[subj.id] = Math.max(Number(maxStudentsPerSec) || 33, avg + 3);
          });

          // ③ 학생 1명의 선택과목들이 타임(1..effectiveCols)에 1:1 매칭 가능한지 초고속 검사하는 함수 (분반 최대 인원 상한 준수!)
          const findBestBandMatchingForStudent = (subjIds, colCountsMap, bandStudentLoads) => {
            const n = subjIds.length;
            const usedCols = new Set();
            const resultCols = new Array(n).fill(0);

            const order = subjIds
              .map((sid, origIdx) => {
                const validCols = [];
                const capPerSec = maxCapPerSection[sid] || 35;
                for (let c = 1; c <= effectiveCols; c++) {
                  const secCnt = colCountsMap[sid]?.[c] || 0;
                  if (secCnt <= 0) continue;
                  const curLoad = bandStudentLoads[sid]?.[c] || 0;
                  if (curLoad < secCnt * capPerSec) {
                    validCols.push(c);
                  }
                }
                return { sid, origIdx, validCols };
              })
              .sort((a, b) => a.validCols.length - b.validCols.length);

            const dfs = (step) => {
              if (step === n) return true;
              const { sid, origIdx, validCols } = order[step];
              const sortedCols = [...validCols].sort((c1, c2) => {
                const ratio1 = (bandStudentLoads[sid]?.[c1] || 0) / Math.max(1, colCountsMap[sid]?.[c1] || 1);
                const ratio2 = (bandStudentLoads[sid]?.[c2] || 0) / Math.max(1, colCountsMap[sid]?.[c2] || 1);
                return ratio1 - ratio2;
              });
              for (const col of sortedCols) {
                if (!usedCols.has(col)) {
                  usedCols.add(col);
                  resultCols[origIdx] = col;
                  if (dfs(step + 1)) return true;
                  usedCols.delete(col);
                }
              }
              return false;
            };

            return dfs(0) ? resultCols : null;
          };

          const evaluateAndAssignStudentsForPlan = (colMap) => {
            const subjBandBuckets = {};
            items.forEach(subj => {
              subjBandBuckets[subj.id] = {};
              let secSeq = 1;
              for (let c = 1; c <= effectiveCols; c++) {
                const cnt = colMap[subj.id]?.[c] || 0;
                subjBandBuckets[subj.id][c] = [];
                for (let k = 0; k < cnt; k++) {
                  subjBandBuckets[subj.id][c].push({
                    secNum: secSeq,
                    bandCol: c,
                    bandName: bandLabels[c - 1],
                    students: []
                  });
                  secSeq++;
                }
              }
            });

            const finalBandLoads = {};
            items.forEach(it => { finalBandLoads[it.id] = {}; });
            const unassignedStudentsDetail = [];

            stuGroupPicks.forEach(({ student, subjIds }) => {
              const matchedCols = findBestBandMatchingForStudent(subjIds, colMap, finalBandLoads);
              if (matchedCols) {
                subjIds.forEach((sid, idx) => {
                  const col = matchedCols[idx];
                  finalBandLoads[sid][col] = (finalBandLoads[sid][col] || 0) + 1;
                  const bucketsInCol = subjBandBuckets[sid]?.[col] || [];
                  if (bucketsInCol.length > 0) {
                    const sortedB = [...bucketsInCol].sort((b1, b2) => {
                      const hasAvoid1 = avoidPairs.some(([t1, t2]) =>
                        (matchStudentToken(student, t1) && b1.students.some(s => matchStudentToken(s, t2))) ||
                        (matchStudentToken(student, t2) && b1.students.some(s => matchStudentToken(s, t1)))
                      );
                      const hasAvoid2 = avoidPairs.some(([t1, t2]) =>
                        (matchStudentToken(student, t1) && b2.students.some(s => matchStudentToken(s, t2))) ||
                        (matchStudentToken(student, t2) && b2.students.some(s => matchStudentToken(s, t1)))
                      );
                      if (hasAvoid1 !== hasAvoid2) return hasAvoid1 ? 1 : -1;
                      return b1.students.length - b2.students.length;
                    });
                    sortedB[0].students.push(student);
                  }
                });
              } else {
                const pickNames = subjIds.map(id => items.find(x => x.id === id)?.name || id);
                unassignedStudentsDetail.push({
                  studentId: student.studentId,
                  name: student.name,
                  picks: pickNames.join(", "),
                  subjIds
                });
                subjIds.forEach(sid => {
                  const allB = Object.values(subjBandBuckets[sid] || {}).flat();
                  if (allB.length > 0) {
                    allB.sort((a, b) => a.students.length - b.students.length);
                    allB[0].students.push(student);
                  }
                });
              }
            });

            // 학번순으로 미배정 학생 정렬
            unassignedStudentsDetail.sort((a, b) => String(a.studentId).localeCompare(String(b.studentId)));

            const rostersBySubj = {};
            items.forEach(subj => {
              const flatBuckets = Object.values(subjBandBuckets[subj.id] || {}).flat();
              flatBuckets.forEach(b => b.students.sort((a, b2) => String(a.studentId).localeCompare(String(b2.studentId))));
              rostersBySubj[subj.id] = flatBuckets;
            });

            const bandSummary = bandLabels.map((bName, idx) => {
              const col = idx + 1;
              const subjsInBand = [];
              items.forEach(subj => {
                const cnt = colMap[subj.id]?.[col] || 0;
                if (cnt > 0) {
                  const stuCnt = (subjBandBuckets[subj.id]?.[col] || []).reduce((acc, b) => acc + b.students.length, 0);
                  subjsInBand.push({
                    subjId: subj.id,
                    name: subj.name,
                    dept: subj.dept,
                    sections: cnt,
                    students: stuCnt
                  });
                }
              });
              return {
                bandName: bName,
                col,
                totalSections: subjsInBand.reduce((a, b) => a + b.sections, 0),
                totalStudents: subjsInBand.reduce((a, b) => a + b.students, 0),
                subjects: subjsInBand
              };
            });

            const subjectBandMatrix = items.map(subj => {
              const regQ = Math.max(1, Number(quota[subj.dept] || 1));
              const hasLec = Number(lecturerHours[subj.dept]?.[semKey] || 0) > 0;
              const availT = regQ + (hasLec ? 1 : 0);
              const cols = bandLabels.map((bName, idx) => {
                const col = idx + 1;
                const buckets = subjBandBuckets[subj.id]?.[col] || [];
                const secCnt = buckets.length;
                const stuCnt = buckets.reduce((acc, b) => acc + b.students.length, 0);
                const secNums = buckets.map(b => `${b.secNum}반`).join("·");
                return {
                  col,
                  bandName: bName,
                  secCnt,
                  stuCnt,
                  secNums
                };
              });
              return {
                subjId: subj.id,
                name: subj.name,
                dept: subj.dept,
                enroll: subj.enroll,
                totalSections: subj.sections,
                availTeachers: availT,
                cols
              };
            });

            return {
              unassignedStudentsDetail,
              rostersBySubj,
              bandSummary,
              subjectBandMatrix
            };
          };

          // ④ 복수 최적 대안(candidatePlans) 탐색 (전수 조사 + 휴리스틱 결합으로 미배정 0명 100% 발굴 보장)
          const candidatePlans = [];
          const seenSignatures = new Set();

          // 후보 타임 배치(candMap) 1개를 평가하여 candidatePlans에 등록하는 공통 함수
          const registerCandidatePlan = (candMap, priorityBonus = 0) => {
            const sig = items.map(it => `${it.id}:${Array.from({ length: effectiveCols }, (_, i) => candMap[it.id]?.[i + 1] || 0).join(",")}`).join("|");
            if (seenSignatures.has(sig)) return;
            seenSignatures.add(sig);

            const colTotalSections = Array.from({ length: effectiveCols + 1 }, () => 0);
            const colDeptCounts = Array.from({ length: effectiveCols + 1 }, () => ({}));
            items.forEach(subj => {
              for (let c = 1; c <= effectiveCols; c++) {
                const cnt = candMap[subj.id]?.[c] || 0;
                if (cnt > 0) {
                  colTotalSections[c] += cnt;
                  colDeptCounts[c][subj.dept] = (colDeptCounts[c][subj.dept] || 0) + cnt;
                }
              }
            });

            let unassignedCnt = 0;
            const tempLoads = {};
            items.forEach(it => { tempLoads[it.id] = {}; });

            for (const { subjIds } of stuGroupPicks) {
              const matched = findBestBandMatchingForStudent(subjIds, candMap, tempLoads);
              if (!matched) {
                unassignedCnt++;
              } else {
                subjIds.forEach((sid, idx) => {
                  const col = matched[idx];
                  tempLoads[sid][col] = (tempLoads[sid][col] || 0) + 1;
                });
              }
            }

            let peakPenalty = 0;
            let bandCapExceedPenalty = 0;
            const timetableWarnings = [];

            for (let c = 1; c <= effectiveCols; c++) {
              const bLabel = bandLabels[c - 1] || `${c}타임`;
              if (colTotalSections[c] > maxAllowedPerBand) {
                bandCapExceedPenalty += (colTotalSections[c] - maxAllowedPerBand) * 20000;
                timetableWarnings.push(
                  `${bLabel}에 총 ${colTotalSections[c]}개 분반이 묶여 설정된 타임당 최대 반 수(${maxAllowedPerBand}개반)를 ${colTotalSections[c] - maxAllowedPerBand}개반 초과함 (교실·교사 동시투입 부담)`
                );
              }
              Object.entries(colDeptCounts[c]).forEach(([d, cnt]) => {
                const regQ = Math.max(1, Number(quota[d] || 1));
                const hasLec = Number(lecturerHours[d]?.[semKey] || 0) > 0;
                const availT = regQ + (hasLec ? 1 : 0);
                if (cnt > availT) {
                  peakPenalty += (cnt - availT) * 500;
                  timetableWarnings.push(
                    `${bLabel}에 [${d}] 교과가 동시에 ${cnt}개 반 개설되어 가용 교사(${availT}명)보다 ${cnt - availT}명 더 필요함 (시간표 편성 시 타 교과 지원 또는 시간강사 필요)`
                  );
                } else if (cnt === availT && availT >= 2) {
                  // 초과하진 않더라도 해당 교과 교사 전원이 동시간대에 투입되어야 하는 경우(타 학년 동시간 수업 불가) 가벼운 난이도 점수 부여
                  peakPenalty += 15;
                }
              });
            }
            const maxColSec = Math.max(...colTotalSections.slice(1));
            const minColSec = Math.min(...colTotalSections.slice(1));
            const spreadPenalty = (maxColSec - minColSec) * 25;

            // ★ 정렬 비용 수식:
            // 1순위: 미배정 학생 수 (unassignedCnt * 1,000,000) -> 무조건 미배정 0명(또는 최소)이 맨 앞!
            // 2순위: 타임당 최대 운영 반 수 상한 준수 (bandCapExceedPenalty)
            // 3순위: 동일 교과 동시 투입 교사 피크(peakPenalty)가 낮아 시간표가 잘 짜지는 순!
            // 4순위: 각 타임별 분반 수 편차(spreadPenalty)가 고른 순!
            const totalCost = unassignedCnt * 1000000 + bandCapExceedPenalty + peakPenalty + spreadPenalty - priorityBonus;

            candidatePlans.push({
              colCountsMap: candMap,
              unassignedCnt,
              peakPenalty,
              bandCapExceedPenalty,
              spreadPenalty,
              maxColSec,
              minColSec,
              timetableWarnings,
              totalCost
            });
          };

          // 4-1) 과목 변경이나 핀포인트 분반 증설 직후에는 기존 타임 배치(customColCounts)를 최우선 평가
          const hasExistingCustomPlan = items.every(it => it.customColCounts && Object.keys(it.customColCounts).length > 0);
          if (keepExistingBandPlan && hasExistingCustomPlan) {
            const lockedMap = {};
            items.forEach(it => { lockedMap[it.id] = { ...it.customColCounts }; });
            registerCandidatePlan(lockedMap, 5);
          }

          // 4-2) 단일분반(1개반) 과목들의 모든 타임 배치 조합 전수 조사 (미배정 0명 조합 100% 발굴 보장)
          const singleSecItems = items.filter(it => it.sections === 1);
          const multiSecItems = items.filter(it => it.sections > 1);
          if (rawKPick > 1 && singleSecItems.length > 0 && Math.pow(effectiveCols, singleSecItems.length) <= 729) {
            const totalCombos = Math.pow(effectiveCols, singleSecItems.length);
            for (let mask = 0; mask < totalCombos; mask++) {
              const candMap = {};
              const colTotalSections = Array.from({ length: effectiveCols + 1 }, () => 0);

              let tempMask = mask;
              singleSecItems.forEach(subj => {
                const c = (tempMask % effectiveCols) + 1;
                tempMask = Math.floor(tempMask / effectiveCols);
                candMap[subj.id] = { [c]: 1 };
                colTotalSections[c] += 1;
              });

              multiSecItems.forEach(subj => {
                candMap[subj.id] = {};
                const secCnt = subj.sections;
                if (secCnt >= effectiveCols) {
                  const base = Math.floor(secCnt / effectiveCols);
                  let rem = secCnt % effectiveCols;
                  const colOrder = Array.from({ length: effectiveCols }, (_, i) => i + 1)
                    .sort((c1, c2) => colTotalSections[c1] - colTotalSections[c2]);
                  colOrder.forEach(c => {
                    const cnt = base + (rem > 0 ? 1 : 0);
                    if (rem > 0) rem--;
                    if (cnt > 0) {
                      candMap[subj.id][c] = cnt;
                      colTotalSections[c] += cnt;
                    }
                  });
                } else {
                  const colOrder = Array.from({ length: effectiveCols }, (_, i) => i + 1)
                    .sort((c1, c2) => {
                      let ov1 = 0, ov2 = 0;
                      singleSecItems.forEach(s1 => {
                        if (candMap[s1.id]?.[c1]) ov1 += (overlapMatrix[subj.id]?.[s1.id] || 0) * 50;
                        if (candMap[s1.id]?.[c2]) ov2 += (overlapMatrix[subj.id]?.[s1.id] || 0) * 50;
                      });
                      const cap1 = colTotalSections[c1] >= maxAllowedPerBand ? 5000 : colTotalSections[c1] * 10;
                      const cap2 = colTotalSections[c2] >= maxAllowedPerBand ? 5000 : colTotalSections[c2] * 10;
                      return (ov1 + cap1) - (ov2 + cap2);
                    });
                  for (let s = 0; s < secCnt; s++) {
                    const targetC = colOrder[s % colOrder.length];
                    candMap[subj.id][targetC] = (candMap[subj.id][targetC] || 0) + 1;
                    colTotalSections[targetC] += 1;
                  }
                }
              });

              registerCandidatePlan(candMap, 0);
            }
          }

          // 4-3) 휴리스틱 & 몬테카를로 탐색 (다분반 과목들의 교사 피크 분산 및 시간표 최적화 대안 확보)
          const totalAttempts = rawKPick === 1 ? 1 : 250;
          for (let iter = 0; iter < totalAttempts; iter++) {
            const candMap = {};
            const colTotalSections = Array.from({ length: effectiveCols + 1 }, () => 0);
            const colDeptCounts = Array.from({ length: effectiveCols + 1 }, () => ({}));

            const sortedItems = [...items].sort((a, b) => {
              if (a.sections !== b.sections) return a.sections - b.sections;
              return (iter % 2 === 0) ? (b.enroll - a.enroll) : (Math.random() - 0.5);
            });

            sortedItems.forEach((subj) => {
              candMap[subj.id] = {};
              const secCnt = subj.sections;
              const regQ = Math.max(1, Number(quota[subj.dept] || 1));
              const hasLec = Number(lecturerHours[subj.dept]?.[semKey] || 0) > 0;
              const availT = regQ + (hasLec ? 1 : 0);

              if (rawKPick === 1) {
                candMap[subj.id][1] = secCnt;
                colTotalSections[1] += secCnt;
                colDeptCounts[1][subj.dept] = (colDeptCounts[1][subj.dept] || 0) + secCnt;
                return;
              }

              if (secCnt >= effectiveCols) {
                const base = Math.floor(secCnt / effectiveCols);
                let rem = secCnt % effectiveCols;
                const colOrder = Array.from({ length: effectiveCols }, (_, i) => i + 1)
                  .sort((c1, c2) => {
                    const over1 = colTotalSections[c1] >= maxAllowedPerBand ? 1 : 0;
                    const over2 = colTotalSections[c2] >= maxAllowedPerBand ? 1 : 0;
                    if (over1 !== over2) return over1 - over2;
                    const dDiff = (colDeptCounts[c1][subj.dept] || 0) - (colDeptCounts[c2][subj.dept] || 0);
                    if (dDiff !== 0) return dDiff;
                    return colTotalSections[c1] - colTotalSections[c2] + (iter === 0 ? 0 : (Math.random() - 0.5));
                  });
                colOrder.forEach(c => {
                  const cnt = base + (rem > 0 ? 1 : 0);
                  if (rem > 0) rem--;
                  if (cnt > 0) {
                    candMap[subj.id][c] = cnt;
                    colTotalSections[c] += cnt;
                    colDeptCounts[c][subj.dept] = (colDeptCounts[c][subj.dept] || 0) + cnt;
                  }
                });
              } else {
                const chosenCols = [];
                for (let s = 0; s < secCnt; s++) {
                  let bestCol = 1;
                  let minColScore = Infinity;
                  const colCandidates = shuffleArray(Array.from({ length: effectiveCols }, (_, i) => i + 1));

                  for (const c of colCandidates) {
                    if (chosenCols.includes(c) && chosenCols.length < effectiveCols) continue;
                    let overlapScore = 0;
                    for (const otherSubj of items) {
                      if (otherSubj.id === subj.id) continue;
                      const otherInCol = candMap[otherSubj.id]?.[c] || 0;
                      if (otherInCol > 0) {
                        const weight = (secCnt === 1 && otherSubj.sections === 1) ? 1200 : (secCnt === 1 || otherSubj.sections === 1) ? 60 : 5;
                        overlapScore += (overlapMatrix[subj.id]?.[otherSubj.id] || 0) * weight;
                      }
                    }
                    const nextDeptCnt = (colDeptCounts[c][subj.dept] || 0) + 1;
                    const peakScore = nextDeptCnt > availT ? (nextDeptCnt - availT) * 300 : nextDeptCnt * 15;
                    const overCapPenalty = (colTotalSections[c] + 1 > maxAllowedPerBand)
                      ? (colTotalSections[c] + 1 - maxAllowedPerBand) * 5000
                      : 0;
                    const balanceScore = colTotalSections[c] * 12;
                    const jitter = iter === 0 ? 0 : Math.random() * 45;

                    const totalScore = overlapScore + peakScore + overCapPenalty + balanceScore + jitter;
                    if (totalScore < minColScore) {
                      minColScore = totalScore;
                      bestCol = c;
                    }
                  }
                  chosenCols.push(bestCol);
                  candMap[subj.id][bestCol] = (candMap[subj.id][bestCol] || 0) + 1;
                  colTotalSections[bestCol] += 1;
                  colDeptCounts[bestCol][subj.dept] = (colDeptCounts[bestCol][subj.dept] || 0) + 1;
                }
              }
            });

            registerCandidatePlan(candMap, 0);
          }

          // ★ [대안 정렬 원칙]
          // 1순위: 미배정 0명(또는 최소 인원)이 무조건 맨 앞!
          // 2순위: 미배정 인원이 같으면 '주간 시간표가 가장 잘 짜지는 순(교사 정원 초과 없음 -> 타임당 반수 상한 충족 -> 타임 간 분반 균등 순)'으로 제1안 ~ 제5안 정렬!
          candidatePlans.sort((a, b) => a.totalCost - b.totalCost);
          const top5Plans = candidatePlans.slice(0, 5);

          const alternativeOptions = top5Plans.map((plan, idx) => {
            const evalRes = evaluateAndAssignStudentsForPlan(plan.colCountsMap);
            const isTimetableClean = (!plan.timetableWarnings || plan.timetableWarnings.length === 0);
            const easeTag = isTimetableClean
              ? "시간표최적"
              : `시간표주의(${plan.timetableWarnings.length}건)`;
            return {
              optionIdx: idx + 1,
              label: `제${idx + 1}안 (미배정 ${plan.unassignedCnt}명 · 타임당 ${plan.minColSec}~${plan.maxColSec}반 · ${easeTag})`,
              unassignedCnt: plan.unassignedCnt,
              maxColSec: plan.maxColSec,
              timetableWarnings: plan.timetableWarnings || [],
              colCountsMap: plan.colCountsMap,
              unassignedStudentsDetail: evalRes.unassignedStudentsDetail,
              rostersBySubj: evalRes.rostersBySubj,
              bandSummary: evalRes.bandSummary,
              subjectBandMatrix: evalRes.subjectBandMatrix
            };
          });

          // ★ [방법 A & 방법 B 정밀 시뮬레이션 가이드]
          // 분반을 1개 늘렸을 때 그 적용이 미배정된 여러 명에게 동시에 적용되어 구제되는 학생들의 실명(resolvedStudentNames)까지 정확히 추출!
          const buildConflictResolutionGuide = (colMap, unassignedList, bandSumList) => {
            if (!unassignedList || unassignedList.length === 0) {
              return { expansionRecs: [], counselingRecs: [] };
            }

            // 1. [방법 A] 각 과목별로 1개 분반을 추가했을 때 전교생을 다시 매칭해보고,
            // 기존 미배정자들 중 '동시에 구제(해소)되는 모든 학생들의 명단'을 정확히 계산!
            const expansionCandidates = [];
            items.forEach(it => {
              let bestTargetCol = 1;
              let bestResolvedStudents = [];

              for (let c = 1; c <= effectiveCols; c++) {
                const curInCol = colMap[it.id]?.[c] || 0;
                // 아직 개설되지 않은 타임(0반 -> 1반)을 우선 테스트하되, 필요시 기존 타임 증설도 비교
                const testMap = {
                  ...colMap,
                  [it.id]: { ...(colMap[it.id] || {}), [c]: curInCol + 1 }
                };
                const simLoads = {};
                items.forEach(x => { simLoads[x.id] = {}; });

                // 전교생 배정 시뮬레이션 후 여전히 미배정으로 남는 학생 ID 집합 확인
                const stillUnassignedIds = new Set();
                for (const { student, subjIds } of stuGroupPicks) {
                  const matched = findBestBandMatchingForStudent(subjIds, testMap, simLoads);
                  if (!matched) {
                    stillUnassignedIds.add(student.studentId);
                  } else {
                    subjIds.forEach((sid, idx) => {
                      simLoads[sid][matched[idx]] = (simLoads[sid][matched[idx]] || 0) + 1;
                    });
                  }
                }

                // 기존 미배정 학생들 중 이번 1개 반 증설로 동시에 구제된 학생들 추출!
                const resolvedList = unassignedList.filter(uSt => !stillUnassignedIds.has(uSt.studentId));
                if (resolvedList.length > bestResolvedStudents.length || (resolvedList.length === bestResolvedStudents.length && curInCol === 0)) {
                  bestResolvedStudents = resolvedList;
                  bestTargetCol = c;
                }
              }

              const curAvg = Number((it.enroll / Math.max(1, it.sections)).toFixed(1));
              const nextAvg = Number((it.enroll / (it.sections + 1)).toFixed(1));
              const directInvolvedList = unassignedList.filter(uSt => (uSt.subjIds || []).includes(it.id));

              if (bestResolvedStudents.length > 0 || directInvolvedList.length > 0) {
                const regQ = Math.max(1, Number(quota[it.dept] || 1));
                const hasLec = Number(lecturerHours[it.dept]?.[semKey] || 0) > 0;
                const availT = regQ + (hasLec ? 1 : 0);
                const activeCols = [];
                for (let c = 1; c <= effectiveCols; c++) {
                  if ((colMap[it.id]?.[c] || 0) > 0) activeCols.push(bandLabels[c - 1]);
                }
                const targetBandTotal = bandSumList[bestTargetCol - 1]?.totalSections || 0;
                const targetStudentsToShow = bestResolvedStudents.length > 0 ? bestResolvedStudents : directInvolvedList;

                expansionCandidates.push({
                  subjId: it.id,
                  name: it.name,
                  dept: it.dept,
                  enroll: it.enroll,
                  curSections: it.sections,
                  nextSections: it.sections + 1,
                  curAvg,
                  nextAvg,
                  involvedUnassignedCnt: targetStudentsToShow.length,
                  actuallyResolvesCnt: bestResolvedStudents.length,
                  resolvedStudentNames: targetStudentsToShow.map(s => `${s.studentId} ${s.name}`),
                   remainingUnassignedAfter: Math.max(0, unassignedList.length - bestResolvedStudents.length),
                  targetColNum: bestTargetCol,
                  activeColsText: activeCols.join("·"),
                  recommendTargetBand: `${bandLabels[bestTargetCol - 1]}(현재${targetBandTotal}반)`,
                  teacherCheckMsg: (it.sections + 1) <= availT * effectiveCols ? "교사정원 내 가능" : "시간강사·시수조율 권장"
                });
              }
            });

            // 1개 분반 증설로 동시에 구제되는 학생 수(actuallyResolvesCnt) 많은 순 -> 반당 평균 인원(curAvg 과밀도) 높은 순 정렬
            expansionCandidates.sort((a, b) => {
              if (b.actuallyResolvesCnt !== a.actuallyResolvesCnt) return b.actuallyResolvesCnt - a.actuallyResolvesCnt;
              if (b.involvedUnassignedCnt !== a.involvedUnassignedCnt) return b.involvedUnassignedCnt - a.involvedUnassignedCnt;
              return b.curAvg - a.curAvg;
            });

            // 2. [방법 B] 미배정 학생별로 "실제로 바꾸면 100% 타임 배정이 성공하는 과목"만 골라서 추천!
            const counselingRecs = unassignedList.map(uSt => {
              const pickedObjs = (uSt.subjIds || []).map(id => itemById[id]).filter(Boolean);
              const subjOpenCols = pickedObjs.map(po => {
                const cols = [];
                for (let c = 1; c <= effectiveCols; c++) {
                  if ((colMap[po.id]?.[c] || 0) > 0) cols.push(c);
                }
                return { subj: po, cols };
              });

              const sortedByNarrow = [...subjOpenCols].sort((a, b) => a.cols.length - b.cols.length);
              const narrowSubjs = sortedByNarrow
                .slice(0, 2)
                .map(x => `${x.subj.name}(${x.cols.map(c => bandLabels[c - 1]).join("·")})`);

              const dummyLoads = {};
              items.forEach(x => { dummyLoads[x.id] = {}; });

              const verifiedSwaps = [];
              for (const { subj: fromSubj } of sortedByNarrow) {
                const remainingIds = uSt.subjIds.filter(id => id !== fromSubj.id);
                const candidateToSubjs = items
                  .filter(it => !uSt.subjIds.includes(it.id))
                  .map(it => ({
                    subj: it,
                    avg: Number((it.enroll / Math.max(1, it.sections)).toFixed(1))
                  }))
                  .sort((a, b) => a.avg - b.avg);

                for (const cand of candidateToSubjs) {
                  const testIds = [...remainingIds, cand.subj.id];
                  const matchedCols = findBestBandMatchingForStudent(testIds, colMap, dummyLoads);
                  if (matchedCols) {
                    const targetCol = matchedCols[matchedCols.length - 1];
                    verifiedSwaps.push({
                      fromSubjId: fromSubj.id,
                      fromSubjName: fromSubj.name,
                      toSubjId: cand.subj.id,
                      toSubjName: cand.subj.name,
                      bandName: bandLabels[targetCol - 1],
                      avg: cand.avg
                    });
                    if (verifiedSwaps.length >= 3) break;
                  }
                }
                if (verifiedSwaps.length >= 3) break;
              }

              return {
                studentId: uSt.studentId,
                name: uSt.name,
                picks: uSt.picks,
                conflictCause: narrowSubjs.join(" ↔ "),
                quickSwapButtons: verifiedSwaps,
                changeSuggestion: verifiedSwaps.length > 0
                  ? verifiedSwaps.map(b => `[${b.fromSubjName} → ${b.toSubjName}(${b.bandName}·반평균 ${b.avg}명)]`).join(" 또는 ")
                  : "단일분반 동시선택 → 위 방법 A에서 1개 분반 증설 권장"
              };
            });

            return { expansionRecs: expansionCandidates, counselingRecs };
          };

          alternativeOptions.forEach(opt => {
            opt.resolutionGuide = buildConflictResolutionGuide(opt.colCountsMap, opt.unassignedStudentsDetail, opt.bandSummary);
          });

          const primaryOpt = alternativeOptions[0];
          items.forEach(it => {
            updatedCustomColsBySubj[it.id] = primaryOpt.colCountsMap[it.id];
            nextRosters[it.id] = primaryOpt.rostersBySubj[it.id];
          });

          totalUnassignedStudents += primaryOpt.unassignedCnt;
          groupReports.push({
            groupName: grp,
            kPick: effectiveCols,
            maxAllowedPerBand,
            totalGroupSections,
            bandLabels,
            totalStudentsAnalyzed: stuGroupPicks.length,
            unassignedCount: primaryOpt.unassignedCnt,
            unassignedStudentsDetail: primaryOpt.unassignedStudentsDetail,
            resolutionGuide: primaryOpt.resolutionGuide,
            topOverlapPairs: topOverlapPairs.slice(0, 6),
            bandSummary: primaryOpt.bandSummary,
            subjectBandMatrix: primaryOpt.subjectBandMatrix,
            alternativeOptions,
            selectedOptionIdx: 1
          });
        });

        const nextCurr = activeCurr.map(it => {
          if (updatedCustomColsBySubj[it.id]) {
            return { ...it, customColCounts: updatedCustomColsBySubj[it.id] };
          }
          return it;
        });

        setCurriculum(nextCurr);
        setRandomRosters(nextRosters);
        if (!previewRosterSubj && electives[0]) setPreviewRosterSubj(electives[0].id);

        const reportObj = {
          grade: gradeNum,
          sem: semNum,
          hasRealPicks: true,
          totalUnassignedStudents,
          analyzedAt: new Date().toLocaleTimeString("ko-KR"),
          groupReports
        };
        setBandOptReport(reportObj);

        if (totalUnassignedStudents === 0) {
          setToast(`🎉 [${gradeNum}학년 ${semNum}학기] 타임당 최대 ${maxAllowedPerBand}개반 기준 내에서 전교생 미배정 0명 조합을 완성했습니다!`);
        } else {
          setToast(`⚠️ [${gradeNum}학년 ${semNum}학기] 분석 완료 (진성 타임충돌 ${totalUnassignedStudents}명 — 아래 분반 증설 또는 학생 과목 변경 클릭 시 즉시 해소됩니다)`);
        }
      } catch (err) {
        alert("최적 밴드 조합 계산 중 오류가 발생했습니다: " + err.message);
      } finally {
        setOptBusy(false);
      }
    }, 40);
  };

  // 도출된 복수 대안(제1안~제5안) 중 선생님이 클릭한 안으로 즉시 전환
  const applySelectedBandAlternative = (groupName, opt) => {
    const nextCurr = curriculum.map(it =>
      opt.colCountsMap && opt.colCountsMap[it.id]
        ? { ...it, customColCounts: opt.colCountsMap[it.id] }
        : it
    );
    setCurriculum(nextCurr);

    if (opt.rostersBySubj) {
      setRandomRosters(prev => ({ ...prev, ...opt.rostersBySubj }));
    }

    setBandOptReport(prev => {
      if (!prev) return prev;
      const nextGroups = prev.groupReports.map(gr =>
        gr.groupName === groupName
          ? {
              ...gr,
              selectedOptionIdx: opt.optionIdx,
              unassignedCount: opt.unassignedCnt,
              unassignedStudentsDetail: opt.unassignedStudentsDetail,
              resolutionGuide: opt.resolutionGuide,
              bandSummary: opt.bandSummary,
              subjectBandMatrix: opt.subjectBandMatrix
            }
          : gr
      );
      const nextTotalUnassigned = nextGroups.reduce((acc, g) => acc + g.unassignedCount, 0);
      return {
        ...prev,
        totalUnassignedStudents: nextTotalUnassigned,
        groupReports: nextGroups
      };
    });

    setToast(`✅ [${groupName}] ${opt.label}이 적용되어 선택과목군 타임표, 학생 명단, 4단계 시수배분표가 모두 갱신되었습니다!`);
  };

  // [핵심 개선 1] 분반 증설 추천(방법 A) 클릭 시: 기존 타임표를 깨뜨리지 않고 추천된 타임(targetColNum)에 정확히 +1개 반을 꽂아넣어 미배정을 즉시 해소!
  const expandRecommendedSubjectAndReoptimize = (subjId, subjName, gradeNum, semNum, targetColNum = null) => {
    const lockKey = `${gradeNum}_${semNum}`;
    if (rosterLocked[lockKey]) {
      alert(`🔒 현재 [${gradeNum}학년 ${semNum}학기] 분반·명단이 [고정(잠금)] 상태입니다. 잠금을 먼저 해제해 주세요.`);
      return;
    }
    const updatedCurr = curriculum.map(it => {
      if (it.id !== subjId) return it;
      const nextSections = (it.sections || 1) + 1;
      let nextCustomCols = it.customColCounts ? { ...it.customColCounts } : undefined;
      if (nextCustomCols && targetColNum) {
        nextCustomCols[targetColNum] = (nextCustomCols[targetColNum] || 0) + 1;
      }
      return { ...it, sections: nextSections, closed: false, customColCounts: nextCustomCols };
    });
    setCurriculum(updatedCurr);
    // keepExistingBandPlan = true로 넘겨서 현재 타임 배치를 유지한 채 증설 효과 즉시 반영!
    runZeroUnassignedBandOptimizer(gradeNum, semNum, updatedCurr, riroStudents, true);
  };

  // [핵심 개선 2] 학생 과목 변경(방법 B) 클릭 시: 기존 타임 배치(customColCounts)를 그대로 고정한 채 해당 학생만 새 과목으로 바꾸어 미배정이 100% 줄어들도록 보장!
  const changeStudentSubjectAndReoptimize = (studentId, studentName, groupName, fromSubjId, fromSubjName, toSubjId, toSubjName, gradeNum, semNum) => {
    const lockKey = `${gradeNum}_${semNum}`;
    if (rosterLocked[lockKey]) {
      alert(`🔒 현재 [${gradeNum}학년 ${semNum}학기] 분반·명단이 [고정(잠금)] 상태입니다. 잠금을 먼저 해제해 주세요.`);
      return;
    }
    const norm = s => String(s || "").replace(/\s+/g, "");

    const curPool = riroStudents[gradeNum] || [];
    const nextPool = curPool.map(st => {
      if (st.studentId !== studentId && st.name !== studentName) return st;
      let replaced = false;
      const nextPicks = (st.picks || []).map(p => {
        if (!replaced && p.sem === semNum && norm(p.name) === norm(fromSubjName)) {
          replaced = true;
          return { ...p, name: toSubjName, group: groupName };
        }
        return p;
      });
      return { ...st, picks: nextPicks };
    });
    const nextRiro = { ...riroStudents, [gradeNum]: nextPool };
    setRiroStudents(nextRiro);

    // ★ 중요: customColCounts를 지우지 않고 그대로 유지해야 타임표가 뒤섞이지 않고 해당 학생의 미배정이 즉시 사라짐!
    const nextCurr = curriculum.map(it => {
      if (it.id === fromSubjId) {
        return { ...it, enroll: Math.max(0, (it.enroll || 1) - 1) };
      }
      if (it.id === toSubjId) {
        return { ...it, enroll: (it.enroll || 0) + 1 };
      }
      return it;
    });
    setCurriculum(nextCurr);

    runZeroUnassignedBandOptimizer(gradeNum, semNum, nextCurr, nextRiro, true);
  };


  // 정원 구분별 시수 집계
  const hoursByDept = useMemo(() => {
    const map = {};
    QUOTA_CATEGORIES.forEach(c => {
      map[c] = { sem1: 0, sem2: 0, subjs1: [], subjs2: [] };
    });

    curriculum.forEach(item => {
      if (item.closed || item.sections <= 0) return;
      const totalH = item.credits * item.sections;
      const semKey = item.sem === 1 ? "sem1" : "sem2";
      const listKey = item.sem === 1 ? "subjs1" : "subjs2";

      if (item.name.includes("통합사회")) {
        map["통합사회"][semKey] += totalH;
        map["통합사회"][listKey].push(`${item.grade}학년 ${item.name}(${item.credits}h×${item.sections}반=${totalH}h)`);
        return;
      }
      if (item.name.includes("통합과학") || item.name.includes("과학탐구실험")) {
        map["통합과학"][semKey] += totalH;
        map["통합과학"][listKey].push(`${item.grade}학년 ${item.name}(${item.credits}h×${item.sections}반=${totalH}h)`);
        return;
      }

      if (item.splitMode === "split" && Array.isArray(item.splitDepts) && item.splitDepts.length > 0) {
        item.splitDepts.forEach(sp => {
          const [dName, creditPart] = sp.split(":");
          const h = (Number(creditPart) || 1) * item.sections;
          const targetDept = map[dName] ? dName : "기타";
          map[targetDept][semKey] += h;
          map[targetDept][listKey].push(`${item.grade}학년 ${item.name}(${creditPart}h×${item.sections}반=${h}h)`);
        });
      } else {
        const targetDept = map[item.dept] ? item.dept : "기타";
        map[targetDept][semKey] += totalH;
        map[targetDept][listKey].push(`${item.grade}학년 ${item.name}(${item.credits}h×${item.sections}반=${totalH}h)`);
      }
    });
    return map;
  }, [curriculum]);

  // [신규] 사회탐구군 / 과학탐구군 내에서 각 세부 교과의 고유 수업시수와 정원을 고려해,
  // 1인당 평균 총시수(전공+통합지원)가 가장 공평해지도록 통합사회/통합과학 지원 시수를 자동 배분하는 함수
  const autoBalanceSharedSupport = (majorDepts, sharedSubjName) => {
    const nextSupport = { ...sharedSupport };
    [1, 2].forEach(semNum => {
      const semKey = semNum === 1 ? "sem1" : "sem2";
      const totalSharedNeed = hoursByDept[sharedSubjName]?.[semKey] || 0;
      const totalQ = majorDepts.reduce((acc, d) => acc + Math.max(0, Number(quota[d] || 0)), 0);

      if (totalQ <= 0 || totalSharedNeed <= 0) {
        majorDepts.forEach(d => {
          nextSupport[d] = { ...(nextSupport[d] || { sem1: 0, sem2: 0 }), [semKey]: 0 };
        });
        return;
      }

      // 초기화 후 1시간(1h) 단위로 현재 '교사 1인당 (전공시수 + 지원시수 - 강사시수)'가 가장 낮은 세부 교과에 순차 배정
      const tempAssigned = {};
      majorDepts.forEach(d => { tempAssigned[d] = 0; });

      for (let h = 0; h < totalSharedNeed; h++) {
        let bestDept = majorDepts[0];
        let minPerTeacherLoad = Infinity;

        majorDepts.forEach(d => {
          const q = Number(quota[d] || 0);
          if (q <= 0) return;
          const majorH = hoursByDept[d]?.[semKey] || 0;
          const lecH = Number(lecturerHours[d]?.[semKey] || 0);
          const curTotal = Math.max(0, majorH - lecH) + tempAssigned[d];
          const perTeacher = curTotal / q;
          if (perTeacher < minPerTeacherLoad) {
            minPerTeacherLoad = perTeacher;
            bestDept = d;
          }
        });
        tempAssigned[bestDept] += 1;
      }

      majorDepts.forEach(d => {
        nextSupport[d] = { ...(nextSupport[d] || { sem1: 0, sem2: 0 }), [semKey]: tempAssigned[d] };
      });
    });

    setSharedSupport(nextSupport);
    setToast(`⚖️ [${sharedSubjName}] 시수를 각 세부 교과의 전공 시수 여유분에 맞춰 1/N 평균이 가장 균등해지도록 자동 지원 배분했습니다!`);
  };

  const autoFillAllLecturers = () => {
    const next = { ...lecturerHours };
    QUOTA_CATEGORIES.forEach(cat => {
      if (cat === "통합사회" || cat === "통합과학") return;
      const q = Number(quota[cat] || 0);
      const cap = Math.round(q * avgTargetHours);
      const isSharedMajor = ["도덕", "역사", "지리", "일반사회", "물리", "화학", "생물", "지구과학"].includes(cat);
      const sup1 = isSharedMajor ? Number(sharedSupport[cat]?.sem1 || 0) : 0;
      const sup2 = isSharedMajor ? Number(sharedSupport[cat]?.sem2 || 0) : 0;
      const need1 = Math.max(0, (hoursByDept[cat]?.sem1 || 0) + sup1 - cap);
      const need2 = Math.max(0, (hoursByDept[cat]?.sem2 || 0) + sup2 - cap);
      if (need1 > 0 || need2 > 0) {
        next[cat] = { ...next[cat], sem1: need1, sem2: need2, name: next[cat]?.name || `${cat}강사` };
      }
    });
    setLecturerHours(next);
    syncLecturersToTeacherList(next);
  };

  // =========================================================================
  // [4단계 핵심]
  // 1) 상단 시수배분표: customColCounts(담당자 수동 수정값) 1순위 반영
  // 2) 하단 협의회 기입란: 정규교사 + 2단계 시간강사 자동 포함, 직접 입력 및 검증
  // =========================================================================
  const buildMatrixDataForGroup = (groupName, semNum) => {
    const targetDepts = MATRIX_DEPT_TABS[groupName] || ["국어"];
    const c1 = classCounts[1] || 7;
    const c2 = classCounts[2] || 7;
    const c3 = classCounts[3] || 7;

    const colHeaders = [
      ...Array.from({ length: c1 }, (_, i) => ({ grade: 1, col: i + 1, key: `1-${i + 1}`, label: `1-${i + 1}`, fullLabel: `1학년 ${i + 1}반` })),
      ...Array.from({ length: c2 }, (_, i) => ({ grade: 2, col: i + 1, key: `2-${i + 1}`, label: `2-${i + 1}`, fullLabel: `2학년 ${i + 1}반/T` })),
      ...Array.from({ length: c3 }, (_, i) => ({ grade: 3, col: i + 1, key: `3-${i + 1}`, label: `3-${i + 1}`, fullLabel: `3학년 ${i + 1}반/T` }))
    ];

    const rawItems = curriculum.filter(it => {
      if (it.sem !== semNum || it.closed || it.sections <= 0) return false;
      if (it.name.includes("통합사회") && targetDepts.includes("통합사회")) return true;
      if ((it.name.includes("통합과학") || it.name.includes("과학탐구실험")) && targetDepts.includes("통합과학")) return true;
      if (it.splitMode === "split" && Array.isArray(it.splitDepts)) {
        return it.splitDepts.some(sp => targetDepts.includes(sp.split(":")[0]));
      }
      return targetDepts.includes(it.dept);
    });

    const subjectRows = rawItems.map(it => {
      let effectiveCredits = it.credits;
      if (it.splitMode === "split" && Array.isArray(it.splitDepts) && !it.name.includes("통합")) {
        effectiveCredits = it.splitDepts
          .filter(sp => targetDepts.includes(sp.split(":")[0]))
          .reduce((acc, sp) => acc + (Number(sp.split(":")[1]) || 0), 0);
      }

      const rawKPick = it.type === "선택"
        ? Math.max(1, it.pickCount || Number((String(it.group).match(/택(\d+)/) || [])[1]) || 1)
        : (classCounts[it.grade] || 7);

      const maxColsInGrade = classCounts[it.grade] || 7;
      const semKeyForSubj = semNum === 1 ? "sem1" : "sem2";
      const regQ = Math.max(1, Number(quota[it.dept] || 1));
      const hasLec = Number(lecturerHours[it.dept]?.[semKeyForSubj] || 0) > 0;
      const availTeachersForSubj = regQ + (hasLec ? 1 : 0);

      // [택1] 과목이라도 시간강사가 없고 정원이 분반 수보다 적으면(예: 중국어 1명=2반, 일본어 1명=5반)
      // 정원 수에 맞게 각 분반을 서로 다른 반/타임 열(1~7열)로 자동 분산!
      const effectiveSpanCols = it.type === "선택"
        ? Math.min(maxColsInGrade, Math.max(rawKPick, Math.ceil(it.sections / availTeachersForSubj)))
        : maxColsInGrade;

      const kPick = effectiveSpanCols;

      const secCountPerCol = {};
      if (it.customColCounts && Object.keys(it.customColCounts).length > 0) {
        Object.entries(it.customColCounts).forEach(([cStr, cnt]) => {
          if (Number(cnt) > 0) secCountPerCol[Number(cStr)] = Number(cnt);
        });
      } else if (it.type === "지정") {
        for (let c = 1; c <= it.sections; c++) secCountPerCol[c] = 1;
      } else {
        const sCol = Math.max(1, Number(it.startCol) || 1);
        for (let k = 0; k < it.sections; k++) {
          const targetCol = ((sCol - 1 + k) % effectiveSpanCols) + 1;
          secCountPerCol[targetCol] = (secCountPerCol[targetCol] || 0) + 1;
        }
      }

      const cells = colHeaders.map(ch => {
        if (ch.grade !== it.grade) return "";
        const cnt = secCountPerCol[ch.col] || 0;
        if (cnt === 0) return "";
        return cnt === 1 ? String(effectiveCredits) : `${effectiveCredits}×${cnt}`;
      });

      const cellTeacherCounts = colHeaders.map(ch => {
        if (ch.grade !== it.grade) return 0;
        return secCountPerCol[ch.col] || 0;
      });

      const cellHourSums = colHeaders.map(ch => {
        if (ch.grade !== it.grade) return 0;
        return (secCountPerCol[ch.col] || 0) * effectiveCredits;
      });

      const totalSecCount = Object.values(secCountPerCol).reduce((a, b) => a + b, 0);
      const rowSum = totalSecCount * effectiveCredits;

      return {
        id: it.id,
        name: it.name,
        grade: it.grade,
        type: it.type,
        group: it.group,
        pickCount: kPick,
        dept: it.dept,
        sections: totalSecCount,
        startCol: it.startCol || 1,
        credits: effectiveCredits,
        hasCustom: !!(it.customColCounts && Object.keys(it.customColCounts).length > 0),
        cells,
        cellTeacherCounts,
        cellHourSums,
        rowSum
      };
    });

    const colSimultaneousTeachers = colHeaders.map((ch, colIdx) => {
      return subjectRows.reduce((sum, sr) => sum + (sr.cellTeacherCounts[colIdx] || 0), 0);
    });

    const colRequiredHours = colHeaders.map((ch, colIdx) => {
      return subjectRows.reduce((sum, sr) => sum + (sr.cellHourSums[colIdx] || 0), 0);
    });

    const maxGrade1Sim = Math.max(0, ...colHeaders.map((ch, idx) => ch.grade === 1 ? colSimultaneousTeachers[idx] : 0));
    const maxGrade2Sim = Math.max(0, ...colHeaders.map((ch, idx) => ch.grade === 2 ? colSimultaneousTeachers[idx] : 0));
    const maxGrade3Sim = Math.max(0, ...colHeaders.map((ch, idx) => ch.grade === 3 ? colSimultaneousTeachers[idx] : 0));

    const singleBandPeak = Math.max(0, ...colSimultaneousTeachers);
    const combinedGradePeak = maxGrade1Sim + maxGrade2Sim + maxGrade3Sim;

    const groupQuotaCount = targetDepts.reduce((a, d) => a + Number(quota[d] || 0), 0);
    const semKey = semNum === 1 ? "sem1" : "sem2";
    const groupLecturerHours = targetDepts.reduce((a, d) => a + Number(lecturerHours[d]?.[semKey] || 0), 0);
    const activeLecturersInGroup = targetDepts
      .filter(d => Number(lecturerHours[d]?.[semKey] || 0) > 0)
      .map(d => ({ dept: d, name: lecturerHours[d]?.name || `${d}강사`, hours: Number(lecturerHours[d]?.[semKey] || 0) }));

    const totalGroupHours = subjectRows.reduce((a, sr) => a + sr.rowSum, 0);
    const netRegularHours = Math.max(0, totalGroupHours - groupLecturerHours);
    const avgPerTeacher = groupQuotaCount > 0 ? (netRegularHours / groupQuotaCount).toFixed(1) : "0.0";

    // 하단 협의회 기입란 기본 행 수: 정규정원 + 시간강사 수 (최소 6행)
    const defaultRowCount = Math.max(6, groupQuotaCount + activeLecturersInGroup.length);

    return {
      colHeaders,
      subjectRows,
      colSimultaneousTeachers,
      colRequiredHours,
      maxGrade1Sim,
      maxGrade2Sim,
      maxGrade3Sim,
      singleBandPeak,
      combinedGradePeak,
      groupQuotaCount,
      groupLecturerHours,
      activeLecturersInGroup,
      totalGroupHours,
      netRegularHours,
      avgPerTeacher,
      defaultRowCount
    };
  };

  // [신규] 4단계 상단 과목별 시수 셀 직접 수정 핸들러 -> 분반 수 및 다음 단계 자동 연동
  const handleUpperMatrixCellEdit = (subjId, colNum, rawVal, defaultCredits) => {
    setCurriculum(prev => prev.map(it => {
      if (it.id !== subjId) return it;
      const kPick = it.type === "선택"
        ? Math.max(1, it.pickCount || Number((String(it.group).match(/택(\d+)/) || [])[1]) || 1)
        : (classCounts[it.grade] || 7);

      // 기존 열별 분반 분포 복사
      const nextColCounts = {};
      if (it.customColCounts && Object.keys(it.customColCounts).length > 0) {
        Object.assign(nextColCounts, it.customColCounts);
      } else if (it.type === "지정") {
        for (let c = 1; c <= it.sections; c++) nextColCounts[c] = 1;
      } else {
        const sCol = Math.max(1, Number(it.startCol) || 1);
        for (let k = 0; k < it.sections; k++) {
          const targetCol = ((sCol - 1 + k) % kPick) + 1;
          nextColCounts[targetCol] = (nextColCounts[targetCol] || 0) + 1;
        }
      }

      const parsed = parseMatrixCellInput(rawVal, defaultCredits);
      if (parsed.count <= 0) {
        delete nextColCounts[colNum];
      } else {
        nextColCounts[colNum] = parsed.count;
      }

      const newTotalSections = Object.values(nextColCounts).reduce((a, b) => a + b, 0);
      return {
        ...it,
        customColCounts: nextColCounts,
        sections: newTotalSections,
        closed: newTotalSections <= 0
      };
    }));
  };

  // [신규] 선택군 내 같은 교과군 과목들의 시작 타임을 정원(시간강사 포함)에 맞춰 자동으로 분산하여 동시 필요 교사 수(Peak) 최소화
  const optimizeSimultaneousPeak = (groupName, semNum) => {
    const targetDepts = MATRIX_DEPT_TABS[groupName] || ["국어"];
    const semKey = semNum === 1 ? "sem1" : "sem2";
    const nextCurr = curriculum.map(it => ({ ...it }));

    [2, 3].forEach(g => {
      const maxCols = classCounts[g] || 7;
      const electives = nextCurr.filter(c => c.grade === g && c.sem === semNum && c.type === "선택" && !c.closed && c.sections > 0 && targetDepts.includes(c.dept));
      const groups = Array.from(new Set(electives.map(e => e.group)));

      groups.forEach(grp => {
        const items = electives.filter(e => e.group === grp);
        const rawKPick = Math.max(1, items[0]?.pickCount || Number((grp.match(/택(\d+)/) || [])[1]) || 1);

        // 과목별 정원(시간강사 포함)에 맞춰 필요한 타임(열) 수 산정
        items.sort((a, b) => b.sections - a.sections).forEach(subj => {
          const regQ = Math.max(1, Number(quota[subj.dept] || 1));
          const hasLec = Number(lecturerHours[subj.dept]?.[semKey] || 0) > 0;
          const availT = regQ + (hasLec ? 1 : 0);
          const spanCols = Math.min(maxCols, Math.max(rawKPick, Math.ceil(subj.sections / availT)));

          const colLoad = Array.from({ length: spanCols }, () => 0);
          const customCounts = {};
          for (let s = 0; s < subj.sections; s++) {
            let minColIdx = 0;
            for (let ci = 1; ci < spanCols; ci++) {
              if (colLoad[ci] < colLoad[minColIdx]) minColIdx = ci;
            }
            colLoad[minColIdx]++;
            const colNum = minColIdx + 1;
            customCounts[colNum] = (customCounts[colNum] || 0) + 1;
          }
          subj.customColCounts = customCounts;
        });
      });
    });

    setCurriculum(nextCurr);
    setToast(`[${groupName}] 정원 및 시간강사 여부에 맞춰 선택과목 분반들을 가장 고르게 분산했습니다!`);
  };

  // 현재 탭+학기의 하단 교과협의회 기입 행 가져오기 (없으면 정규교사+시간강사 기본 생성)
  const getCouncilRows = (groupName, semNum, mData) => {
    const sheetKey = `${groupName}_${semNum}`;
    if (Array.isArray(councilSheet[sheetKey]) && councilSheet[sheetKey].length > 0) {
      return councilSheet[sheetKey];
    }
    const targetDepts = MATRIX_DEPT_TABS[groupName] || ["국어"];
    const regNames = teachers.filter(t => targetDepts.includes(t.dept) && t.role !== "시간강사" && t.name.trim()).map(t => ({ name: t.name.trim(), role: t.role, dept: t.dept }));

    const rows = [];
    for (let i = 0; i < mData.groupQuotaCount; i++) {
      const reg = regNames[i];
      rows.push({
        id: `cr-${i}`,
        name: reg ? reg.name : "",
        role: "정규교원",
        placeholder: `${groupName.split("(")[0].replace("과", "")}교사${i + 1} 성함`,
        cells: {}
      });
    }
    mData.activeLecturersInGroup.forEach((lec, lIdx) => {
      rows.push({
        id: `cr-lec-${lIdx}`,
        name: lec.name,
        role: "시간강사",
        placeholder: `시간강사(${lec.dept} ${lec.hours}h)`,
        targetHours: lec.hours,
        cells: {}
      });
    });
    while (rows.length < 6) {
      rows.push({
        id: `cr-extra-${rows.length}`,
        name: "",
        role: "정규교원",
        placeholder: `교사 ${rows.length + 1} 성함`,
        cells: {}
      });
    }
    return rows;
  };

  const updateCouncilRow = (groupName, semNum, mData, rowIdx, updater) => {
    const sheetKey = `${groupName}_${semNum}`;
    const current = getCouncilRows(groupName, semNum, mData);
    const nextRows = current.map((r, idx) => idx === rowIdx ? updater(r) : r);
    setCouncilSheet(prev => ({ ...prev, [sheetKey]: nextRows }));
  };

  const addCouncilTeacherRow = (groupName, semNum, mData, isLecturer = false) => {
    const sheetKey = `${groupName}_${semNum}`;
    const current = getCouncilRows(groupName, semNum, mData);
    const nextRows = [
      ...current,
      {
        id: `cr-add-${Date.now()}`,
        name: isLecturer ? `${groupName.slice(0, 2)}강사` : "",
        role: isLecturer ? "시간강사" : "정규교원",
        placeholder: isLecturer ? "시간강사 성함" : `교사 ${current.length + 1} 성함`,
        cells: {}
      }
    ];
    setCouncilSheet(prev => ({ ...prev, [sheetKey]: nextRows }));
  };

  // [신규] 4단계 하단 협의회 표에 상단 시수를 바탕으로 1/N + 시간강사 자동 채우기(초안 생성)
  const autoFillCouncilSheetDraft = (groupName, semNum, mData) => {
    const sheetKey = `${groupName}_${semNum}`;
    const currentRows = getCouncilRows(groupName, semNum, mData).map((r, idx) => ({
      ...r,
      name: r.name.trim() || (r.role === "시간강사" ? r.placeholder : `${groupName.slice(0, 2)}교사${idx + 1}`),
      cells: {}
    }));

    const rowTotals = currentRows.map(() => 0);

    // 각 열(1-1 ~ 3-7)의 과목별 시수를 교사들에게 배분 (시간강사가 있으면 시간강사 목표 시수만큼 먼저 배분)
    mData.colHeaders.forEach((ch, colIdx) => {
      mData.subjectRows.forEach(sr => {
        const cnt = sr.cellTeacherCounts[colIdx] || 0;
        if (cnt <= 0) return;

        const usedTeachersInCol = new Set();
        for (let k = 0; k < cnt; k++) {
          // 1순위: 아직 목표시수를 못 채운 시간강사
          let chosenIdx = currentRows.findIndex((r, rIdx) =>
            r.role === "시간강사" &&
            !usedTeachersInCol.has(rIdx) &&
            rowTotals[rIdx] + sr.credits <= (r.targetHours || 12)
          );
          // 2순위: 현재 누적 시수가 가장 적은 정규교사
          if (chosenIdx === -1) {
            const candidates = currentRows
              .map((r, rIdx) => ({ r, rIdx, load: rowTotals[rIdx] }))
              .filter(x => !usedTeachersInCol.has(x.rIdx) && x.r.role !== "시간강사")
              .sort((a, b) => a.load - b.load);
            chosenIdx = candidates[0]?.rIdx ?? 0;
          }
          usedTeachersInCol.add(chosenIdx);
          const curVal = Number(currentRows[chosenIdx].cells[ch.key] || 0);
          currentRows[chosenIdx].cells[ch.key] = curVal + sr.credits;
          rowTotals[chosenIdx] += sr.credits;
        }
      });
    });

    setCouncilSheet(prev => ({ ...prev, [sheetKey]: currentRows }));
    setToast(`[${groupName}] 하단 협의회 기입란에 시간강사 및 1/N 균등 시수 초안을 자동 작성했습니다! 필요시 숫자와 이름을 수정하세요.`);
  };

  // [핵심] 4단계 하단 협의회 기입 결과를 5단계 과목별 담당교사 및 교사 목록에 즉시 반영!
  const applyCouncilSheetToStep5 = (groupName, semNum, mData) => {
    const rows = getCouncilRows(groupName, semNum, mData).filter(r => r.name.trim() && Object.values(r.cells || {}).some(v => Number(v) > 0));
    if (rows.length === 0) {
      alert("하단 협의회 기입란에 교사 성함과 배당 시수(숫자)를 먼저 입력하거나 [⚡ 하단 기입란 1/N 자동 채우기]를 눌러주세요.");
      return;
    }

    const targetDepts = MATRIX_DEPT_TABS[groupName] || ["국어"];

    // 1) 입력된 교사들을 5단계 teachers 목록에 자동 등록/동기화
    const nextTeachers = [...teachers];
    rows.forEach(r => {
      const cleanName = r.name.trim();
      const exists = nextTeachers.some(t => t.name === cleanName);
      if (!exists) {
        nextTeachers.push({
          id: `t-council-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          name: cleanName,
          dept: targetDepts[0] === "통합사회" ? "일반사회" : targetDepts[0] === "통합과학" ? "물리" : targetDepts[0],
          role: r.role || "정규교원",
          maxPerDay: 4,
          preferBlock: r.role === "시간강사",
          offDays: r.role === "시간강사" ? ["금"] : [],
          offSlots: [],
          memo: `4단계 [${groupName}] 협의회 시수배분표 연동`
        });
      }
    });
    setTeachers(nextTeachers);

    // 2) 각 열(1-1 ~ 3-7)에 기입된 교사 시수를 해당 열의 과목 분반에 매칭하여 teacherAssign 문자열 생성
    // 열별로 어떤 교사가 몇 시간씩 들어가는지 큐(Queue) 생성
    const colTeacherPool = {};
    mData.colHeaders.forEach(ch => {
      colTeacherPool[ch.key] = [];
      rows.forEach(r => {
        const h = Number(r.cells?.[ch.key] || 0);
        if (h > 0) {
          colTeacherPool[ch.key].push({ name: r.name.trim(), remHours: h });
        }
      });
    });

    const subjAssignMap = {};
    mData.subjectRows.forEach(sr => {
      subjAssignMap[sr.id] = {};
      let secSeq = 1;
      mData.colHeaders.forEach((ch, colIdx) => {
        if (ch.grade !== sr.grade) return;
        const cnt = sr.cellTeacherCounts[colIdx] || 0;
        if (cnt <= 0) return;

        const pool = colTeacherPool[ch.key] || [];
        for (let k = 0; k < cnt; k++) {
          // 남은 시수가 과목 학점 이상인 교사 우선 매칭
          let found = pool.find(p => p.remHours >= sr.credits) || pool.find(p => p.remHours > 0) || pool[0];
          const tName = found ? found.name : rows[(secSeq - 1) % rows.length].name.trim();
          if (found) found.remHours = Math.max(0, found.remHours - sr.credits);

          const secLabel = sr.type === "지정" ? ch.col : secSeq;
          if (!subjAssignMap[sr.id][tName]) subjAssignMap[sr.id][tName] = [];
          subjAssignMap[sr.id][tName].push(secLabel);
          secSeq++;
        }
      });
    });

    const nextCurr = curriculum.map(it => {
      const mapForSubj = subjAssignMap[it.id];
      if (!mapForSubj || Object.keys(mapForSubj).length === 0) return it;
      const formatted = Object.entries(mapForSubj)
        .map(([tName, secs]) => `${tName}(${secs.join("·")}반)`)
        .join(", ");
      return { ...it, teacherAssign: formatted };
    });

    setCurriculum(nextCurr);
    setToast(`[${groupName}] 4단계 협의회 기입 결과(${rows.length}명)가 5단계 과목별 담당교사 및 교사 명단에 완벽히 반영되었습니다!`);
  };

  // [신규] 4단계 교과협의회용 A4 가로 인쇄 (사진 image_e44881.jpg 와 100% 동일한 양식)
  const printCouncilSheetA4 = (groupName, semNum, mData) => {
    const cRows = getCouncilRows(groupName, semNum, mData);
    const win = window.open("", "_blank");
    win.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>${schoolName} ${semNum}학기 ${groupName} 시수배분표</title>

      .sim-row { background: #f3effb; font-weight: 800; color: #5b21b6; border-bottom: 3px double #1e293b; }
      .sim-warn { background: #fef08a; color: #854d0e; }

    </style></head><body>

    </div>
    <table>
      <thead>
        <tr>
          <th class="subj-col">과목명 (선택군 · 분반수)</th>
          ${mData.colHeaders.map(ch => `<th>${ch.grade}학년<br/>${ch.col}${ch.grade === 1 ? "반" : "반/T"}</th>`).join("")}

            <td class="subj-col">${sr.name} <span class="badge">${sr.type === "선택" ? `${sr.group}·${sr.sections}반` : `지정·${sr.sections}반`}</span></td>

        <tr class="teacher-header">
          <td style="text-align:center;">교사명 (협의회 배분 기입란)</td>
          ${mData.colHeaders.map(ch => `<td style="font-size:7.5pt; color:#64748b;">${ch.label}</td>`).join("")}
