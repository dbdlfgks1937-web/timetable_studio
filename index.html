        </tr>
        ${cRows.map((r, idx) => {
          const sum = Object.values(r.cells || {}).reduce((a, b) => a + (Number(b) || 0), 0);
          return `<tr class="blank-row">
            <td style="color:${r.name ? "#1e293b" : "#94a3b8"}; font-weight:${r.name ? "700" : "400"};">${r.name || `(${r.placeholder || `교사 ${idx + 1} 성함 기입`})`}</td>
            ${mData.colHeaders.map(ch => `<td>${r.cells?.[ch.key] || ""}</td>`).join("")}
            <td><strong>${sum > 0 ? `${sum}h` : ""}</strong></td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
    </body></html>`);
    win.document.close();
  };

  // 엑셀(.xlsx) 시수배분표 다운로드 (하단 기입 내용까지 포함)
  const exportPhotoStyleMatrixXLSX = (groupName, semNum, exportAllGroups = false) => {
    const wb = window.XLSX.utils.book_new();
    const groupsToExport = exportAllGroups ? Object.keys(MATRIX_DEPT_TABS) : [groupName];

    groupsToExport.forEach(gName => {
      const mData = buildMatrixDataForGroup(gName, semNum);
      if (mData.subjectRows.length === 0 && exportAllGroups) return;
      const cRows = getCouncilRows(gName, semNum, mData);

      const aoa = [];
      aoa.push(["과목명 (선택군)", ...mData.colHeaders.map(c => c.fullLabel), "과목 총시수"]);

      mData.subjectRows.forEach(sr => {
        const label = sr.type === "선택" ? `${sr.name} (${sr.group}·${sr.sections}반)` : `${sr.name} (지정·${sr.sections}반)`;
        aoa.push([label, ...sr.cells, sr.rowSum]);
      });

      aoa.push(["[학급/타임별 필요 시수 합계]", ...mData.colRequiredHours, `${mData.totalGroupHours}h (1/N 평균 ${mData.avgPerTeacher}h)`]);
      aoa.push(["★ 동시간 필요 교사 수 (분반 중첩 합산)", ...mData.colSimultaneousTeachers.map(n => n > 0 ? `${n}명` : ""), `최대 ${mData.singleBandPeak}~${mData.combinedGradePeak}명 (정원 ${mData.groupQuotaCount}명)`]);

      aoa.push(["", ...mData.colHeaders.map(() => ""), ""]);

      aoa.push(["교사명 (협의회 배분 기입란)", ...mData.colHeaders.map(c => c.label), "개인 합계"]);
      cRows.forEach((r, i) => {
        const rowSum = Object.values(r.cells || {}).reduce((a, b) => a + (Number(b) || 0), 0);
        aoa.push([
          r.name || `(${r.placeholder || `교사 ${i + 1} 성함 기입`})`,
          ...mData.colHeaders.map(ch => r.cells?.[ch.key] || ""),
          rowSum > 0 ? rowSum : ""
        ]);
      });

      const ws = window.XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = [{ wch: 30 }, ...mData.colHeaders.map(() => ({ wch: 10 })), { wch: 24 }];
      const cleanSheetName = gName.replace(/[()\/·+\s]/g, "").slice(0, 15);
      window.XLSX.utils.book_append_sheet(wb, ws, cleanSheetName);
    });

    const fName = exportAllGroups
      ? `${schoolName}_${semNum}학기_전교과_시수배분표(교과협의회용).xlsx`
      : `${schoolName}_${semNum}학기_${groupName}_시수배분표(교과협의회용).xlsx`;
    window.XLSX.writeFile(wb, fName);
    setToast(`[${fName}] 엑셀 파일을 다운로드했습니다!`);
  };

  // [5단계] 정원 + 시간강사 기반 전 과목 담당교사 원클릭 자동 배정
  const autoAssignTeachersByQuota = () => {
    const deptPools = {};
    QUOTA_CATEGORIES.forEach(cat => {
      const regTeachers = teachers.filter(t => t.dept === cat && t.role !== "시간강사" && t.name.trim()).map(t => t.name.trim());
      const qCount = Math.max(regTeachers.length, Number(quota[cat] || 0), 1);
      const pool = [...regTeachers];
      while (pool.length < qCount) {
        pool.push(`${cat}교사${pool.length + 1}`);
      }
      deptPools[cat] = pool;
    });

    const socPool = ["도덕", "역사", "지리", "일반사회"].flatMap(d => deptPools[d] || []);
    const sciPool = ["물리", "화학", "생물", "지구과학"].flatMap(d => deptPools[d] || []);
    if (socPool.length > 0) deptPools["통합사회"] = socPool;
    if (sciPool.length > 0) deptPools["통합과학"] = sciPool;

    const loadMap = { 1: {}, 2: {} };
    const getLoad = (sem, tName) => loadMap[sem][tName] || 0;
    const addLoad = (sem, tName, h) => { loadMap[sem][tName] = (loadMap[sem][tName] || 0) + h; };

    const nextCurr = curriculum.map(it => ({ ...it }));

    [1, 2].forEach(semNum => {
      const semKey = semNum === 1 ? "sem1" : "sem2";
      // 시간강사 잔여 시수 추적
      const remLecHours = {};
      QUOTA_CATEGORIES.forEach(cat => {
        const h = Number(lecturerHours[cat]?.[semKey] || 0);
        if (h > 0) {
          remLecHours[cat] = { name: lecturerHours[cat]?.name || `${cat}강사`, rem: h };
        }
      });

      // 1) 선택과목: 같은 선택군(타임) 안에서 동일 교사가 중복되지 않도록 배정
      [2, 3].forEach(g => {
        const electives = nextCurr.filter(c => c.grade === g && c.sem === semNum && c.type === "선택" && !c.closed && c.sections > 0);
        const groups = Array.from(new Set(electives.map(e => e.group)));

        groups.forEach(grp => {
          const grpItems = electives.filter(e => e.group === grp);
          const kPick = Math.max(1, grpItems[0]?.pickCount || Number((grp.match(/택(\d+)/) || [])[1]) || 1);
          const bandBusyTeachers = Array.from({ length: kPick }, () => new Set());

          const subjSecAssign = {};
          grpItems.forEach(it => { subjSecAssign[it.id] = {}; });

          grpItems.forEach((subj, sIdx) => {
            const pool = deptPools[subj.dept] || [`${subj.dept}교사1`];
            const lecInfo = remLecHours[subj.dept];

            // customColCounts가 있으면 그 타임 배치를 따르고, 없으면 startCol 기준
            const secBandList = [];
            if (subj.customColCounts && Object.keys(subj.customColCounts).length > 0) {
              Object.entries(subj.customColCounts).forEach(([colStr, cnt]) => {
                const bIdx = (Number(colStr) - 1) % kPick;
                for (let k = 0; k < Number(cnt); k++) secBandList.push(bIdx);
              });
            } else {
              const offset = Math.max(0, (Number(subj.startCol) || (sIdx + 1)) - 1);
              for (let sec = 1; sec <= subj.sections; sec++) {
                secBandList.push((offset + sec - 1) % kPick);
              }
            }

            secBandList.forEach((bandIdx, idx) => {
              const sec = idx + 1;
              const busySet = bandBusyTeachers[bandIdx];

              let chosen = null;
              if (lecInfo && lecInfo.rem >= subj.credits && !busySet.has(lecInfo.name)) {
                chosen = lecInfo.name;
                lecInfo.rem -= subj.credits;
              } else {
                const available = pool.filter(t => !busySet.has(t)).sort((a, b) => getLoad(semNum, a) - getLoad(semNum, b));
                chosen = available[0] || pool.slice().sort((a, b) => getLoad(semNum, a) - getLoad(semNum, b))[0];
              }

              busySet.add(chosen);
              subjSecAssign[subj.id][sec] = chosen;
              addLoad(semNum, chosen, subj.credits);
            });
          });

          grpItems.forEach(subj => {
            const byTeacher = {};
            Object.entries(subjSecAssign[subj.id]).forEach(([secNum, tName]) => {
              if (!byTeacher[tName]) byTeacher[tName] = [];
              byTeacher[tName].push(Number(secNum));
            });
            subj.teacherAssign = Object.entries(byTeacher)
              .map(([tName, secs]) => `${tName}(${secs.join("·")}반)`)
              .join(", ");
          });
        });
      });

      // 2) 학교지정(공통) 과목: 통합사회·통합과학은 2단계에서 설정한 세부 교과별 지원 시수(sharedSupport)에 맞춰 배정!
      const remSharedSupport = {};
      ["도덕", "역사", "지리", "일반사회", "물리", "화학", "생물", "지구과학"].forEach(d => {
        remSharedSupport[d] = Number(sharedSupport[d]?.[semKey] || 0);
      });

      [1, 2, 3].forEach(g => {
        const fixedItems = nextCurr.filter(c => c.grade === g && c.sem === semNum && c.type === "지정" && !c.closed && c.sections > 0);
        fixedItems.forEach(subj => {
          const isSocShared = subj.dept === "통합사회" || subj.name.includes("통합사회");
          const isSciShared = subj.dept === "통합과학" || subj.name.includes("통합과학") || subj.name.includes("과학탐구실험");
          const majorDepts = isSocShared
            ? ["도덕", "역사", "지리", "일반사회"]
            : isSciShared
            ? ["물리", "화학", "생물", "지구과학"]
            : null;

          const pool = deptPools[subj.dept] || [`${subj.dept}교사1`];
          const lecInfo = remLecHours[subj.dept];
          const byTeacher = {};

          for (let sec = 1; sec <= subj.sections; sec++) {
            let chosen = null;
            if (lecInfo && lecInfo.rem >= subj.credits) {
              chosen = lecInfo.name;
              lecInfo.rem -= subj.credits;
            } else if (majorDepts) {
              // 지원 시수(remSharedSupport)가 남아 있는 세부 교과의 교사 풀에서 우선 배정
              const availDepts = majorDepts
                .filter(d => (remSharedSupport[d] || 0) > 0 && (deptPools[d]?.length || 0) > 0)
                .sort((a, b) => (remSharedSupport[b] || 0) - (remSharedSupport[a] || 0));
              const targetDept = availDepts[0] || majorDepts[0];
              const subPool = (deptPools[targetDept] || pool).slice().sort((a, b) => getLoad(semNum, a) - getLoad(semNum, b));
              chosen = subPool[0];
              remSharedSupport[targetDept] = Math.max(0, (remSharedSupport[targetDept] || 0) - subj.credits);
            } else {
              const sortedPool = pool.slice().sort((a, b) => getLoad(semNum, a) - getLoad(semNum, b));
              chosen = sortedPool[0];
            }
            if (!byTeacher[chosen]) byTeacher[chosen] = [];
            byTeacher[chosen].push(sec);
            addLoad(semNum, chosen, subj.credits);
          }
          subj.teacherAssign = Object.entries(byTeacher)
            .map(([tName, secs]) => `${tName}(${secs.join("·")}반)`)
            .join(", ");
        });
      });
    });

    setCurriculum(nextCurr);
    syncLecturersToTeacherList(lecturerHours);
    setToast("정원 및 2단계 시간강사 시수를 모두 반영하여 전 학년 담당교사를 동시타임 중복 없이 자동 배정했습니다!");
  };

  // 5단계: 교사 제약조건 양식 다운로드/업로드
  const downloadTeacherTemplateCSV = () => {
    const sampleRows = teachers.length > 0
      ? teachers.map(t => [t.name, t.dept, t.role, t.maxPerDay || 4, t.preferBlock ? "Y" : "N", (t.offDays || []).join("/"), (t.offSlots || []).join("/"), t.memo || ""])
      : [["홍길동(예시)", "국어", "정규교원", 4, "N", "금", "수-1", "수1교시 및 금요일 배제 예시"]];
    downloadCSV(
      `${schoolName}_교사배정_및_제약조건_양식.csv`,
      ["교사성명","담당교과(33개구분)","직위구분(정규교원/기간제/시간강사)","1일최대시수","블록타임선호(Y/N)","전일배제요일(월~금)","배제교시(예:수-1/금-5)","비고메모"],
      sampleRows
    );
  };

  const handleTeacherCSVUpload = async (file) => {
    if (!file) return;
    const text = await file.text();
    const lines = text.replace(/^\ufeff/, "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length < 2) return;
    const parsed = lines.slice(1).map((line, idx) => {
      const cols = line.split(",").map(c => c.replace(/^"|"$/g, "").trim());
      return {
        id: "t-up-" + idx + "-" + Date.now(),
        name: cols[0] || `교사${idx + 1}`,
        dept: cols[1] || "국어",
        role: cols[2] || "정규교원",
        maxPerDay: Number(cols[3]) || 4,
        preferBlock: String(cols[4] || "").toUpperCase() === "Y",
        offDays: (cols[5] || "").split(/[\/,;\s]+/).map(s => s.trim()).filter(Boolean),
        offSlots: (cols[6] || "").split(/[\/,;\s]+/).map(s => s.trim()).filter(Boolean),
        memo: cols[7] || ""
      };
    });
    setTeachers(parsed);
    if (parsed[0]) setSelectedTeacherId(parsed[0].id);
    setToast(`총 ${parsed.length}명의 교사 명단 및 시간표 제약조건을 업로드했습니다!`);
  };

  // =========================================================================
  // [6단계 핵심 개선]
  // 시간표가 꼬였을 때를 대비한 "단일 패스 엔진 + N회 시뮬레이션 최적 탐색(Best-of-N) + 자동 충돌 해소(Auto-Repair)"
  // =========================================================================
  const runSingleTimetableAttempt = (semNum) => {
    const classGrid = {};
    const teacherGrid = {};
    const teacherFatigue = {};
    const logs = [];
    const teacherRuleMap = {};
    teachers.forEach(t => {
      teacherRuleMap[t.name] = t;
      teacherFatigue[t.name] = { p1: 0, p4: 0, p7: 0, total: 0 };
    });

    const ensureFatigue = tName => {
      if (!teacherFatigue[tName]) teacherFatigue[tName] = { p1: 0, p4: 0, p7: 0, total: 0 };
    };

    const fixedChangcheMap = {};
    if (jayulMode === "fixed" && jayulSlot) fixedChangcheMap[jayulSlot] = "창체(자율)";
    if (jinroMode === "fixed" && jinroSlot) {
      fixedChangcheMap[jinroSlot] = fixedChangcheMap[jinroSlot] ? `${fixedChangcheMap[jinroSlot]}/진로` : "창체(진로)";
    }
    if (dongariMode === "fixed" && dongariSlot) {
      fixedChangcheMap[dongariSlot] = fixedChangcheMap[dongariSlot] ? `${fixedChangcheMap[dongariSlot]}/동아리` : "창체(동아리)";
    }

    for (let g = 1; g <= 3; g++) {
      const cCnt = classCounts[g] || 7;
      for (let c = 1; c <= cCnt; c++) {
        const cKey = `${g}-${c}`;
        classGrid[cKey] = {};
        DAYS.forEach(d => {
          const maxP = dayPeriods[d] || 6;
          for (let p = 1; p <= maxP; p++) {
            const slot = `${d}-${p}`;
            if (fixedChangcheMap[slot]) {
              classGrid[cKey][slot] = { subject: fixedChangcheMap[slot], teacher: "담임/담당", dept: "창체", fixed: true };
            } else {
              classGrid[cKey][slot] = null;
            }
          }
        });
      }
    }

    const canTeacherTake = (tName, slot, dName, ignoreSoftConstraint = false) => {
      if (!tName || tName === "담임/담당") return { ok: true };
      if (teacherGrid[tName]?.[slot]) {
        return { ok: false, reason: `${tName} 교사가 동시간대(${slot})에 [${teacherGrid[tName][slot].classKey} ${teacherGrid[tName][slot].subject}] 수업 중` };
      }
      const rule = teacherRuleMap[tName];
      if (rule && !ignoreSoftConstraint) {
        if ((rule.offDays || []).includes(dName)) {
          return { ok: false, reason: `${tName}(${rule.role})의 [${dName}요일 전일 배제] 요청` };
        }
        if ((rule.offSlots || []).includes(slot)) {
          return { ok: false, reason: `${tName}(${rule.role})의 [${slot}교시 배제] 요청` };
        }
        const dayCnt = Object.keys(teacherGrid[tName] || {}).filter(k => k.startsWith(dName + "-")).length;
        if (dayCnt >= (rule.maxPerDay || 4)) {
          return { ok: false, reason: `${tName} 교사의 1일 최대시수(${rule.maxPerDay || 4}h) 초과 방지` };
        }
      }
      return { ok: true };
    };

    const calcSlotScore = (tName, dName, pNum) => {
      ensureFatigue(tName);
      const fat = teacherFatigue[tName];
      let score = Math.random() * 1.8;
      if (pNum === 1) score += fat.p1 * 6;
      if (pNum === 4) score += fat.p4 * 5;
      if (pNum === 7) score += fat.p7 * 6;
      const dayLoad = Object.keys(teacherGrid[tName] || {}).filter(k => k.startsWith(dName + "-")).length;
      score += dayLoad * 3;
      return score;
    };

    const assignClassSlot = (cKey, slot, cellObj, recordTeacher = true) => {
      classGrid[cKey][slot] = cellObj;
      const pNum = Number(slot.split("-")[1]);
      if (recordTeacher && cellObj.teacher && cellObj.teacher !== "담임/담당") {
        cellObj.teacher.split(",").map(s => s.trim()).filter(Boolean).forEach(tName => {
          const cleanT = tName.replace(/\(.*\)/, "").trim();
          if (!teacherGrid[cleanT]) teacherGrid[cleanT] = {};
          teacherGrid[cleanT][slot] = { classKey: `${cKey}반`, subject: cellObj.subject };
          ensureFatigue(cleanT);
          teacherFatigue[cleanT].total++;
          if (pNum === 1) teacherFatigue[cleanT].p1++;
          if (pNum === 4) teacherFatigue[cleanT].p4++;
          if (pNum === 7) teacherFatigue[cleanT].p7++;
        });
      }
    };

    let hardConflictCount = 0;
    let softWarningCount = 0;

    // 1. 선택군(A~E 타임) 우선 배치 (분반 수가 많고 시간강사가 포함된 타임부터 우선 배치!)
    const activeBandPlan = buildDefaultBandsForCurriculum(curriculum, quota, lecturerHours, classCounts);
    [3, 2].forEach(g => {
      const cCnt = classCounts[g] || 7;
      const groupKeys = shuffleArray(Object.keys(activeBandPlan).filter(k => k.startsWith(`${g}_${semNum}_`)));

      groupKeys.forEach(gk => {
        const grpName = gk.split("_").slice(2).join("_");
        const bandsObj = activeBandPlan[gk] || {};
        const bandEntries = shuffleArray(Object.entries(bandsObj));

        bandEntries.forEach(([bandName, secList]) => {
          if (!secList.length) return;
          const credits = secList[0]?.credits || 3;
          const bandLabel = `${bandName}(${grpName})`;

          const usedInThisBand = new Set();
          const secTeacherAssignments = secList.map(sec => {
            const subjObj = curriculum.find(x => x.id === sec.subjId);
            const maxQ = Number(quota[sec.dept] || 6);
            let tName = parseAssignedTeacher(subjObj?.teacherAssign || "", sec.secNum, sec.dept, maxQ);
            if (usedInThisBand.has(tName)) {
              for (let altIdx = 1; altIdx <= maxQ; altIdx++) {
                const candidateT = `${sec.dept}교사${altIdx}`;
                if (!usedInThisBand.has(candidateT)) {
                  logs.push({
                    level: "타임내 교사중복 자동분산",
                    target: `${g}학년 ${bandName} ${sec.name}(${sec.secNum}반)`,
                    slot: bandName,
                    reason: `동일 타임(${bandName}) 내 ${tName} 교사 중복 배정을 방지하기 위해 [${candidateT}] 교사로 자동 분산 배정함`
                  });
                  tName = candidateT;
                  break;
                }
              }
            }
            usedInThisBand.add(tName);
            return { ...sec, teacher: tName };
          });

          const bandTeachers = Array.from(new Set(secTeacherAssignments.map(x => x.teacher)));

          let remaining = credits;
          const allCandidateSlots = [];
          shuffleArray(DAYS).forEach(d => {
            const maxP = dayPeriods[d] || 6;
            for (let p = 1; p <= maxP; p++) allCandidateSlots.push({ d, p, slot: `${d}-${p}` });
          });

          const recordBandSlot = (slot) => {
            const pNum = Number(slot.split("-")[1]);
            for (let c = 1; c <= cCnt; c++) {
              assignClassSlot(`${g}-${c}`, slot, {
                subject: bandLabel,
                teacher: `${bandName} 이동수업(${secList.length}개 분반)`,
                dept: "이동수업",
                isBand: true
              }, false);
            }
            secTeacherAssignments.forEach(sItem => {
              const cleanT = sItem.teacher;
              if (!teacherGrid[cleanT]) teacherGrid[cleanT] = {};
              teacherGrid[cleanT][slot] = { classKey: `${g}학년 ${bandName}`, subject: `${sItem.name}(${sItem.secNum}반)` };
              ensureFatigue(cleanT);
              teacherFatigue[cleanT].total++;
              if (pNum === 1) teacherFatigue[cleanT].p1++;
              if (pNum === 4) teacherFatigue[cleanT].p4++;
              if (pNum === 7) teacherFatigue[cleanT].p7++;
            });
          };

          for (const cand of allCandidateSlots) {
            if (remaining <= 0) break;
            const { d, slot } = cand;
            const alreadyOnDay = Object.keys(classGrid[`${g}-1`]).some(k => k.startsWith(d + "-") && classGrid[`${g}-1`][k]?.subject === bandLabel);
            if (alreadyOnDay) continue;
            const allFree = Array.from({ length: cCnt }, (_, i) => classGrid[`${g}-${i + 1}`][slot] === null).every(Boolean);
            if (!allFree) continue;
            if (bandTeachers.some(t => !canTeacherTake(t, slot, d, false).ok)) continue;

            recordBandSlot(slot);
            remaining--;
          }

          if (remaining > 0) {
            for (const cand of allCandidateSlots) {
              if (remaining <= 0) break;
              const { d, slot } = cand;
              const allFree = Array.from({ length: cCnt }, (_, i) => classGrid[`${g}-${i + 1}`][slot] === null).every(Boolean);
              if (!allFree) continue;
              if (bandTeachers.some(t => teacherGrid[t]?.[slot])) continue;

              const softReason = bandTeachers.map(t => canTeacherTake(t, slot, d, false)).find(r => !r.ok)?.reason;
              if (softReason) {
                softWarningCount++;
                logs.push({
                  level: "조정됨",
                  target: `${g}학년 ${bandLabel}`,
                  slot,
                  reason: `${softReason} 조건이 있었으나, ${g}학년 전 학급 동시 이동수업 슬롯 확보를 위해 [${slot}]에 우선 배정함`
                });
              }
              recordBandSlot(slot);
              remaining--;
            }
          }
        });
      });
    });

    // 2. 1·2·3학년 학교지정 과목 배치 (시간강사 및 블록타임 희망 교사 최우선 배치!)
    [1, 2, 3].forEach(g => {
      const cCnt = classCounts[g] || 7;
      const fixedSubjs = [...curriculum.filter(it => it.grade === g && it.sem === semNum && it.type === "지정" && !it.closed)];
      if (jayulMode === "random") {
        fixedSubjs.push({ id: `fl-jayul-${g}`, grade: g, sem: semNum, type: "지정", name: "창체(자율)", credits: 1, dept: "창체", teacherAssign: "담임/담당" });
      }
      if (jinroMode === "random") {
        fixedSubjs.push({ id: `fl-jinro-${g}`, grade: g, sem: semNum, type: "지정", name: "창체(진로)", credits: 1, dept: "창체", teacherAssign: "담임/담당" });
      }
      if (dongariMode === "random") {
        fixedSubjs.push({ id: `fl-dong-${g}`, grade: g, sem: semNum, type: "지정", name: "창체(동아리)", credits: 1, dept: "창체", teacherAssign: "담임/담당" });
      }

      const classOrder = shuffleArray(Array.from({ length: cCnt }, (_, i) => i + 1));
      classOrder.forEach(c => {
        const cKey = `${g}-${c}`;
        // 시간강사 또는 배제조건이 많은 교사의 과목을 먼저 배치하여 막힘(Deadlock) 방지
        const orderedSubjs = shuffleArray(fixedSubjs).sort((a, b) => {
          const tA = parseAssignedTeacher(a.teacherAssign, c, a.dept, Number(quota[a.dept] || 6));
          const tB = parseAssignedTeacher(b.teacherAssign, c, b.dept, Number(quota[b.dept] || 6));
          const rA = teacherRuleMap[tA];
          const rB = teacherRuleMap[tB];
          const prioA = (rA?.role === "시간강사" ? 100 : 0) + ((rA?.offDays?.length || 0) * 20) + (rA?.preferBlock ? 10 : 0);
          const prioB = (rB?.role === "시간강사" ? 100 : 0) + ((rB?.offDays?.length || 0) * 20) + (rB?.preferBlock ? 10 : 0);
          return prioB - prioA;
        });

        orderedSubjs.forEach(subj => {
          const maxQ = Number(quota[subj.dept] || 6);
          const tName = subj.dept === "창체" ? "담임/담당" : parseAssignedTeacher(subj.teacherAssign, c, subj.dept, maxQ);
          const tRule = teacherRuleMap[tName];
          let rem = subj.credits;

          if (tRule?.preferBlock && rem >= 2) {
            for (const d of shuffleArray(DAYS)) {
              if (rem < 2) break;
              const maxP = dayPeriods[d] || 6;
              for (let p = 1; p < maxP; p++) {
                const s1 = `${d}-${p}`, s2 = `${d}-${p + 1}`;
                if (classGrid[cKey][s1] === null && classGrid[cKey][s2] === null) {
                  if (canTeacherTake(tName, s1, d, false).ok && canTeacherTake(tName, s2, d, false).ok) {
                    assignClassSlot(cKey, s1, { subject: subj.name, teacher: tName, dept: subj.dept, isBlock: true });
                    assignClassSlot(cKey, s2, { subject: subj.name, teacher: tName, dept: subj.dept, isBlock: true });
                    rem -= 2;
                    break;
                  }
                }
              }
            }
          }

          const getSortedAvailableSlots = (ignoreSameDay, ignoreSoft) => {
            const list = [];
            DAYS.forEach(d => {
              const maxP = dayPeriods[d] || 6;
              if (!ignoreSameDay) {
                const hasSame = Array.from({ length: maxP }, (_, i) => classGrid[cKey][`${d}-${i + 1}`]?.subject === subj.name).some(Boolean);
                if (hasSame) return;
              }
              for (let p = 1; p <= maxP; p++) {
                const slot = `${d}-${p}`;
                if (classGrid[cKey][slot] !== null) continue;
                const check = canTeacherTake(tName, slot, d, ignoreSoft);
                if (check.ok) {
                  list.push({ d, p, slot, score: calcSlotScore(tName, d, p) });
                }
              }
            });
            return list.sort((a, b) => a.score - b.score);
          };

          while (rem > 0) {
            const candidates = getSortedAvailableSlots(false, false);
            if (!candidates.length) break;
            assignClassSlot(cKey, candidates[0].slot, { subject: subj.name, teacher: tName, dept: subj.dept });
            rem--;
          }
          while (rem > 0) {
            const candidates = getSortedAvailableSlots(true, false);
            if (!candidates.length) break;
            assignClassSlot(cKey, candidates[0].slot, { subject: subj.name, teacher: tName, dept: subj.dept });
            rem--;
          }
          while (rem > 0) {
            const candidates = getSortedAvailableSlots(true, true);
            if (!candidates.length) break;
            const chosen = candidates[0];
            const strictCheck = canTeacherTake(tName, chosen.slot, chosen.d, false);
            softWarningCount++;
            assignClassSlot(cKey, chosen.slot, { subject: subj.name, teacher: tName, dept: subj.dept, warning: strictCheck.reason });
            logs.push({
              level: "요구사항 미반영(내부조율)",
              target: `${cKey}반 ${subj.name} (${tName})`,
              slot: chosen.slot,
              reason: `${strictCheck.reason} 요청이 있으나, ${cKey}반 가용 교시 및 타 학년 수업 충돌 방지를 위해 [${chosen.slot}]에 배치됨`
            });
            rem--;
          }
          // [자동 충돌 해소(Kempe Swap Repair)] 빈 칸은 있는데 해당 교사가 다른 반 수업 중일 때,
          // 같은 반의 이미 배정된 다른 과목 칸과 맞바꿔서 충돌 없이 들어갈 수 있는지 탐색!
          if (rem > 0) {
            const emptySlots = [];
            DAYS.forEach(d => {
              const maxP = dayPeriods[d] || 6;
              for (let p = 1; p <= maxP; p++) {
                const sl = `${d}-${p}`;
                if (classGrid[cKey][sl] === null) emptySlots.push(sl);
              }
            });

            for (const emptySl of emptySlots) {
              if (rem <= 0) break;
              let swapped = false;
              for (const d of DAYS) {
                if (swapped) break;
                const maxP = dayPeriods[d] || 6;
                for (let p = 1; p <= maxP; p++) {
                  const occupiedSl = `${d}-${p}`;
                  const occCell = classGrid[cKey][occupiedSl];
                  if (!occCell || occCell.fixed || occCell.isBand || occCell.isBlock) continue;
                  const otherT = occCell.teacher.replace(/\(.*\)/, "").trim();
                  // tName이 occupiedSl에 비어 있고, otherT가 emptySl에 비어 있으면 두 수업을 스왑하여 충돌 완벽 해결!
                  if (!teacherGrid[tName]?.[occupiedSl] && (!otherT || otherT === "담임/담당" || !teacherGrid[otherT]?.[emptySl])) {
                    classGrid[cKey][emptySl] = occCell;
                    if (otherT && otherT !== "담임/담당" && teacherGrid[otherT]) {
                      delete teacherGrid[otherT][occupiedSl];
                      teacherGrid[otherT][emptySl] = { classKey: `${cKey}반`, subject: occCell.subject };
                    }
                    assignClassSlot(cKey, occupiedSl, { subject: subj.name, teacher: tName, dept: subj.dept });
                    rem--;
                    swapped = true;
                    break;
                  }
                }
              }
            }
          }

          if (rem > 0) {
            for (const d of DAYS) {
              const maxP = dayPeriods[d] || 6;
              for (let p = 1; p <= maxP; p++) {
                if (rem <= 0) break;
                const slot = `${d}-${p}`;
                if (classGrid[cKey][slot] === null) {
                  const conflictInfo = teacherGrid[tName]?.[slot];
                  hardConflictCount++;
                  assignClassSlot(cKey, slot, { subject: subj.name, teacher: `${tName}(조율필요)`, dept: subj.dept, conflict: true });
                  logs.push({
                    level: "교사 동시간 중복(클릭 맞교체 필요)",
                    target: `${cKey}반 ${subj.name} (${tName})`,
                    slot,
                    reason: `${tName} 교사가 [${slot}]에 ${conflictInfo?.classKey || "타"} 수업과 겹침 → 시간표 칸을 클릭하면 초록색으로 표시되는 안전 교시와 맞교체하세요.`
                  });
                  rem--;
                }
              }
            }
          }
        });
      });
    });

    // ★ [우리 학교 정원 구성 기반 시간표 진단 및 맞춤형 조언 생성기]
    const schoolQuotaAdvices = [];
    const semKey = semNum === 1 ? "sem1" : "sem2";

    // 진단 1: 선택과목 이동수업 타임(Band) 내에서 우리 학교 교과별 가용 교사 수(정원+시간강사)를 초과해 개설된 경우
    [2, 3].forEach(g => {
      const groupKeys = Object.keys(activeBandPlan).filter(k => k.startsWith(`${g}_${semNum}_`));
      groupKeys.forEach(gk => {
        const grpName = gk.split("_").slice(2).join("_");
        const bandsObj = activeBandPlan[gk] || {};
        Object.entries(bandsObj).forEach(([bandName, secList]) => {
          const deptCountsInBand = {};
          secList.forEach(sec => {
            deptCountsInBand[sec.dept] = (deptCountsInBand[sec.dept] || 0) + 1;
          });
          Object.entries(deptCountsInBand).forEach(([d, cnt]) => {
            const regQ = Math.max(0, Number(quota[d] || 0));
            const lecH = Number(lecturerHours[d]?.[semKey] || 0);
            const availT = regQ + (lecH > 0 ? 1 : 0);
            if (cnt > availT) {
              schoolQuotaAdvices.push({
                severity: "critical",
                title: `[${g}학년 ${bandName} · ${grpName}] '${d}' 교과 동시 투입 교사 부족 (필요 ${cnt}명 > 우리학교 가용 ${availT}명)`,
                detail: `현재 ${g}학년 ${bandName}에 [${d}] 교과 분반이 동시에 ${cnt}개 반 열려 있으나, 우리 학교 [${d}] 정규 정원(${regQ}명)${lecH > 0 ? "+시간강사(1명)" : ""}은 총 ${availT}명뿐이라 한 교시에 ${cnt}개 반을 동시에 수업할 수 없습니다.`,
                action: grpName.includes("택1")
                  ? `👉 [해결 조언] '${grpName}'처럼 단일 선택군은 전 학급 동시 이동수업(1개 타임)으로 묶지 마시고, 4단계 시수배분표에서 교사 1명이 1~7반을 서로 다른 교시에 순차적으로 들어가도록 분산하거나 2단계에서 [${d}] 시간강사를 추가해 주세요.`
                  : `👉 [해결 조언] ① 3단계에서 [${g}학년 ${semNum}학기]의 다른 대안(시간표최적 안)을 선택하여 [${d}] 분반을 A·B·C 타임으로 쪼개거나, ② 2단계에서 [${d}] 시간강사를 채용(또는 교양 과목일 경우 정원이 여유 있는 타 교과로 이관)해 주세요.`
              });
            }
          });
        });
      });
    });

    // 진단 2: 전 학년(1·2·3학년) 주간 총 수업 시수가 우리 학교 해당 교과 정원의 최대 한계치를 초과하거나 빡빡한 경우
    QUOTA_CATEGORIES.forEach(cat => {
      if (cat === "통합사회" || cat === "통합과학") return;
      const regQ = Number(quota[cat] || 0);
      const lecH = Number(lecturerHours[cat]?.[semKey] || 0);
      const reqH = hoursByDept[cat]?.[semKey] || 0;
      const isSharedMajor = ["도덕", "역사", "지리", "일반사회", "물리", "화학", "생물", "지구과학"].includes(cat);
      const supH = isSharedMajor ? Number(sharedSupport[cat]?.[semKey] || 0) : 0;
      const totalNeedH = reqH + supH;
      if (totalNeedH <= 0) return;

      const netNeedForReg = Math.max(0, totalNeedH - lecH);
      const perTeacher = regQ > 0 ? (netNeedForReg / regQ) : 99;

      if (regQ === 0 && lecH < totalNeedH) {
        schoolQuotaAdvices.push({
          severity: "critical",
          title: `[${cat} 교과] 정규 정원 0명 상태에서 ${totalNeedH}h 수업 편성됨`,
          detail: `우리 학교 [${cat}] 정규 정원이 0명인데 ${semNum}학기에 총 ${totalNeedH}h의 수업이 배정되어 시간표 교사 배정이 불가능합니다.`,
          action: `👉 [해결 조언] 2단계에서 [${cat}] 돋보기를 눌러 해당 과목을 실제로 수업하실 다른 교과(예: 일반사회, 도덕, 국어 등) 정원으로 이관하거나, 시간강사 시수(${totalNeedH}h)를 입력해 주세요.`
        });
      } else if (perTeacher >= 21) {
        schoolQuotaAdvices.push({
          severity: "warning",
          title: `[${cat} 교과] 교사 1인당 평균 시수 과중 (${perTeacher.toFixed(1)}h / 정원 ${regQ}명)`,
          detail: `[${cat}] 교과의 ${semNum}학기 총 시수(${totalNeedH}h, 통합지원 ${supH}h 포함)가 정원(${regQ}명) 대비 매우 높아, 1·2·3학년 이동수업과 공통과목 교시가 서로 겹칠 확률이 높습니다.`,
          action: `👉 [해결 조언] ${ isSharedMajor ? `2단계에서 [⚖️ 통합사회/통합과학 1/N 균등 지원 자동계산]을 눌러 [${cat}]의 1학년 공통과목 지원 시수를 줄이거나, ` : "" }2단계에서 시간강사 시수를 추가해 정규교사당 시수를 18h 이하로 낮추면 충돌이 즉시 사라집니다.`
        });
      }
    });

    // 진단 3: 5단계에서 분반별 담당교사 지정이 안 되어(또는 1명의 교사에게 전 학년 과목이 몰려) 동시간 중복(hardConflictCount)이 발생한 경우
    if (hardConflictCount > 0) {
      const conflictTeachers = Array.from(new Set(logs.filter(l => l.level.includes("중복")).map(l => {
        const m = l.target.match(/\(([^)]+)\)/);
        return m ? m[1] : "";
      }).filter(Boolean)));

      schoolQuotaAdvices.push({
        severity: "critical",
        title: `교사 동시간 수업 중복 ${hardConflictCount}건 발생 (대상: ${conflictTeachers.join(", ")})`,
        detail: `위 선생님이 담당하는 학급(또는 학년) 수업 시수가 주간 가용 교시(32h) 중 이동수업 타임이나 타 학년 수업과 겹쳐 빈 교시를 찾지 못했습니다.`,
        action: `👉 [해결 조언] ① 5단계 상단의 [⚡ 정원+시간강사 기반 전 과목 자동 배정] 버튼을 눌러 한 선생님께 몰린 반들을 우리 학교 정원 인원수만큼 골고루 나누어 주시거나, ② 5단계 하단에서 해당 선생님의 과도한 배제요일/배제교시를 완화한 뒤 [🔥 AI 최적 시간표 탐색 (30회 시뮬레이션)]을 다시 눌러보세요.`
      });
    }

    return {
      sem: semNum,
      classGrid,
      teacherGrid,
      teacherFatigue,
      logs,
      hardConflictCount,
      softWarningCount,
      schoolQuotaAdvices,
      generatedAt: new Date().toLocaleTimeString("ko-KR")
    };
  };

  // [신규] N회(기본 1회 또는 30회 최적 탐색) 시뮬레이션 후 가장 충돌이 적은 최상의 시간표 채택
  const generateFullTimetable = (semNum, isReroll = false, maxAttempts = 1) => {
    let bestResult = null;
    for (let i = 0; i < maxAttempts; i++) {
      const candidate = runSingleTimetableAttempt(semNum);
      if (!bestResult) {
        bestResult = candidate;
      } else {
        const candScore = candidate.hardConflictCount * 1000 + candidate.softWarningCount * 10;
        const bestScore = bestResult.hardConflictCount * 1000 + bestResult.softWarningCount * 10;
        if (candScore < bestScore) {
          bestResult = candidate;
        }
      }
      if (bestResult.hardConflictCount === 0 && bestResult.softWarningCount === 0) break;
    }

    setMasterSchedule(bestResult);
    setSwapSource(null);
    if (!isReroll) {
      setViewMode("class");
      setViewTarget("1-1");
    }
    if (maxAttempts > 1) {
      setToast(`${maxAttempts}회 AI 시뮬레이션 탐색 완료! (충돌 ${bestResult.hardConflictCount}건 / 내부조율 ${bestResult.softWarningCount}건인 최적 시간표 채택)`);
    } else {
      setToast(`${semNum}학기 주간 시간표 ${isReroll ? "랜덤 재생성(Re-roll)" : "자동 생성"} 완료!`);
    }
  };

  // [신규] 수동 맞교체 시 두 교사가 모두 충돌하지 않는 "안전 교체 가능 교시(초록불)" 판별 함수
  const isSlotSafeForSwap = (targetSlot) => {
    if (!masterSchedule || viewMode !== "class" || !swapSource || swapSource === targetSlot) return false;
    const cellA = masterSchedule.classGrid[viewTarget]?.[swapSource];
    const cellB = masterSchedule.classGrid[viewTarget]?.[targetSlot];
    if (!cellA || cellA.isBand || cellA.fixed) return false;
    if (cellB?.isBand || cellB?.fixed) return false;

    const tA = cellA.teacher?.replace(/\(.*\)/, "").trim();
    const tB = cellB?.teacher?.replace(/\(.*\)/, "").trim();

    // tA가 targetSlot에 다른 반 수업이 없어야 하고, tB가 swapSource에 다른 반 수업이 없어야 안전!
    const tABusyAtTarget = tA && tA !== "담임/담당" && masterSchedule.teacherGrid[tA]?.[targetSlot] && masterSchedule.teacherGrid[tA]?.[targetSlot].classKey !== `${viewTarget}반`;
    const tBBusyAtSource = tB && tB !== "담임/담당" && masterSchedule.teacherGrid[tB]?.[swapSource] && masterSchedule.teacherGrid[tB]?.[swapSource].classKey !== `${viewTarget}반`;

    return !tABusyAtTarget && !tBBusyAtSource;
  };

  // 학급 시간표 셀 수동 맞교체 시 교사 시간표(teacherGrid)까지 즉시 동기화
  const handleCellSwap = (slot) => {
    if (!masterSchedule || viewMode !== "class") return;
    if (!swapSource) {
      setSwapSource(slot);
      return;
    }
    if (swapSource === slot) {
      setSwapSource(null);
      return;
    }
    const cellA = masterSchedule.classGrid[viewTarget][swapSource];

                                  </tr>
                                ))}
                            </tbody>
                          </table>
                        </div>
                      </section>

                      {/* ★ 신규: 우리 학교 정원 구성 기반 시간표 진단 및 맞춤형 해결 조언 패널 */}
                      <section className={`${PANEL} p-4 space-y-3 border-2 ${masterSchedule.schoolQuotaAdvices?.length > 0 ? "border-rose-300 bg-rose-50/30" : "border-emerald-300 bg-emerald-50/30"}`}>
                        <div className="flex items-center justify-between border-b border-line pb-2">
                          <h3 className="text-xs font-extrabold text-ink">
                            🏥 {schoolName} 정원 구성 기반 시간표 AI 진단 및 해결 조언 ({masterSchedule.schoolQuotaAdvices?.length || 0}건)
                          </h3>
                          <span className={`rounded px-2 py-0.5 text-[10px] font-extrabold ${masterSchedule.hardConflictCount === 0 ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"}`}>
                            {masterSchedule.hardConflictCount === 0 ? "✔ 시간표 완성 가능" : `⚠️ 충돌 ${masterSchedule.hardConflictCount}건 조율 필요`}
                          </span>
                        </div>
                        {masterSchedule.schoolQuotaAdvices && masterSchedule.schoolQuotaAdvices.length > 0 ? (
                          <div className="max-h-72 overflow-y-auto space-y-2.5 pr-1">
                            {masterSchedule.schoolQuotaAdvices.map((adv, aIdx) => (
                              <div key={aIdx} className={`rounded-xl border p-3 text-xs space-y-1.5 shadow-sm ${adv.severity === "critical" ? "border-rose-300 bg-white text-rose-950" : "border-amber-300 bg-white text-amber-950"}`}>
                                <p className="font-extrabold text-rose-800">🚨 {adv.title}</p>
                                <p className="text-[11px] leading-relaxed text-slate-700">{adv.detail}</p>
                                <div className="rounded-lg bg-indigo-50/80 border border-indigo-200 p-2 text-[11px] font-bold text-indigo-950 leading-relaxed">
                                  {adv.action}
                                </div>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <div className="rounded-xl border border-emerald-200 bg-white p-4 text-xs font-bold text-emerald-900 leading-relaxed">
                            ✅ 현재 {schoolName}의 교과별 정규정원·시간강사 구성과 3단계 선택과목 이동수업 타임 배치가 완벽히 맞물려, 교사 부족이나 동시간 중복 없이 주간 시간표가 정상 완성되었습니다!
                          </div>
                        )}
                      </section>

                      <section className={`${PANEL} p-4 flex-1 space-y-3`}>
                        <h3 className="text-xs font-extrabold text-amber-900">🔍 자동 조율 및 요구사항 반영 리포트 ({masterSchedule.logs.length}건)</h3>
                        {masterSchedule.logs.length > 0 ? (
                          <div className="max-h-64 overflow-y-auto space-y-2 pr-1">
                            {masterSchedule.logs.map((lg, idx) => (
                              <div key={idx} className="rounded-xl border border-amber-300 bg-amber-50/60 p-3 text-xs space-y-1">
                                <div className="flex items-center justify-between gap-2">
                                  <span className="font-bold text-ink">{lg.target}</span>
                                  <span className="no-wrap-badge rounded bg-white px-2 py-0.5 text-[10px] font-bold text-brand border border-line">{lg.slot}</span>
                                </div>
                                <p className="leading-5 text-slate-700">{lg.reason}</p>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <div className="rounded-xl border border-emerald-200 bg-emerald-50 p-6 text-center text-xs font-bold text-emerald-800">
                            🎉 모든 선생님(및 시간강사)의 공강·배제교시·블록타임 및 이동수업 동시 타임이 100% 충돌 없이 완벽하게 반영되었습니다!
                          </div>
                        )}
                      </section>
                    </aside>
                  </div>
                ) : (
                  <div className="p-12 text-center text-sm text-slate-500">
                    상단의 <strong>[🔥 AI 최적 시간표 탐색 (30회 시뮬레이션)]</strong> 또는 <strong>[⚡ 1학기/2학기 생성]</strong> 버튼을 눌러주세요.
                  </div>
                )}
              </section>
            </div>
          )}
        </main>
      </div>

      <footer className="mt-10 border-t border-line bg-white px-6 py-4 text-xs text-slate-500">
        <div className="mx-auto flex max-w-[1600px] flex-wrap items-center justify-between gap-2">
          <div>
            <strong className="text-ink">© {new Date().getFullYear()} {schoolName}. All rights reserved.</strong>
            <span className="ml-2 text-[11px] text-slate-400">본 프로그램의 알고리즘, 화면 설계 및 소스코드의 무단 복제·변형·재배포를 금합니다.</span>
          </div>
          <span>고교학점제 교육과정·정원·시간표 편성 스튜디오</span>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TimetableStudioApp />);
</script>
</body>
</html>
